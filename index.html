<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>VR - Grab & Movement</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

  <!-- movement-controls -->
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.0/dist/aframe-extras.min.js"></script>

  <!-- Moteur physique (cannon.js) : collisions, gravité, frottement -->
  <script src="https://cdn.jsdelivr.net/npm/aframe-physics-system@4/dist/aframe-physics-system.min.js"></script>

  <script>
    // Mouvement avec le joystick gauche
    AFRAME.registerComponent('left-thumbstick-move', {

      schema: {
        rig: { type: 'selector' },
        speed: { type: 'number', default: 2.0 }
      },

      init: function () {

        this.axisX = 0;
        this.axisY = 0;

        this.onThumbstick = this.onThumbstick.bind(this);

        this.el.addEventListener(
          'thumbstickmoved',
          this.onThumbstick
        );
      },

      onThumbstick: function (event) {

        this.axisX = event.detail.x || 0;
        this.axisY = event.detail.y || 0;

      },

      tick: function (time, delta) {

        if (!this.data.rig) return;

        if (!delta) return;

        /*
         * A-Frame donne :
         * y < 0 = avant
         * y > 0 = arrière
         */

        const x = this.axisX;
        const z = -this.axisY;

        if (Math.abs(x) < 0.05 && Math.abs(z) < 0.05) {
          return;
        }

        const dt = delta / 1000;
        const direction = new THREE.Vector3(
          x,
          0,
          z
        );

        direction.applyAxisAngle(
          new THREE.Vector3(0, 1, 0),
          this.data.rig.object3D.rotation.y
        );

        this.data.rig.object3D.position.x +=
          direction.x * this.data.speed * dt;

        this.data.rig.object3D.position.z +=
          direction.z * this.data.speed * dt;
      }

    });


    // Rotation avec le joystick droit
    AFRAME.registerComponent('joystick-turn', {

      schema: {
        speed: {
          type: 'number',
          default: 1.8
        }
      },

      init: function () {

        this.axisX = 0;

        this.el.addEventListener(
          'thumbstickmoved',
          (event) => {
            this.axisX = event.detail.x || 0;
          }
        );
      },

      tick: function (time, delta) {

        if (!delta) return;

        if (Math.abs(this.axisX) < 0.1) {
          return;
        }

        const dt = delta / 1000;

        this.el.parentEl.object3D.rotation.y -=
          this.axisX * this.data.speed * dt;
      }

    });

    // custom cursor pour le laser
    AFRAME.registerComponent('laser-cursor', {

      schema: {
        color: {
          type: 'color',
          default: '#00FFFF'
        }
      },

      init: function () {

        this.cursor = document.createElement('a-sphere');

        this.cursor.setAttribute(
          'radius',
          '0.018'
        );

        this.cursor.setAttribute(
          'color',
          this.data.color
        );

        this.cursor.setAttribute(
          'visible',
          'false'
        );

        this.cursor.setAttribute(
          'material',
          'shader: flat; opacity: 0.95'
        );

        this.el.sceneEl.appendChild(
          this.cursor
        );


        this.onIntersection =
          this.onIntersection.bind(this);

        this.onClear =
          this.onClear.bind(this);


        this.el.addEventListener(
          'raycaster-intersection',
          this.onIntersection
        );

        this.el.addEventListener(
          'raycaster-intersection-cleared',
          this.onClear
        );
      },


      onIntersection: function (event) {

        const raycaster =
          this.el.components.raycaster;

        if (!raycaster) return;

        const intersections =
          raycaster.intersections;

        if (
          !intersections ||
          intersections.length === 0
        ) {
          return;
        }


        const hit =
          intersections[0];

        if (!hit || !hit.point) {
          return;
        }


        if (
          !hit.object ||
          !hit.object.el
        ) {
          return;
        }


        let target =
          hit.object.el;

        while (
          target &&
          !target.classList.contains('grabbable') &&
          target.parentEl
        ) {
          target = target.parentEl;
        }


        if (
          !target ||
          !target.classList.contains('grabbable')
        ) {
          this.cursor.setAttribute(
            'visible',
            'false'
          );

          return;
        }


        this.cursor.object3D.position.copy(
          hit.point
        );

        this.cursor.setAttribute(
          'visible',
          'true'
        );
      },


      onClear: function () {

        this.cursor.setAttribute(
          'visible',
          'false'
        );
      },


      remove: function () {

        if (this.cursor) {
          this.cursor.remove();
        }

        this.el.removeEventListener(
          'raycaster-intersection',
          this.onIntersection
        );

        this.el.removeEventListener(
          'raycaster-intersection-cleared',
          this.onClear
        );
      }

    });


    // Grab avec le laser + trigger, compatible moteur physique (cannon.js)
    AFRAME.registerComponent('laser-grab', {

      schema: {
        rig: {
          type: 'selector'
        }
      },


      init: function () {

        this.grabbed = null;

        this.localPosition = new THREE.Vector3();
        this.localQuaternion = new THREE.Quaternion();
        this.controllerPosition = new THREE.Vector3();
        this.controllerQuaternion = new THREE.Quaternion();
        this.tempPosition = new THREE.Vector3();
        this.tempQuaternion = new THREE.Quaternion();

        // --- pour le calcul de la vitesse de lancer ---
        this.prevControllerPosition = new THREE.Vector3();
        this.hasPrevPosition = false;
        this.velocityHistory = []; // moyenne glissante des dernières vitesses
        // ------------------------------------------------

        this.el.addEventListener('triggerdown', () => {
          this.startGrab();
        });

        this.el.addEventListener('triggerup', () => {
          this.endGrab();
        });
      },


      startGrab: function () {

        console.log(
          'TRIGGER DOWN'
        );


        const raycaster =
          this.el.components.raycaster;


        if (!raycaster) {

          console.warn(
            'Raycaster absent'
          );

          return;
        }


        const intersections =
          raycaster.intersections;


        if (
          !intersections ||
          intersections.length === 0
        ) {

          console.log(
            'Trigger pressé mais aucun objet'
          );

          return;
        }

        let target = null;


        for (
          let i = 0;
          i < intersections.length;
          i++
        ) {

          let candidate =
            intersections[i].object &&
            intersections[i].object.el;


          while (
            candidate &&
            !candidate.classList.contains('grabbable') &&
            candidate.parentEl
          ) {

            candidate =
              candidate.parentEl;
          }


          if (
            candidate &&
            candidate.classList.contains('grabbable')
          ) {

            target = candidate;
            break;
          }
        }


        if (!target) {

          console.log(
            'Aucun objet grabbable'
          );

          return;
        }


        console.log(
          'GRAB:',
          target.id
        );


        this.grabbed = target;

        this.el.object3D.getWorldPosition(
          this.controllerPosition
        );

        this.el.object3D.getWorldQuaternion(
          this.controllerQuaternion
        );

        const objectWorldPosition =
          new THREE.Vector3();

        const objectWorldQuaternion =
          new THREE.Quaternion();


        target.object3D.getWorldPosition(
          objectWorldPosition
        );

        target.object3D.getWorldQuaternion(
          objectWorldQuaternion
        );

        this.localPosition
          .copy(objectWorldPosition)
          .sub(this.controllerPosition)
          .applyQuaternion(
            this.controllerQuaternion.clone().invert()
          );

        this.localQuaternion
          .copy(this.controllerQuaternion)
          .invert()
          .multiply(
            objectWorldQuaternion
          );

        // On passe le corps physique en "kinematic" : il suit la main
        // à la main sans subir la gravité, mais continue de pousser
        // les autres objets dynamiques s'il les touche.
        if (target.body) {
          const KINEMATIC = (typeof CANNON !== 'undefined') ? CANNON.Body.KINEMATIC : 2;
          target.body.type = KINEMATIC;
          target.body.velocity.set(0, 0, 0);
          target.body.angularVelocity.set(0, 0, 0);
          target.body.allowSleep = false;
        }

        // Réinitialisation de l'historique de vitesse pour le futur lancer
        this.velocityHistory = [];
        this.hasPrevPosition = false;

        /*
         * État visuel
         */
        target.classList.add(
          'grabbed'
        );


        target.emit(
          'grab-start'
        );
      },


      endGrab: function () {

        if (!this.grabbed) {
          return;
        }


        console.log(
          'TRIGGER UP'
        );


        const object =
          this.grabbed;

        // Vitesse moyenne du contrôleur sur les dernières frames = vitesse de lancer
        const throwVelocity = new THREE.Vector3();

        if (this.velocityHistory.length > 0) {
          this.velocityHistory.forEach((v) => throwVelocity.add(v));
          throwVelocity.divideScalar(this.velocityHistory.length);
        }

        if (object.body) {
          const DYNAMIC = (typeof CANNON !== 'undefined') ? CANNON.Body.DYNAMIC : 1;

          object.body.type = DYNAMIC;
          object.body.allowSleep = true;

          object.body.velocity.set(
            throwVelocity.x,
            throwVelocity.y,
            throwVelocity.z
          );

          // petite rotation aléatoire pour un effet de lancer plus naturel
          object.body.angularVelocity.set(
            (Math.random() - 0.5) * 2,
            (Math.random() - 0.5) * 2,
            (Math.random() - 0.5) * 2
          );

          object.body.wakeUp();
        }


        object.classList.remove(
          'grabbed'
        );


        object.emit(
          'grab-end'
        );


        this.grabbed = null;
      },


      tick: function (time, delta) {

        if (!this.grabbed) {
          return;
        }

        if (!delta) return;


        const object =
          this.grabbed.object3D;


        this.el.object3D.getWorldPosition(
          this.controllerPosition
        );

        this.el.object3D.getWorldQuaternion(
          this.controllerQuaternion
        );

        // --- calcul de la vitesse instantanée du contrôleur ---
        const dt = delta / 1000;

        if (this.hasPrevPosition && dt > 0) {

          const instantVelocity = new THREE.Vector3()
            .subVectors(this.controllerPosition, this.prevControllerPosition)
            .divideScalar(dt);

          this.velocityHistory.push(instantVelocity);

          // on ne garde que les 5 dernières valeurs (lissage)
          if (this.velocityHistory.length > 5) {
            this.velocityHistory.shift();
          }
        }

        this.prevControllerPosition.copy(this.controllerPosition);
        this.hasPrevPosition = true;
        // --------------------------------------------------------

        this.tempPosition
          .copy(this.localPosition)
          .applyQuaternion(
            this.controllerQuaternion
          )
          .add(
            this.controllerPosition
          );


        this.tempQuaternion
          .copy(this.controllerQuaternion)
          .multiply(
            this.localQuaternion
          );

        if (object.parent) {

          const parentWorldPosition =
            new THREE.Vector3();

          const parentWorldQuaternion =
            new THREE.Quaternion();

          object.parent.getWorldPosition(
            parentWorldPosition
          );

          object.parent.getWorldQuaternion(
            parentWorldQuaternion
          );


          object.position
            .copy(this.tempPosition)
            .sub(parentWorldPosition)
            .applyQuaternion(
              parentWorldQuaternion.clone().invert()
            );


          object.quaternion
            .copy(
              parentWorldQuaternion.clone().invert()
            )
            .multiply(
              this.tempQuaternion
            );

        }

        // On met aussi à jour directement le corps physique (kinematic)
        // pour que les collisions avec les autres objets soient prises
        // en compte pendant qu'on tient l'objet dans la main.
        if (this.grabbed.body) {
          this.grabbed.body.position.set(
            this.tempPosition.x,
            this.tempPosition.y,
            this.tempPosition.z
          );

          this.grabbed.body.quaternion.set(
            this.tempQuaternion.x,
            this.tempQuaternion.y,
            this.tempQuaternion.z,
            this.tempQuaternion.w
          );
        }

      }

    });

    // Debug des contrôleurs
    AFRAME.registerComponent('controller-debug', {

      init: function () {

        this.el.addEventListener(
          'triggerdown',
          () => {
            console.log(
              'DEBUG → TRIGGER DOWN',
              this.el.id
            );
          }
        );


        this.el.addEventListener(
          'triggerup',
          () => {
            console.log(
              'DEBUG → TRIGGER UP',
              this.el.id
            );
          }
        );


        this.el.addEventListener(
          'thumbstickmoved',
          (event) => {

            console.log(
              'STICK',
              this.el.id,
              event.detail.x,
              event.detail.y
            );

          }
        );
      }

    });

  </script>
</head>


<body>
<a-scene
  background="color: #111111"
  renderer="antialias: true; shadowMap: true"
  vr-mode-ui="enabled: true"
  physics="gravity: -9.8; debug: false"
>
  <a-entity light="type: ambient; intensity: 0.7"></a-entity>
  <a-entity light="type: directional; intensity: 1; castShadow: true" position="-2 5 3"></a-entity>

  <a-plane
    position="0 0 0"
    rotation="-90 0 0"
    width="20"
    height="20"
    color="#7BC8A4"
    shadow="receive: true"
    static-body="shape: box; friction: 0.5; restitution: 0.1">
  </a-plane>

  <a-entity
    id="rig"
    position="0 0 2"
  >

    <a-camera
      id="camera"
      position="0 1.6 0"
      look-controls="enabled: true">
    </a-camera>

    <a-entity
      id="leftHand"

      meta-touch-controls="
        hand: left;
        model: true
      "

      laser-controls="
        hand: left
      "

      raycaster="
        objects: .grabbable;
        far: 10;
        interval: 0
      "

      laser-cursor="
        color: #00FFFF
      "

      laser-grab="
        rig: #rig
      "

      left-thumbstick-move="
        rig: #rig;
        speed: 2.0
      "

      controller-debug

      line="
        color: #00FFFF;
        opacity: 0.8
      "
    >
    </a-entity>

    <a-entity
      id="rightHand"

      meta-touch-controls="
        hand: right;
        model: true
      "

      laser-controls="
        hand: right
      "

      raycaster="
        objects: .grabbable;
        far: 10;
        interval: 0
      "
      laser-cursor="
        color: #00FFFF
      "
      laser-grab="
        rig: #rig
      "
      joystick-turn="
        speed: 1.8
      "
      controller-debug
      line="
        color: #00FFFF;
        opacity: 0.8
      "
    >
    </a-entity>

  </a-entity>

  <a-box
    id="box"
    class="grabbable"
    position="-2 1 -4"
    width="1"
    height="1"
    depth="1"
    color="#4CC3D9"
    shadow="cast: true; receive: true"
    dynamic-body="shape: box; mass: 2; friction: 0.5; restitution: 0.1; linearDamping: 0.4; angularDamping: 0.4"
  >
  </a-box>

  <a-sphere
    id="sphere"
    class="grabbable"
    position="2 1.25 -6"
    radius="1"
    color="#EF2D5E"
    shadow="cast: true; receive: true"
    dynamic-body="shape: sphere; mass: 2; friction: 0.4; restitution: 0.3; linearDamping: 0.3; angularDamping: 0.4"
  >
  </a-sphere>

  <a-cylinder
    id="cylinder"
    class="grabbable"
    position="-2 2 -7"
    color="#FFC65D"
    radius="0.5"
    height="2"
    shadow="cast: true; receive: true"
    dynamic-body="shape: cylinder; mass: 2; friction: 0.5; restitution: 0.1; linearDamping: 0.4; angularDamping: 0.4"
  >
  </a-cylinder>

  <a-sky color="#FFFFFF"></a-sky>
</a-scene>
</body>
</html>
