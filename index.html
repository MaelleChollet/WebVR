  <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.20.0/cannon.min.js"></script>


  <script>


    /* =========================================================
       UTILITAIRES
       ========================================================= */

    function copyThreeToCannonPosition(threeObject, cannonBody) {

      cannonBody.position.set(
        threeObject.position.x,
        threeObject.position.y,
        threeObject.position.z
      );

    }


    function copyCannonToThree(body, object3D) {

      object3D.position.set(
        body.position.x,
        body.position.y,
        body.position.z
      );

      object3D.quaternion.set(
        body.quaternion.x,
        body.quaternion.y,
        body.quaternion.z,
        body.quaternion.w
      );

    }


    /* =========================================================
       PHYSICS WORLD
       ========================================================= */

    AFRAME.registerComponent('physics-world', {

      schema: {

        gravity: {
          type: 'number',
          default: -9.81
        }

      },


      init: function () {

        console.log('Initialisation du moteur physique');


        /*
         * Création du monde Cannon
         */

        this.world = new CANNON.World();


        /*
         * Gravité
         */

        this.world.gravity.set(
          0,
          this.data.gravity,
          0
        );


        /*
         * Algorithme de collision
         */

        this.world.broadphase =
          new CANNON.NaiveBroadphase();


        /*
         * Permet aux corps de dormir lorsqu'ils
         * sont complètement immobiles.
         *
         * Cela évite de consommer inutilement
         * des calculs.
         */

        this.world.allowSleep = true;


        /*
         * Solver.
         *
         * Plus le nombre d'itérations est élevé,
         * plus les collisions sont précises.
         */

        this.world.solver.iterations = 15;

        this.world.solver.tolerance = 0.001;


        /*
         * Matériau physique par défaut.
         */

        this.defaultMaterial =
          new CANNON.Material('default');


        /*
         * Matériau du sol.
         */

        this.floorMaterial =
          new CANNON.Material('floor');


        /*
         * Matériau des objets.
         */

        this.objectMaterial =
          new CANNON.Material('objects');


        /*
         * Contact sol <-> objets
         */

        const floorContact =
          new CANNON.ContactMaterial(
            this.floorMaterial,
            this.objectMaterial,
            {

              friction: 0.65,

              restitution: 0.05

            }
          );


        /*
         * Contact objet <-> objet
         */

        const objectContact =
          new CANNON.ContactMaterial(
            this.objectMaterial,
            this.objectMaterial,
            {

              /*
               * Frottement.
               *
               * Une valeur assez importante permet
               * aux objets de ne pas glisser indéfiniment.
               */

              friction: 0.55,


              /*
               * Rebond.
               *
               * Faible pour avoir des objets relativement
               * lourds et réalistes.
               */

              restitution: 0.12

            }
          );


        this.world.addContactMaterial(
          floorContact
        );


        this.world.addContactMaterial(
          objectContact
        );


        /*
         * Position du sol :
         *
         * Le plan A-Frame est à Y = 0.
         *
         * Pour Cannon, un Plane est initialement
         * orienté selon son axe local Z.
         *
         * On le tourne de -90° autour de X pour
         * obtenir un sol horizontal.
         */

        const floorBody =
          new CANNON.Body({

            mass: 0,

            material: this.floorMaterial

          });


        const floorShape =
          new CANNON.Plane();


        floorBody.addShape(
          floorShape
        );


        floorBody.quaternion.setFromEuler(
          -Math.PI / 2,
          0,
          0
        );


        floorBody.position.set(
          0,
          0,
          0
        );


        this.world.addBody(
          floorBody
        );


        /*
         * Liste des objets physiques.
         */

        this.physicsObjects = [];


        /*
         * Création des corps physiques
         * après le chargement de la scène.
         */

        this.createPhysicsObjects();


        /*
         * Temps utilisé pour le step.
         */

        this.lastTime = performance.now();

      },


      createPhysicsObjects: function () {

        const elements =
          this.el.querySelectorAll(
            '[physics-body]'
          );


        elements.forEach(
          (element) => {

            const component =
              element.components['physics-body'];


            if (!component) {
              return;
            }


            component.createBody(
              this.world,
              this.objectMaterial
            );


            this.physicsObjects.push(
              component
            );

          }
        );

      },


      tick: function (time, delta) {

        if (!this.world) {
          return;
        }


        /*
         * On limite le delta pour éviter qu'un gros lag
         * fasse traverser les objets.
         */

        const dt =
          Math.min(delta / 1000, 0.1);


        if (dt <= 0) {
          return;
        }


        /*
         * Simulation physique.
         *
         * 1 / 60 = timestep fixe.
         *
         * 3 sous-étapes permettent d'avoir une meilleure
         * stabilité lors des collisions rapides.
         */

        this.world.step(
          1 / 60,
          dt,
          3
        );


        /*
         * Synchronisation Cannon -> A-Frame
         */

        this.physicsObjects.forEach(
          (component) => {

            component.syncFromPhysics();

          }
        );

      }

    });


    /* =========================================================
       PHYSICS BODY
       ========================================================= */

    AFRAME.registerComponent('physics-body', {

      schema: {

        shape: {
          type: 'string',
          default: 'box'
        },


        width: {
          type: 'number',
          default: 1
        },


        height: {
          type: 'number',
          default: 1
        },


        depth: {
          type: 'number',
          default: 1
        },


        radius: {
          type: 'number',
          default: 0.5
        },


        mass: {
          type: 'number',
          default: 1
        },


        friction: {
          type: 'number',
          default: 0.55
        },


        restitution: {
          type: 'number',
          default: 0.12
        }

      },


      init: function () {

        this.body = null;

        this.isGrabbed = false;

        this.originalMass =
          this.data.mass;

      },


      createBody: function (
        world,
        material
      ) {

        if (this.body) {
          return;
        }


        /*
         * Matériau individuel.
         */

        this.material =
          new CANNON.Material(
            this.el.id + '-material'
          );


        /*
         * Shape Cannon.
         */

        let shape;


        /*
         * -----------------------------------------------------
         * CUBE
         * -----------------------------------------------------
         */

        if (this.data.shape === 'box') {

          shape =
            new CANNON.Box(
              new CANNON.Vec3(
                this.data.width / 2,
                this.data.height / 2,
                this.data.depth / 2
              )
            );

        }


        /*
         * -----------------------------------------------------
         * SPHERE
         * -----------------------------------------------------
         */

        else if (
          this.data.shape === 'sphere'
        ) {

          shape =
            new CANNON.Sphere(
              this.data.radius
            );

        }


        /*
         * -----------------------------------------------------
         * CYLINDRE
         * -----------------------------------------------------
         */

        else if (
          this.data.shape === 'cylinder'
        ) {

          /*
           * Cannon utilise :
           *
           * radiusTop
           * radiusBottom
           * height
           * numSegments
           */

          shape =
            new CANNON.Cylinder(
              this.data.radius,
              this.data.radius,
              this.data.height,
              32
            );

        }


        else {

          console.error(
            'Shape inconnue :',
            this.data.shape
          );

          return;

        }


        /*
         * Corps physique.
         */

        this.body =
          new CANNON.Body({

            mass: this.data.mass,

            material: this.material,

            linearDamping: 0.01,

            angularDamping: 0.08,

            allowSleep: true,

            sleepSpeedLimit: 0.1,

            sleepTimeLimit: 0.5

          });


        /*
         * Ajout de la forme.
         */

        this.body.addShape(
          shape
        );


        /*
         * Position initiale.
         */

        const position =
          this.el.object3D.position;


        this.body.position.set(
          position.x,
          position.y,
          position.z
        );


        /*
         * Rotation initiale.
         */

        const quaternion =
          this.el.object3D.quaternion;


        this.body.quaternion.set(
          quaternion.x,
          quaternion.y,
          quaternion.z,
          quaternion.w
        );


        /*
         * Ajout au monde.
         */

        world.addBody(
          this.body
        );


        /*
         * Contact avec les autres objets.
         */

        this.body.addEventListener(
          'collide',
          (event) => {

            this.el.emit(
              'physics-collision',
              {
                body: event.body
              }
            );

          }
        );


        /*
         * Petit délai avant de permettre
         * le sommeil du corps.
         */

        this.body.wakeUp();


        console.log(
          'Physics body créé :',
          this.el.id
        );

      },


      syncFromPhysics: function () {

        if (!this.body) {
          return;
        }


        /*
         * Si l'objet est actuellement tenu
         * par la main, le laser-grab contrôle
         * sa position.
         */

        if (this.isGrabbed) {
          return;
        }


        copyCannonToThree(
          this.body,
          this.el.object3D
        );

      },


      setGrabbed: function (grabbed) {

        if (!this.body) {
          return;
        }


        this.isGrabbed =
          grabbed;


        if (grabbed) {

          /*
           * Corps cinématique.
           *
           * Il est déplacé manuellement par le contrôleur,
           * mais continue à participer aux collisions.
           */

          this.body.type =
            CANNON.Body.KINEMATIC;


          this.body.mass = 0;


          this.body.velocity.set(
            0,
            0,
            0
          );


          this.body.angularVelocity.set(
            0,
            0,
            0
          );


          this.body.updateMassProperties();


          this.body.wakeUp();

        }

        else {

          /*
           * Retour en dynamique.
           */

          this.body.type =
            CANNON.Body.DYNAMIC;


          this.body.mass =
            this.originalMass;


          this.body.updateMassProperties();


          this.body.wakeUp();

        }

      },


      setThrowVelocity: function (
        velocity
      ) {

        if (!this.body) {
          return;
        }


        this.body.velocity.set(
          velocity.x,
          velocity.y,
          velocity.z
        );


        this.body.wakeUp();

      }

    });


    /* =========================================================
       MOUVEMENT AVEC JOYSTICK GAUCHE
       ========================================================= */

    AFRAME.registerComponent(
      'left-thumbstick-move',
      {

        schema: {

          rig: {
            type: 'selector'
          },


          speed: {
            type: 'number',
            default: 2.0
          }

        },


        init: function () {

          this.axisX = 0;

          this.axisY = 0;


          this.onThumbstick =
            this.onThumbstick.bind(this);


          this.el.addEventListener(
            'thumbstickmoved',
            this.onThumbstick
          );

        },


        onThumbstick: function (
          event
        ) {

          this.axisX =
            event.detail.x || 0;


          this.axisY =
            event.detail.y || 0;

        },


        tick: function (
          time,
          delta
        ) {

          if (!this.data.rig) {
            return;
          }


          if (!delta) {
            return;
          }


          const x =
            this.axisX;


          const z =
            -this.axisY;


          if (
            Math.abs(x) < 0.05 &&
            Math.abs(z) < 0.05
          ) {

            return;

          }


          const dt =
            delta / 1000;


          const direction =
            new THREE.Vector3(
              x,
              0,
              z
            );


          /*
           * Direction basée sur la rotation
           * du rig.
           */

          direction.applyAxisAngle(
            new THREE.Vector3(
              0,
              1,
              0
            ),
            this.data.rig.object3D.rotation.y
          );


          /*
           * Déplacement du joueur.
           */

          this.data.rig.object3D.position.x +=
            direction.x *
            this.data.speed *
            dt;


          this.data.rig.object3D.position.z +=
            direction.z *
            this.data.speed *
            dt;

        }

      }
    );


    /* =========================================================
       ROTATION AVEC JOYSTICK DROIT
       ========================================================= */

    AFRAME.registerComponent(
      'joystick-turn',
      {

        schema: {

          speed: {
            type: 'number',
            default: 1.8
          }

        },


        init: function () {

          this.axisX = 0;


          this.el.addEventListener(
            'thumbstickmoved',
            (event) => {

              this.axisX =
                event.detail.x || 0;

            }
          );

        },


        tick: function (
          time,
          delta
        ) {

          if (!delta) {
            return;
          }


          if (
            Math.abs(this.axisX) < 0.1
          ) {

            return;

          }


          const dt =
            delta / 1000;


          /*
           * Rotation du rig.
           */

          this.el.parentEl.object3D.rotation.y -=
            this.axisX *
            this.data.speed *
            dt;

        }

      }
    );


    /* =========================================================
       LASER CURSOR
       ========================================================= */

    AFRAME.registerComponent(
      'laser-cursor',
      {

        schema: {

          color: {
            type: 'color',
            default: '#00FFFF'
          }

        },


        init: function () {

          this.cursor =
            document.createElement(
              'a-sphere'
            );


          this.cursor.setAttribute(
            'radius',
            '0.018'
          );


          this.cursor.setAttribute(
            'color',
            this.data.color
          );


          this.cursor.setAttribute(
            'visible',
            'false'
          );


          this.cursor.setAttribute(
            'material',
            'shader: flat; opacity: 0.95'
          );


          this.el.sceneEl.appendChild(
            this.cursor
          );


          this.onIntersection =
            this.onIntersection.bind(this);


          this.onClear =
            this.onClear.bind(this);


          this.el.addEventListener(
            'raycaster-intersection',
            this.onIntersection
          );


          this.el.addEventListener(
            'raycaster-intersection-cleared',
            this.onClear
          );

        },


        onIntersection: function (
          event
        ) {

          const raycaster =
            this.el.components.raycaster;


          if (!raycaster) {
            return;
          }


          const intersections =
            raycaster.intersections;


          if (
            !intersections ||
            intersections.length === 0
          ) {

            return;

          }


          const hit =
            intersections[0];


          if (
            !hit ||
            !hit.point
          ) {

            return;

          }


          if (
            !hit.object ||
            !hit.object.el
          ) {

            return;

          }


          let target =
            hit.object.el;


          /*
           * Remonte jusqu'à trouver
           * l'entité grabbable.
           */

          while (
            target &&
            !target.classList.contains(
              'grabbable'
            ) &&
            target.parentEl
          ) {

            target =
              target.parentEl;

          }


          if (
            !target ||
            !target.classList.contains(
              'grabbable'
            )
          ) {

            this.cursor.setAttribute(
              'visible',
              'false'
            );

            return;

          }


          this.cursor.object3D.position.copy(
            hit.point
          );


          this.cursor.setAttribute(
            'visible',
            'true'
          );

        },


        onClear: function () {

          this.cursor.setAttribute(
            'visible',
            'false'
          );

        },


        remove: function () {

          if (this.cursor) {
            this.cursor.remove();
          }


          this.el.removeEventListener(
            'raycaster-intersection',
            this.onIntersection
          );


          this.el.removeEventListener(
            'raycaster-intersection-cleared',
            this.onClear
          );

        }

      }
    );


    /* =========================================================
       LASER GRAB
       ========================================================= */

    AFRAME.registerComponent(
      'laser-grab',
      {

        schema: {

          rig: {
            type: 'selector'
          }

        },


        init: function () {

          this.grabbed = null;


          /*
           * Position relative entre l'objet
           * et le contrôleur.
           */

          this.localPosition =
            new THREE.Vector3();


          /*
           * Rotation relative.
           */

          this.localQuaternion =
            new THREE.Quaternion();


          /*
           * Transformations contrôleur.
           */

          this.controllerPosition =
            new THREE.Vector3();


          this.controllerQuaternion =
            new THREE.Quaternion();


          /*
           * Transformations temporaires.
           */

          this.tempPosition =
            new THREE.Vector3();


          this.tempQuaternion =
            new THREE.Quaternion();


          /*
           * Vitesse du contrôleur.
           */

          this.prevControllerPosition =
            new THREE.Vector3();


          this.controllerVelocity =
            new THREE.Vector3();


          this.hasPrevPosition =
            false;


          /*
           * Trigger.
           */

          this.el.addEventListener(
            'triggerdown',
            () => {

              this.startGrab();

            }
          );


          this.el.addEventListener(
            'triggerup',
            () => {

              this.endGrab();

            }
          );

        },


        /* =====================================================
           START GRAB
           ===================================================== */

        startGrab: function () {

          console.log(
            'TRIGGER DOWN'
          );


          const raycaster =
            this.el.components.raycaster;


          if (!raycaster) {

            console.warn(
              'Raycaster absent'
            );

            return;

          }


          const intersections =
            raycaster.intersections;


          if (
            !intersections ||
            intersections.length === 0
          ) {

            console.log(
              'Aucun objet touché'
            );

            return;

          }


          let target = null;


          /*
           * Cherche le premier objet grabbable.
           */

          for (
            let i = 0;
            i < intersections.length;
            i++
          ) {

            let candidate =
              intersections[i].object &&
              intersections[i].object.el;


            while (
              candidate &&
              !candidate.classList.contains(
                'grabbable'
              ) &&
              candidate.parentEl
            ) {

              candidate =
                candidate.parentEl;

            }


            if (
              candidate &&
              candidate.classList.contains(
                'grabbable'
              )
            ) {

              target =
                candidate;

              break;

            }

          }


          if (!target) {

            console.log(
              'Aucun objet grabbable'
            );

            return;

          }


          /*
           * Récupération du composant physique.
           */

          const physics =
            target.components['physics-body'];


          if (
            !physics ||
            !physics.body
          ) {

            console.warn(
              'Objet sans physics-body'
            );

            return;

          }


          console.log(
            'GRAB:',
            target.id
          );


          this.grabbed =
            target;


          /*
           * Position monde du contrôleur.
           */

          this.el.object3D.getWorldPosition(
            this.controllerPosition
          );


          /*
           * Rotation monde du contrôleur.
           */

          this.el.object3D.getWorldQuaternion(
            this.controllerQuaternion
          );


          /*
           * Position actuelle de l'objet.
           */

          const objectWorldPosition =
            new THREE.Vector3();


          target.object3D.getWorldPosition(
            objectWorldPosition
          );


          /*
           * Rotation actuelle de l'objet.
           */

          const objectWorldQuaternion =
            new THREE.Quaternion();


          target.object3D.getWorldQuaternion(
            objectWorldQuaternion
          );


          /*
           * Position locale objet -> contrôleur.
           */

          this.localPosition
            .copy(objectWorldPosition)
            .sub(this.controllerPosition)
            .applyQuaternion(
              this.controllerQuaternion
                .clone()
                .invert()
            );


          /*
           * Rotation relative objet -> contrôleur.
           */

          this.localQuaternion
            .copy(
              this.controllerQuaternion
            )
            .invert()
            .multiply(
              objectWorldQuaternion
            );


          /*
           * Reset de la vitesse.
           */

          this.controllerVelocity.set(
            0,
            0,
            0
          );


          this.prevControllerPosition.copy(
            this.controllerPosition
          );


          this.hasPrevPosition =
            true;


          /*
           * Passe le corps en mode cinématique.
           */

          physics.setGrabbed(
            true
          );


          /*
           * Indication visuelle.
           */

          target.classList.add(
            'grabbed'
          );


          target.emit(
            'grab-start'
          );

        },


        /* =====================================================
           END GRAB
           ===================================================== */

        endGrab: function () {

          if (!this.grabbed) {
            return;
          }


          console.log(
            'TRIGGER UP'
          );


          const object =
            this.grabbed;


          const physics =
            object.components[
              'physics-body'
            ];


          /*
           * Retour en mode dynamique.
           */

          physics.setGrabbed(
            false
          );


          /*
           * --------------------------------------------------
           * LANCER
           * --------------------------------------------------
           *
           * On donne au corps la vitesse du contrôleur
           * au moment où le trigger est relâché.
           */

          physics.setThrowVelocity(
            this.controllerVelocity
          );


          /*
           * Classe visuelle.
           */

          object.classList.remove(
            'grabbed'
          );


          object.emit(
            'grab-end'
          );


          /*
           * Reset.
           */

          this.grabbed =
            null;


          this.hasPrevPosition =
            false;

        },


        /* =====================================================
           TICK
           ===================================================== */

        tick: function (
          time,
          delta
        ) {

          if (!this.grabbed) {
            return;
          }


          const object =
            this.grabbed;


          const physics =
            object.components[
              'physics-body'
            ];


          if (
            !physics ||
            !physics.body
          ) {

            return;

          }


          /*
           * --------------------------------------------------
           * POSITION DU CONTROLEUR
           * --------------------------------------------------
           */

          this.el.object3D.getWorldPosition(
            this.controllerPosition
          );


          this.el.object3D.getWorldQuaternion(
            this.controllerQuaternion
          );


          /*
           * --------------------------------------------------
           * CALCUL DE LA VITESSE
           * --------------------------------------------------
           */

          if (delta > 0) {

            const dt =
              delta / 1000;


            if (
              this.hasPrevPosition &&
              dt > 0
            ) {

              const instantVelocity =
                new THREE.Vector3()
                  .subVectors(
                    this.controllerPosition,
                    this.prevControllerPosition
                  )
                  .divideScalar(dt);


              /*
               * Lissage.
               *
               * Cela évite d'avoir une vitesse
               * extrêmement instable en VR.
               */

              this.controllerVelocity.lerp(
                instantVelocity,
                0.5
              );

            }


            this.prevControllerPosition.copy(
              this.controllerPosition
            );


            this.hasPrevPosition =
              true;

          }


          /*
           * --------------------------------------------------
           * NOUVELLE POSITION DE L'OBJET
           * --------------------------------------------------
           */

          this.tempPosition
            .copy(this.localPosition)
            .applyQuaternion(
              this.controllerQuaternion
            )
            .add(
              this.controllerPosition
            );


          /*
           * --------------------------------------------------
           * NOUVELLE ROTATION
           * --------------------------------------------------
           */

          this.tempQuaternion
            .copy(
              this.controllerQuaternion
            )
            .multiply(
              this.localQuaternion
            );


          /*
           * Cannon utilise directement les coordonnées monde.
           */

          physics.body.position.set(
            this.tempPosition.x,
            this.tempPosition.y,
            this.tempPosition.z
          );


          physics.body.quaternion.set(
            this.tempQuaternion.x,
            this.tempQuaternion.y,
            this.tempQuaternion.z,
            this.tempQuaternion.w
          );


          /*
           * Pendant qu'on déplace manuellement le corps,
           * on annule sa vitesse.
           */

          physics.body.velocity.set(
            0,
            0,
            0
          );


          physics.body.angularVelocity.set(
            0,
            0,
            0
          );


          physics.body.wakeUp();


          /*
           * Synchronisation visuelle immédiate.
           */

          copyCannonToThree(
            physics.body,
            object.object3D
          );

        }

      }
    );


    /* =========================================================
       DEBUG CONTROLLERS
       ========================================================= */

    AFRAME.registerComponent(
      'controller-debug',
      {

        init: function () {

          this.el.addEventListener(
            'triggerdown',
            () => {

              console.log(
                'DEBUG → TRIGGER DOWN',
                this.el.id
              );

            }
          );


          this.el.addEventListener(
            'triggerup',
            () => {

              console.log(
                'DEBUG → TRIGGER UP',
                this.el.id
              );

            }
          );


          this.el.addEventListener(
            'thumbstickmoved',
            (event) => {

              console.log(
                'STICK',
                this.el.id,
                event.detail.x,
                event.detail.y
              );

            }
          );

        }

      }
    );


    /* =========================================================
       COLLISION DEBUG
       ========================================================= */

    AFRAME.registerComponent(
      'collision-debug',
      {

        init: function () {

          this.el.addEventListener(
            'physics-collision',
            (event) => {

              /*
               * Petit feedback console.
               *
               * On peut supprimer ce console.log
               * si on ne veut plus de debug.
               */

              console.log(
                'COLLISION:',
                this.el.id
              );

            }
          );

        }

      }
    );


  </script>

</head>


<body>


<a-scene

  physics-world="
    gravity: -9.81
  "

  background="
    color: #111111
  "

  renderer="
    antialias: true;
    shadowMap: true
  "

  vr-mode-ui="
    enabled: true
  "
>


  <!-- ===================================================== -->
  <!-- CIEL                                                   -->
  <!-- ===================================================== -->

  <a-sky
    color="#FFFFFF">
  </a-sky>


  <!-- ===================================================== -->
  <!-- LUMIERES                                               -->
  <!-- ===================================================== -->

  <a-entity
    light="
      type: ambient;
      intensity: 0.7
    ">
  </a-entity>


  <a-entity
    light="
      type: directional;
      intensity: 1;
      castShadow: true
    "
    position="-2 5 3">
  </a-entity>


  <!-- ===================================================== -->
  <!-- SOL                                                    -->
  <!-- ===================================================== -->

  <a-plane

    position="0 0 0"

    rotation="-90 0 0"

    width="20"

    height="20"

    color="#7BC8A4"

    shadow="
      receive: true
    "

  >
  </a-plane>


  <!-- ===================================================== -->
  <!-- RIG                                                    -->
  <!-- ===================================================== -->

  <a-entity

    id="rig"

    position="0 0 2"

  >


    <!-- =================================================== -->
    <!-- CAMERA                                               -->
    <!-- =================================================== -->

    <a-camera

      id="camera"

      position="0 1.6 0"

      look-controls="
        enabled: true
      "

    >
    </a-camera>


    <!-- =================================================== -->
    <!-- MAIN GAUCHE                                          -->
    <!-- =================================================== -->

    <a-entity

      id="leftHand"

      meta-touch-controls="
        hand: left;
        model: true
      "

      laser-controls="
        hand: left
      "

      raycaster="
        objects: .grabbable;
        far: 10;
        interval: 0
      "

      laser-cursor="
        color: #00FFFF
      "

      laser-grab="
        rig: #rig
      "

      left-thumbstick-move="
        rig: #rig;
        speed: 2.0
      "

      controller-debug

      line="
        color: #00FFFF;
        opacity: 0.8
      "

    >
    </a-entity>


    <!-- =================================================== -->
    <!-- MAIN DROITE                                          -->
    <!-- =================================================== -->

    <a-entity

      id="rightHand"

      meta-touch-controls="
        hand: right;
        model: true
      "

      laser-controls="
        hand: right
      "

      raycaster="
        objects: .grabbable;
        far: 10;
        interval: 0
      "

      laser-cursor="
        color: #00FFFF
      "

      laser-grab="
        rig: #rig
      "

      joystick-turn="
        speed: 1.8
      "

      controller-debug

      line="
        color: #00FFFF;
        opacity: 0.8
      "

    >
    </a-entity>


  </a-entity>


  <!-- ===================================================== -->
  <!-- CUBE                                                    -->
  <!-- ===================================================== -->

  <a-box

    id="box"

    class="grabbable"

    position="-2 1 -4"

    width="1"

    height="1"

    depth="1"

    color="#4CC3D9"

    shadow="
      cast: true;
      receive: true
    "

    physics-body="
      shape: box;
      width: 1;
      height: 1;
      depth: 1;
      mass: 1;
      friction: 0.55;
      restitution: 0.12
    "

    collision-debug

  >
  </a-box>


  <!-- ===================================================== -->
  <!-- SPHERE                                                  -->
  <!-- ===================================================== -->

  <a-sphere

    id="sphere"

    class="grabbable"

    position="2 1.25 -6"

    radius="1"

    color="#EF2D5E"

    shadow="
      cast: true;
      receive: true
    "

    physics-body="
      shape: sphere;
      radius: 1;
      mass: 1;
      friction: 0.55;
      restitution: 0.12
    "

    collision-debug

  >
  </a-sphere>


  <!-- ===================================================== -->
  <!-- CYLINDRE                                                -->
  <!-- ===================================================== -->

  <a-cylinder

    id="cylinder"

    class="grabbable"

    position="-2 2 -7"

    radius="0.5"

    height="2"

    color="#FFC65D"

    shadow="
      cast: true;
      receive: true
    "

    physics-body="
      shape: cylinder;
      radius: 0.5;
      height: 2;
      mass: 1;
      friction: 0.55;
      restitution: 0.12
    "

    collision-debug

  >
  </a-cylinder>


</a-scene>


</body>

</html>
