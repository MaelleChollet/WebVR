<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>VR - Grab & Movement</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

  <!-- Composants supplémentaires A-Frame -->
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.0/dist/aframe-extras.min.js"></script>

  <script>
    /*
     * ============================================================
     * DÉPLACEMENT AVEC LE STICK GAUCHE
     * ============================================================
     *
     * Le stick gauche permet de déplacer le joueur.
     * Le déplacement est relatif à l'orientation actuelle du rig.
     */

    AFRAME.registerComponent('left-thumbstick-move', {
      schema: {
        rig: { type: 'selector' },
        speed: { type: 'number', default: 2.0 }
      },

      init() {
        this.axisX = 0;
        this.axisY = 0;

        this.onThumbstick = this.onThumbstick.bind(this);

        this.el.addEventListener('thumbstickmoved', this.onThumbstick);
      },

      onThumbstick(event) {
        this.axisX = event.detail.x || 0;
        this.axisY = event.detail.y || 0;
      },

      tick(time, delta) {
        if (!this.data.rig || !delta) return;

        const x = this.axisX;
        const z = -this.axisY;

        // Évite les petits mouvements involontaires du joystick.
        if (Math.abs(x) < 0.05 && Math.abs(z) < 0.05) return;

        const dt = delta / 1000;

        // Direction locale du joueur.
        const direction = new THREE.Vector3(x, 0, z);

        // Transforme la direction locale en direction mondiale.
        direction.applyAxisAngle(
          new THREE.Vector3(0, 1, 0),
          this.data.rig.object3D.rotation.y
        );

        // Déplace le rig.
        this.data.rig.object3D.position.x +=
          direction.x * this.data.speed * dt;

        this.data.rig.object3D.position.z +=
          direction.z * this.data.speed * dt;
      }
    });


    /*
     * ============================================================
     * ROTATION AVEC LE STICK DROIT
     * ============================================================
     *
     * Le stick droit permet de tourner le joueur horizontalement.
     */

    AFRAME.registerComponent('joystick-turn', {
      schema: {
        speed: {
          type: 'number',
          default: 1.8
        }
      },

      init() {
        this.axisX = 0;

        this.el.addEventListener('thumbstickmoved', (event) => {
          this.axisX = event.detail.x || 0;
        });
      },

      tick(time, delta) {
        if (!delta || Math.abs(this.axisX) < 0.1) return;

        const dt = delta / 1000;

        this.el.parentEl.object3D.rotation.y -=
          this.axisX * this.data.speed * dt;
      }
    });


    /*
     * ============================================================
     * CURSEUR DU LASER
     * ============================================================
     *
     * Affiche un petit point à l'endroit où le laser touche
     * un objet pouvant être attrapé.
     */

    AFRAME.registerComponent('laser-cursor', {
      schema: {
        color: {
          type: 'color',
          default: '#B8A7FF'
        }
      },

      init() {
        this.cursor = document.createElement('a-sphere');

        this.cursor.setAttribute('radius', '0.018');
        this.cursor.setAttribute('color', this.data.color);
        this.cursor.setAttribute('visible', 'false');
        this.cursor.setAttribute(
          'material',
          'shader: flat; opacity: 0.95'
        );

        this.el.sceneEl.appendChild(this.cursor);

        this.onIntersection = this.onIntersection.bind(this);
        this.onClear = this.onClear.bind(this);

        this.el.addEventListener(
          'raycaster-intersection',
          this.onIntersection
        );

        this.el.addEventListener(
          'raycaster-intersection-cleared',
          this.onClear
        );
      },

      onIntersection(event) {
        const raycaster = this.el.components.raycaster;

        if (!raycaster || !raycaster.intersections.length) return;

        const hit = raycaster.intersections[0];

        if (!hit?.point || !hit.object?.el) return;

        // Remonte la hiérarchie pour retrouver l'objet grabbable.
        let target = hit.object.el;

        while (
          target &&
          !target.classList.contains('grabbable') &&
          target.parentEl
        ) {
          target = target.parentEl;
        }

        // Le curseur reste caché si la cible n'est pas grabbable.
        if (!target?.classList.contains('grabbable')) {
          this.cursor.setAttribute('visible', 'false');
          return;
        }

        this.cursor.object3D.position.copy(hit.point);
        this.cursor.setAttribute('visible', 'true');
      },

      onClear() {
        this.cursor.setAttribute('visible', 'false');
      },

      remove() {
        if (this.cursor) {
          this.cursor.remove();
        }

        this.el.removeEventListener(
          'raycaster-intersection',
          this.onIntersection
        );

        this.el.removeEventListener(
          'raycaster-intersection-cleared',
          this.onClear
        );
      }
    });


    /*
     * ============================================================
     * GRAB AVEC LE LASER
     * ============================================================
     *
     * Le trigger permet d'attraper un objet grabbable.
     * L'objet conserve sa position et sa rotation relatives
     * à la manette pendant qu'il est tenu.
     */

    AFRAME.registerComponent('laser-grab', {
      schema: {
        rig: {
          type: 'selector'
        }
      },

      init() {
        this.grabbed = null;

        // Transformations relatives objet <-> contrôleur.
        this.localPosition = new THREE.Vector3();
        this.localQuaternion = new THREE.Quaternion();

        // Transformations du contrôleur.
        this.controllerPosition = new THREE.Vector3();
        this.controllerQuaternion = new THREE.Quaternion();

        // Transformations temporaires.
        this.tempPosition = new THREE.Vector3();
        this.tempQuaternion = new THREE.Quaternion();

        this.el.addEventListener('triggerdown', () => {
          this.startGrab();
        });

        this.el.addEventListener('triggerup', () => {
          this.endGrab();
        });
      },

      startGrab() {
        const raycaster = this.el.components.raycaster;

        if (!raycaster) {
          console.warn('Raycaster absent.');
          return;
        }

        const intersections = raycaster.intersections;

        if (!intersections.length) return;

        // Recherche du premier objet grabbable touché par le laser.
        let target = null;

        for (const intersection of intersections) {
          let candidate = intersection.object?.el;

          while (
            candidate &&
            !candidate.classList.contains('grabbable') &&
            candidate.parentEl
          ) {
            candidate = candidate.parentEl;
          }

          if (candidate?.classList.contains('grabbable')) {
            target = candidate;
            break;
          }
        }

        if (!target) return;

        this.grabbed = target;

        // Transformation mondiale de la manette.
        this.el.object3D.getWorldPosition(
          this.controllerPosition
        );

        this.el.object3D.getWorldQuaternion(
          this.controllerQuaternion
        );

        // Transformation mondiale de l'objet.
        const objectWorldPosition = new THREE.Vector3();
        const objectWorldQuaternion = new THREE.Quaternion();

        target.object3D.getWorldPosition(objectWorldPosition);
        target.object3D.getWorldQuaternion(objectWorldQuaternion);

        // Position relative objet -> manette.
        this.localPosition
          .copy(objectWorldPosition)
          .sub(this.controllerPosition)
          .applyQuaternion(
            this.controllerQuaternion.clone().invert()
          );

        // Rotation relative objet -> manette.
        this.localQuaternion
          .copy(this.controllerQuaternion)
          .invert()
          .multiply(objectWorldQuaternion);

        // Désactive la gravité pendant que l'objet est tenu.
        const gravity = target.components['simple-gravity'];

        if (gravity) {
          gravity.data.enabled = false;
        }

        target.classList.add('grabbed');
        target.emit('grab-start');
      },

      endGrab() {
        if (!this.grabbed) return;

        const object = this.grabbed;

        // Réactive la gravité lorsque l'objet est lâché.
        const gravity = object.components['simple-gravity'];

        if (gravity) {
          gravity.data.enabled = true;
          gravity.velocity = 0;
        }

        object.classList.remove('grabbed');
        object.emit('grab-end');

        this.grabbed = null;
      },

      tick() {
        if (!this.grabbed) return;

        const object = this.grabbed.object3D;

        // Récupère la transformation mondiale actuelle de la manette.
        this.el.object3D.getWorldPosition(
          this.controllerPosition
        );

        this.el.object3D.getWorldQuaternion(
          this.controllerQuaternion
        );

        // Calcule la nouvelle position mondiale de l'objet.
        this.tempPosition
          .copy(this.localPosition)
          .applyQuaternion(this.controllerQuaternion)
          .add(this.controllerPosition);

        // Calcule la nouvelle rotation mondiale de l'objet.
        this.tempQuaternion
          .copy(this.controllerQuaternion)
          .multiply(this.localQuaternion);

        /*
         * Conversion des coordonnées mondiales vers les
         * coordonnées locales du parent de l'objet.
         */
        if (object.parent) {
          const parentWorldPosition = new THREE.Vector3();
          const parentWorldQuaternion = new THREE.Quaternion();

          object.parent.getWorldPosition(parentWorldPosition);
          object.parent.getWorldQuaternion(parentWorldQuaternion);

          object.position
            .copy(this.tempPosition)
            .sub(parentWorldPosition)
            .applyQuaternion(
              parentWorldQuaternion.clone().invert()
            );

          object.quaternion
            .copy(
              parentWorldQuaternion.clone().invert()
            )
            .multiply(this.tempQuaternion);
        }
      }
    });


    /*
     * ============================================================
     * GRAVITÉ SIMPLE
     * ============================================================
     *
     * Applique une gravité basique aux objets et les empêche
     * de traverser le sol.
     */

    AFRAME.registerComponent('simple-gravity', {
      schema: {
        enabled: {
          type: 'boolean',
          default: true
        },

        halfHeight: {
          type: 'number',
          default: 0.25
        },

        gravity: {
          type: 'number',
          default: -9.81
        }
      },

      init() {
        this.velocity = 0;
      },

      tick(time, delta) {
        if (!this.data.enabled || !delta) return;

        const dt = Math.min(delta / 1000, 0.05);

        // Accélération verticale.
        this.velocity += this.data.gravity * dt;

        const position = this.el.object3D.position;

        // Application du déplacement vertical.
        position.y += this.velocity * dt;

        // Empêche l'objet de passer sous le sol.
        if (position.y <= this.data.halfHeight) {
          position.y = this.data.halfHeight;
          this.velocity = 0;
        }
      }
    });


    /*
     * ============================================================
     * DEBUG DES CONTRÔLEURS
     * ============================================================
     *
     * Permet de vérifier rapidement les événements envoyés
     * par les manettes pendant le développement.
     */

    AFRAME.registerComponent('controller-debug', {
      init() {
        this.el.addEventListener('triggerdown', () => {
          console.log('Trigger DOWN →', this.el.id);
        });

        this.el.addEventListener('triggerup', () => {
          console.log('Trigger UP →', this.el.id);
        });

        this.el.addEventListener('thumbstickmoved', (event) => {
          console.log(
            'Stick →',
            this.el.id,
            'X:',
            event.detail.x,
            'Y:',
            event.detail.y
          );
        });
      }
    });
  </script>
</head>

<body>

  <a-scene
    background="color: #101426"
    renderer="antialias: true"
    vr-mode-ui="enabled: true"
  >

    <!-- Éclairage général de la scène -->
    <a-entity
      light="type: ambient; intensity: 0.8"
    ></a-entity>

    <a-entity
      light="type: directional; intensity: 1.2"
      position="-3 6 4"
    ></a-entity>


    <!-- Sol -->
    <a-plane
      position="0 0 0"
      rotation="-90 0 0"
      width="20"
      height="20"
      color="#34495E"
    ></a-plane>


    <!-- Joueur -->
    <a-entity
      id="rig"
      position="0 0 2"
    >

      <!-- Caméra -->
      <a-camera
        id="camera"
        position="0 1.6 0"
        look-controls="enabled: true"
      ></a-camera>


      <!-- Manette gauche : déplacement -->
      <a-entity
        id="leftHand"

        meta-touch-controls="
          hand: left;
          model: true
        "

        laser-controls="
          hand: left
        "

        raycaster="
          objects: .grabbable;
          far: 10;
          interval: 0
        "

        laser-cursor="
          color: #A78BFA
        "

        laser-grab="
          rig: #rig
        "

        left-thumbstick-move="
          rig: #rig;
          speed: 2.0
        "

        controller-debug

        line="
          color: #8B7CF6;
          opacity: 0.75
        "
      ></a-entity>


      <!-- Manette droite : rotation -->
      <a-entity
        id="rightHand"

        meta-touch-controls="
          hand: right;
          model: true
        "

        laser-controls="
          hand: right
        "

        raycaster="
          objects: .grabbable;
          far: 10;
          interval: 0
        "

        laser-cursor="
          color: #67E8F9
        "

        laser-grab="
          rig: #rig
        "

        joystick-turn="
          speed: 1.8
        "

        controller-debug

        line="
          color: #67E8F9;
          opacity: 0.75
        "
      ></a-entity>

    </a-entity>


    <!-- ======================================================
         OBJETS INTERACTIFS
         ====================================================== -->

    <!-- Cube -->
    <a-box
      id="box"
      class="grabbable"
      position="-1 0.5 -2"
      width="1"
      height="1"
      depth="1"
      color="#F6A6A6"
      simple-gravity="
        halfHeight: 0.5;
        gravity: -9.81
      "
    ></a-box>


    <!-- Sphère -->
    <a-sphere
      id="sphere"
      class="grabbable"
      position="0 0.5 -2"
      radius="0.5"
      color="#A5B4FC"
      simple-gravity="
        halfHeight: 0.5;
        gravity: -9.81
      "
    ></a-sphere>


    <!-- Cylindre -->
    <a-cylinder
      id="cylinder"
      class="grabbable"
      position="1 0.5 -2"
      radius="0.5"
      height="1"
      color="#FDE68A"
      simple-gravity="
        halfHeight: 0.5;
        gravity: -9.81
      "
    ></a-cylinder>

  </a-scene>

</body>
</html>
