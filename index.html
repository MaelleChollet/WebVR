<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>VR - Grab & Movement</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

  <!-- movement-controls -->
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.0/dist/aframe-extras.min.js"></script>

  <script>
    // Mouvment avec le joystick gauche
    AFRAME.registerComponent('left-thumbstick-move', {

      schema: {
        rig: { type: 'selector' },
        speed: { type: 'number', default: 2.0 }
      },

      init: function () {

        this.axisX = 0;
        this.axisY = 0;

        this.onThumbstick = this.onThumbstick.bind(this);

        this.el.addEventListener(
          'thumbstickmoved',
          this.onThumbstick
        );
      },

      onThumbstick: function (event) {

        this.axisX = event.detail.x || 0;
        this.axisY = event.detail.y || 0;

      },

      tick: function (time, delta) {

        if (!this.data.rig) return;

        if (!delta) return;

        /*
         * A-Frame donne :
         * y < 0 = avant
         * y > 0 = arrière
         */

        const x = this.axisX;
        const z = -this.axisY;

        if (Math.abs(x) < 0.05 && Math.abs(z) < 0.05) {
          return;
        }

        const dt = delta / 1000;
        const direction = new THREE.Vector3(
          x,
          0,
          z
        );

        direction.applyAxisAngle(
          new THREE.Vector3(0, 1, 0),
          this.data.rig.object3D.rotation.y
        );

        this.data.rig.object3D.position.x +=
          direction.x * this.data.speed * dt;

        this.data.rig.object3D.position.z +=
          direction.z * this.data.speed * dt;
      }

    });


    // Rotation avec le joystick droit
    AFRAME.registerComponent('joystick-turn', {

      schema: {
        speed: {
          type: 'number',
          default: 1.8
        }
      },

      init: function () {

        this.axisX = 0;

        this.el.addEventListener(
          'thumbstickmoved',
          (event) => {
            this.axisX = event.detail.x || 0;
          }
        );
      },

      tick: function (time, delta) {

        if (!delta) return;

        if (Math.abs(this.axisX) < 0.1) {
          return;
        }

        const dt = delta / 1000;

        this.el.parentEl.object3D.rotation.y -=
          this.axisX * this.data.speed * dt;
      }

    });

    // custom cursor pour le laser
    AFRAME.registerComponent('laser-cursor', {

      schema: {
        color: {
          type: 'color',
          default: '#00FFFF'
        }
      },

      init: function () {

        this.cursor = document.createElement('a-sphere');

        this.cursor.setAttribute(
          'radius',
          '0.018'
        );

        this.cursor.setAttribute(
          'color',
          this.data.color
        );

        this.cursor.setAttribute(
          'visible',
          'false'
        );

        this.cursor.setAttribute(
          'material',
          'shader: flat; opacity: 0.95'
        );

        this.el.sceneEl.appendChild(
          this.cursor
        );


        this.onIntersection =
          this.onIntersection.bind(this);

        this.onClear =
          this.onClear.bind(this);


        this.el.addEventListener(
          'raycaster-intersection',
          this.onIntersection
        );

        this.el.addEventListener(
          'raycaster-intersection-cleared',
          this.onClear
        );
      },


      onIntersection: function (event) {

        const raycaster =
          this.el.components.raycaster;

        if (!raycaster) return;

        const intersections =
          raycaster.intersections;

        if (
          !intersections ||
          intersections.length === 0
        ) {
          return;
        }


        const hit =
          intersections[0];

        if (!hit || !hit.point) {
          return;
        }


        if (
          !hit.object ||
          !hit.object.el
        ) {
          return;
        }


        let target =
          hit.object.el;

        while (
          target &&
          !target.classList.contains('grabbable') &&
          target.parentEl
        ) {
          target = target.parentEl;
        }


        if (
          !target ||
          !target.classList.contains('grabbable')
        ) {
          this.cursor.setAttribute(
            'visible',
            'false'
          );

          return;
        }


        this.cursor.object3D.position.copy(
          hit.point
        );

        this.cursor.setAttribute(
          'visible',
          'true'
        );
      },


      onClear: function () {

        this.cursor.setAttribute(
          'visible',
          'false'
        );
      },


      remove: function () {

        if (this.cursor) {
          this.cursor.remove();
        }

        this.el.removeEventListener(
          'raycaster-intersection',
          this.onIntersection
        );

        this.el.removeEventListener(
          'raycaster-intersection-cleared',
          this.onClear
        );
      }

    });


    /*
     * shape-collider
     * ----------------
     * Calcule, pour la ROTATION ACTUELLE de l'objet, le point le plus bas
     * de sa forme par rapport à son centre (un offset négatif ou nul).
     *
     * On utilise une "fonction support" : pour une direction donnée
     * (ici "vers le bas"), on cherche le point de la forme qui va le
     * plus loin dans cette direction. C'est indépendant de l'angle
     * de rotation puisqu'on transforme la direction dans le repère
     * local de l'objet plutôt que l'inverse.
     */
    AFRAME.registerComponent('shape-collider', {

      schema: {
        shape: {
          type: 'string',
          default: 'box',
          oneOf: ['box', 'sphere', 'cylinder']
        },
        width: { type: 'number', default: 1 },
        height: { type: 'number', default: 1 },
        depth: { type: 'number', default: 1 },
        radius: { type: 'number', default: 0.5 },
        cylinderHeight: { type: 'number', default: 1 }
      },

      init: function () {
        this._quaternion = new THREE.Quaternion();
        this._matrix = new THREE.Matrix4();
      },

      /*
       * Retourne l'offset Y (négatif) entre le centre de l'objet
       * et son point le plus bas, compte tenu de sa rotation.
       * On peut lui passer un quaternion explicite (ex: pendant
       * un grab, avant que la rotation ne soit vraiment appliquée),
       * sinon on prend la rotation monde actuelle de l'objet.
       */
      getLowestOffset: function (quaternion) {

        const shape = this.data.shape;

        if (shape === 'sphere') {
          return -this.data.radius;
        }

        let q = quaternion;

        if (!q) {
          this.el.object3D.getWorldQuaternion(this._quaternion);
          q = this._quaternion;
        }

        this._matrix.makeRotationFromQuaternion(q);
        const e = this._matrix.elements;

        // Contribution des axes locaux X / Y / Z à l'axe Y du monde
        const ry_x = e[1];
        const ry_y = e[5];
        const ry_z = e[9];

        if (shape === 'box') {

          const hx = this.data.width / 2;
          const hy = this.data.height / 2;
          const hz = this.data.depth / 2;

          return -(
            Math.abs(ry_x) * hx +
            Math.abs(ry_y) * hy +
            Math.abs(ry_z) * hz
          );
        }

        if (shape === 'cylinder') {

          const r = this.data.radius;
          const hh = this.data.cylinderHeight / 2;

          // direction locale correspondant à "vers le bas" dans le monde
          const dx = -ry_x;
          const dy = -ry_y;
          const dz = -ry_z;

          const radial = Math.sqrt(dx * dx + dz * dz);
          const support = r * radial + hh * Math.abs(dy);

          return -support;
        }

        return 0;
      }

    });


    // Grab avec le laser + trigger
    AFRAME.registerComponent('laser-grab', {

      schema: {
        rig: {
          type: 'selector'
        }
      },


      init: function () {

        this.grabbed = null;

        this.localPosition = new THREE.Vector3();
        this.localQuaternion = new THREE.Quaternion();
        this.controllerPosition = new THREE.Vector3();
        this.controllerQuaternion = new THREE.Quaternion();
        this.tempPosition = new THREE.Vector3();
        this.tempQuaternion = new THREE.Quaternion();

        // --- pour le lancer ---
        this.prevControllerPosition = new THREE.Vector3();
        this.controllerVelocity = new THREE.Vector3();
        this.hasPrevPosition = false;
        // ----------------------

        this.el.addEventListener('triggerdown', () => {
          this.startGrab();
        });

        this.el.addEventListener('triggerup', () => {
          this.endGrab();
        });
      },


      startGrab: function () {

        console.log(
          'TRIGGER DOWN'
        );


        const raycaster =
          this.el.components.raycaster;


        if (!raycaster) {

          console.warn(
            'Raycaster absent'
          );

          return;
        }


        const intersections =
          raycaster.intersections;


        if (
          !intersections ||
          intersections.length === 0
        ) {

          console.log(
            'Trigger pressé mais aucun objet'
          );

          return;
        }

        let target = null;


        for (
          let i = 0;
          i < intersections.length;
          i++
        ) {

          let candidate =
            intersections[i].object &&
            intersections[i].object.el;


          while (
            candidate &&
            !candidate.classList.contains('grabbable') &&
            candidate.parentEl
          ) {

            candidate =
              candidate.parentEl;
          }


          if (
            candidate &&
            candidate.classList.contains('grabbable')
          ) {

            target = candidate;
            break;
          }
        }


        if (!target) {

          console.log(
            'Aucun objet grabbable'
          );

          return;
        }


        console.log(
          'GRAB:',
          target.id
        );


        this.grabbed = target;

        this.el.object3D.getWorldPosition(
          this.controllerPosition
        );

        this.el.object3D.getWorldQuaternion(
          this.controllerQuaternion
        );

        const objectWorldPosition =
          new THREE.Vector3();

        const objectWorldQuaternion =
          new THREE.Quaternion();


        target.object3D.getWorldPosition(
          objectWorldPosition
        );

        target.object3D.getWorldQuaternion(
          objectWorldQuaternion
        );

        this.localPosition
          .copy(objectWorldPosition)
          .sub(this.controllerPosition)
          .applyQuaternion(
            this.controllerQuaternion.clone().invert()
          );

        this.localQuaternion
          .copy(this.controllerQuaternion)
          .invert()
          .multiply(
            objectWorldQuaternion
          );

        const gravity =
          target.components['simple-gravity'];

        if (gravity) {
          gravity.data.enabled = false;
        }

        // reset du suivi de vitesse pour ce nouveau grab
        this.hasPrevPosition = false;
        this.controllerVelocity.set(0, 0, 0);

        /*
         * État visuel
         */
        target.classList.add(
          'grabbed'
        );


        target.emit(
          'grab-start'
        );
      },


      endGrab: function () {

        if (!this.grabbed) {
          return;
        }


        console.log(
          'TRIGGER UP'
        );


        const object =
          this.grabbed;


        const gravity =
          object.components['simple-gravity'];

        if (gravity) {
          gravity.data.enabled = true;
          gravity.velocity.copy(this.controllerVelocity);
        }


        object.classList.remove(
          'grabbed'
        );


        object.emit(
          'grab-end'
        );


        this.grabbed = null;
        this.hasPrevPosition = false;
      },


      tick: function (time, delta) {

        if (!this.grabbed) {
          return;
        }


        const object =
          this.grabbed.object3D;


        this.el.object3D.getWorldPosition(
          this.controllerPosition
        );

        this.el.object3D.getWorldQuaternion(
          this.controllerQuaternion
        );

        // --- calcul de la vitesse du contrôleur pour le lancer ---
        if (delta > 0) {
          const dt = delta / 1000;

          if (this.hasPrevPosition) {
            const instantVelocity = new THREE.Vector3()
              .subVectors(this.controllerPosition, this.prevControllerPosition)
              .divideScalar(dt);

            this.controllerVelocity.lerp(instantVelocity, 0.5);
          }

          this.prevControllerPosition.copy(this.controllerPosition);
          this.hasPrevPosition = true;
        }
        // -----------------------------------------------------------

        this.tempPosition
          .copy(this.localPosition)
          .applyQuaternion(
            this.controllerQuaternion
          )
          .add(
            this.controllerPosition
          );


        this.tempQuaternion
          .copy(this.controllerQuaternion)
          .multiply(
            this.localQuaternion
          );

        // --- Empêche l'objet de passer sous le sol pendant le grab,
        //     en tenant compte de sa rotation actuelle ---
        const colliderComp = this.grabbed.components['shape-collider'];

        if (colliderComp) {

          const gravityComp = this.grabbed.components['simple-gravity'];
          const floorY = gravityComp ? gravityComp.data.floorY : 0;

          // on utilise tempQuaternion : la rotation qui va être
          // appliquée cette frame, pour rester précis même quand
          // l'objet tourne pendant qu'on le tient
          const lowestOffset = colliderComp.getLowestOffset(this.tempQuaternion);
          const minY = floorY - lowestOffset;

          if (this.tempPosition.y < minY) {
            this.tempPosition.y = minY;
          }
        }
        // ---------------------------------------------------------------

        if (object.parent) {

          const parentWorldPosition =
            new THREE.Vector3();

          const parentWorldQuaternion =
            new THREE.Quaternion();

          object.parent.getWorldPosition(
            parentWorldPosition
          );

          object.parent.getWorldQuaternion(
            parentWorldQuaternion
          );


          object.position
            .copy(this.tempPosition)
            .sub(parentWorldPosition)
            .applyQuaternion(
              parentWorldQuaternion.clone().invert()
            );


          object.quaternion
            .copy(
              parentWorldQuaternion.clone().invert()
            )
            .multiply(
              this.tempQuaternion
            );

        }

      }

    });

    // Gravité simple pour les objets, appuyée sur shape-collider
    AFRAME.registerComponent('simple-gravity', {

      schema: {
        enabled: { type: 'boolean', default: true },
        floorY: { type: 'number', default: 0 },
        gravity: { type: 'number', default: -9.81 }
      },

      init: function () {
        this.velocity = new THREE.Vector3(0, 0, 0);
      },

      tick: function (time, delta) {

        if (!this.data.enabled) return;
        if (!delta) return;

        const dt = Math.min(delta / 1000, 0.05);

        this.velocity.y += this.data.gravity * dt;

        const position = this.el.object3D.position;

        position.x += this.velocity.x * dt;
        position.y += this.velocity.y * dt;
        position.z += this.velocity.z * dt;

        const colliderComp = this.el.components['shape-collider'];

        // fallback si jamais l'objet n'a pas de shape-collider
        const lowestOffset = colliderComp ? colliderComp.getLowestOffset() : -0.25;

        const floor = this.data.floorY - lowestOffset;

        if (position.y <= floor) {
          position.y = floor;
          this.velocity.y = 0;

          // frottement au sol pour que l'objet ne glisse pas indéfiniment
          this.velocity.x *= 0.9;
          this.velocity.z *= 0.9;
        }
      }

    });

    // Debug des contrôleurs
    AFRAME.registerComponent('controller-debug', {

      init: function () {

        this.el.addEventListener(
          'triggerdown',
          () => {
            console.log(
              'DEBUG → TRIGGER DOWN',
              this.el.id
            );
          }
        );


        this.el.addEventListener(
          'triggerup',
          () => {
            console.log(
              'DEBUG → TRIGGER UP',
              this.el.id
            );
          }
        );


        this.el.addEventListener(
          'thumbstickmoved',
          (event) => {

            console.log(
              'STICK',
              this.el.id,
              event.detail.x,
              event.detail.y
            );

          }
        );
      }

    });

  </script>
</head>


<body>
<a-scene
  background="color: #111111"
  renderer="antialias: true; shadowMap: true"
  vr-mode-ui="enabled: true"
>
  <a-sky color="#FFFFFF"></a-sky>

  <a-entity light="type: ambient; intensity: 0.7"></a-entity>
  <a-entity light="type: directional; intensity: 1; castShadow: true" position="-2 5 3"></a-entity>

  <a-plane
    position="0 0 0"
    rotation="-90 0 0"
    width="20"
    height="20"
    color="#7BC8A4"
    shadow="receive: true">
  </a-plane>

  <a-entity
    id="rig"
    position="0 0 2"
  >

    <a-camera
      id="camera"
      position="0 1.6 0"
      look-controls="enabled: true">
    </a-camera>

    <a-entity
      id="leftHand"

      meta-touch-controls="
        hand: left;
        model: true
      "

      laser-controls="
        hand: left
      "

      raycaster="
        objects: .grabbable;
        far: 10;
        interval: 0
      "

      laser-cursor="
        color: #00FFFF
      "

      laser-grab="
        rig: #rig
      "

      left-thumbstick-move="
        rig: #rig;
        speed: 2.0
      "

      controller-debug

      line="
        color: #00FFFF;
        opacity: 0.8
      "
    >
    </a-entity>

    <a-entity
      id="rightHand"

      meta-touch-controls="
        hand: right;
        model: true
      "

      laser-controls="
        hand: right
      "

      raycaster="
        objects: .grabbable;
        far: 10;
        interval: 0
      "
      laser-cursor="
        color: #00FFFF
      "
      laser-grab="
        rig: #rig
      "
      joystick-turn="
        speed: 1.8
      "
      controller-debug
      line="
        color: #00FFFF;
        opacity: 0.8
      "
    >
    </a-entity>

  </a-entity>

  <a-box
    id="box"
    class="grabbable"
    position="-2 1 -4"
    width="1"
    height="1"
    depth="1"
    color="#4CC3D9"
    shadow="cast: true; receive: true"
    shape-collider="
      shape: box;
      width: 1;
      height: 1;
      depth: 1
    "
    simple-gravity="
      floorY: 0;
      gravity: -9.81
    "
  >
  </a-box>

  <a-sphere
    id="sphere"
    class="grabbable"
    position="2 1.25 -6"
    radius="1"
    color="#EF2D5E"
    shadow="cast: true; receive: true"
    shape-collider="
      shape: sphere;
      radius: 1
    "
    simple-gravity="
      floorY: 0;
      gravity: -9.81
    "
  >
  </a-sphere>

  <a-cylinder
    id="cylinder"
    class="grabbable"
    position="-2 2 -7"
    color="#FFC65D"
    radius="0.5"
    height="2"
    shadow="cast: true; receive: true"
    shape-collider="
      shape: cylinder;
      radius: 0.5;
      cylinderHeight: 2
    "
    simple-gravity="
      floorY: 0;
      gravity: -9.81
    "
  >
  </a-cylinder>
</a-scene>
</body>
</html>
