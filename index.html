<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WebVR</title>

<script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>

<style>
  html, body { margin: 0; padding: 0; height: 100%; }
  body { background: #1e1e2e; color: #ffffff; font-family: Arial, Helvetica, sans-serif; }
  a-scene { width: 100%; height: 100vh; display: block; }

  #hint {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    text-align: center;
    padding: 14px 10px;
    font-size: 14px;
    color: #cfd8ff;
    background: rgba(0,0,0,0.35);
    pointer-events: none;
  }

  #hint a { color: #ffffff; pointer-events: auto; }
</style>
</head>
<body>

<div id="hint">
  Mets ton casque, clique sur « Entrer en VR », puis vise un panneau avec la manette et appuie sur la gâchette pour choisir ton exercice.
  Une fois dans un exercice, regarde quelques secondes le bouton « Menu » flottant au-dessus de toi pour revenir choisir un autre exercice.
  &nbsp;·&nbsp; <a href="#" onclick="location.reload(); return false;">Recharger la page</a>
</div>

<a-scene
  id="scene"
  renderer="antialias: true; shadowMap: true"
  shadow="type: pcfsoft; autoUpdate: true"
  webxr="optionalFeatures: local-floor"
  vr-mode-ui="enabled: true"
  background="color: #111111"
>

  <!-- repli souris pour tester au clavier/souris sans casque -->
  <a-entity cursor="rayOrigin: mouse" raycaster="objects: .menu-item, .global-menu-btn; far: 20"></a-entity>

  <!-- bouton persistant "retour au menu", visible quel que soit l'exercice en cours,
       activable en le regardant quelques secondes (fonctionne sans dépendre des
       boutons/joysticks propres à chaque exercice) -->
  <a-entity
    id="global-menu-btn"
    class="global-menu-btn"
    geometry="primitive: plane; width: 1.4; height: 0.4"
    material="color: #2c3454; opacity: 0.9; side: double"
    position="0 3.4 -2"
    visible="false">
    <a-text value="⌂ Menu" align="center" color="#ffffff" width="3" position="0 0 0.01"></a-text>
    <a-ring
      id="global-menu-fuse-ring"
      radius-inner="0.09" radius-outer="0.12"
      color="#4fc3d9"
      position="0 0 0.02"
      visible="false">
    </a-ring>
  </a-entity>

  <a-assets></a-assets>

  <a-entity id="content"></a-entity>

</a-scene>

<template id="tpl-menu">

    <a-entity light="type: ambient; intensity: 0.7"></a-entity>
    <a-entity light="type: directional; intensity: 1; castShadow: true" position="-2 5 3"></a-entity>

    <a-plane
      position="0 0 0"
      rotation="-90 0 0"
      width="20"
      height="20"
      color="#7BC8A4"
      shadow="receive: true">
    </a-plane>

    <a-sky color="#dfe6f0"></a-sky>

    <a-entity id="menu-rig" position="0 0 2">
      <a-camera id="menu-camera" position="0 1.6 0" look-controls="pointerLockEnabled: false"></a-camera>

      <a-entity
        id="menuLeftHand"
        meta-touch-controls="hand: left; model: true"
        laser-controls="hand: left"
        raycaster="objects: .menu-item; far: 20"
        line="color: #4fc3d9; opacity: 0.85">
      </a-entity>

      <a-entity
        id="menuRightHand"
        meta-touch-controls="hand: right; model: true"
        laser-controls="hand: right"
        raycaster="objects: .menu-item; far: 20"
        line="color: #4fc3d9; opacity: 0.85">
      </a-entity>
    </a-entity>

    <a-text
      value="WebVR"
      align="center"
      color="#ffffff"
      width="6"
      position="0 2.5 -2">
    </a-text>

    <a-entity
      class="menu-item"
      data-ex="1"
      geometry="primitive: plane; width: 1.8; height: 0.4"
      material="color: #4fc3d9; side: double"
      position="0 1.9 -2">

        width="2.6"
        position="0 0 0.01">
      </a-text>
    </a-entity>

    <a-entity

    </a-entity>

    <a-entity

    </a-entity>

    </a-entity>

  </template>

<script type="text/plain" id="code-ex1">
            // Rotation avec le joystick droit
            AFRAME.registerComponent("joystick-turn", {
                schema: {
                rotationSpeed: {type: "number", default: 120},
                deadzone: {type: "number", default: 0.2}
                },

                init: function () {
                this.rotationInput = 0;
                const rightHand = document.querySelector("#rightHand");

                rightHand.addEventListener("thumbstickmoved", (evt) => {
                    const x = evt.detail.x;
                    this.rotationInput = Math.abs(x) > this.data.deadzone ? x : 0;
                });
                },

                tick: function (time, deltaTime) {
                if (!this.rotationInput) return;

                const rot = this.el.getAttribute("rotation");

                this.el.setAttribute("rotation", {
                    x: rot.x,
                    y: rot.y - this.rotationInput * this.data.rotationSpeed * deltaTime / 1000,
                    z: rot.z
                });
                }
            });
            </script>

<script type="text/plain" id="code-ex2">
    AFRAME.registerSystem('physics-world', {

      schema: {
        gravity: { type: 'number', default: -9.81 }
      },

      init: function () {
        this.bodies = [];
      },

      registerBody: function (component) {
        this.bodies.push(component);
      },

      unregisterBody: function (component) {
        const index = this.bodies.indexOf(component);
        if (index !== -1) this.bodies.splice(index, 1);
      },

      tick: function (time, delta) {

        if (!delta) return;

        const dt = Math.min(delta / 1000, 0.05);
        const subSteps = 4;
        const subDt = dt / subSteps;

        const DOWN = new THREE.Vector3(0, -1, 0);
        const UP = new THREE.Vector3(0, 1, 0);

        const LINEAR_SLEEP_EPS = 0.03;
        const ANGULAR_SLEEP_EPS = 0.12;
        const SLEEP_DELAY = 0.25; // secondes sous le seuil avant de vraiment figer l'objet

        for (let s = 0; s < subSteps; s++) {

          // 1) Gravité + intégration linéaire ET angulaire + contact sol
          for (let i = 0; i < this.bodies.length; i++) {
            const body = this.bodies[i];
            if (body.kinematic) continue; // objet tenu en main -> pas de physique

            const pos = body.el.object3D.position;
            const quat = body.el.object3D.quaternion;

            // décrémente la période de grâce post-lancer
            if (body.justThrownTimer > 0) {
              body.justThrownTimer = Math.max(0, body.justThrownTimer - subDt);
            }

            // --- gravité ---
            body.velocity.y += this.data.gravity * subDt;

            // --- intégration position ---
            pos.x += body.velocity.x * subDt;
            pos.y += body.velocity.y * subDt;
            pos.z += body.velocity.z * subDt;

            // --- intégration rotation (vitesse angulaire monde) ---
            const angSpeed = body.angularVelocity.length();
            if (angSpeed > 0.0001) {
              const axis = body.angularVelocity.clone().normalize();
              const deltaQuat = new THREE.Quaternion().setFromAxisAngle(axis, angSpeed * subDt);
              quat.premultiply(deltaQuat);
            }

            // --- contact avec le sol : point de contact réel + couple ---
            const contactLocal = body.getSupportPointLocal(DOWN);
            const r = contactLocal.clone().applyQuaternion(quat);
            const contactWorldY = pos.y + r.y;

            if (contactWorldY < 0) {

              pos.y -= contactWorldY;

              const pointVelocity = body.velocity.clone().add(
                body.angularVelocity.clone().cross(r)
              );

              const vAlongNormal = pointVelocity.dot(UP);

              if (vAlongNormal < 0) {

                const invMass = 1;
                const invInertia = 1 / body.inertia;

                const rxn = r.clone().cross(UP);
                const denom = invMass + invInertia * rxn.dot(rxn);

                const j = -(1 + body.data.restitution) * vAlongNormal / denom;
                const impulse = UP.clone().multiplyScalar(j);

                body.velocity.add(impulse.clone().multiplyScalar(invMass));
                body.angularVelocity.add(
                  r.clone().cross(impulse).multiplyScalar(invInertia)
                );

                // --- frottement, DÉSACTIVÉ pendant la période de grâce ---
                if (body.justThrownTimer <= 0) {

                  const tangentVel = pointVelocity.clone().sub(UP.clone().multiplyScalar(vAlongNormal));
                  const tangentSpeed = tangentVel.length();

                  if (tangentSpeed > 0.0001) {
                    const tangentDir = tangentVel.clone().divideScalar(tangentSpeed);
                    const maxFriction = body.data.friction * Math.abs(j);
                    const frictionMag = Math.min(tangentSpeed * invMass, maxFriction);
                    const frictionImpulse = tangentDir.multiplyScalar(-frictionMag);

                    body.velocity.add(frictionImpulse.clone().multiplyScalar(invMass));
                    body.angularVelocity.add(
                      r.clone().cross(frictionImpulse).multiplyScalar(invInertia)
                    );
                  }
                }
              }

              body.angularVelocity.multiplyScalar(0.9);
              if (
                body.velocity.length() < LINEAR_SLEEP_EPS &&
                body.angularVelocity.length() < ANGULAR_SLEEP_EPS
              ) {
                body.restTime += subDt;
                if (body.restTime > SLEEP_DELAY) {
                  body.velocity.set(0, 0, 0);
                  body.angularVelocity.set(0, 0, 0);
                }
              } else {
                body.restTime = 0;
              }
            }

            body.velocity.multiplyScalar(0.999);
            body.angularVelocity.multiplyScalar(0.995);
          }

          // Collisions entre objets (contour réel selon la forme)
          for (let i = 0; i < this.bodies.length; i++) {
            for (let j = i + 1; j < this.bodies.length; j++) {

              const a = this.bodies[i];
              const b = this.bodies[j];

              if (a.kinematic && b.kinematic) continue;

              const posA = a.el.object3D.position;
              const posB = b.el.object3D.position;

              const delta = new THREE.Vector3().subVectors(posB, posA);
              const dist = delta.length();

              if (dist < 0.0001) continue;

              const dir = delta.clone().divideScalar(dist);

              const extentA = a.getExtentAlongDirection(dir);
              const extentB = b.getExtentAlongDirection(dir.clone().negate());
              const minDist = extentA + extentB;

              if (dist < minDist) {

                const overlap = minDist - dist;
                const normal = dir;

                if (a.kinematic) {
                  posB.add(normal.clone().multiplyScalar(overlap));
                  const vAlongNormal = b.velocity.dot(normal);
                  if (vAlongNormal < 0) {
                    b.velocity.sub(normal.clone().multiplyScalar(vAlongNormal));
                  }
                } else if (b.kinematic) {
                  posA.sub(normal.clone().multiplyScalar(overlap));
                  const vAlongNormal = a.velocity.dot(normal.clone().negate());

        depth: { type: 'number', default: 1 },

        radius: { type: 'number', default: 0.5 },

        friction: { type: 'number', default: 0.35 }
      },

      init: function () {
        this.velocity = new THREE.Vector3(0, 0, 0);
        this.angularVelocity = new THREE.Vector3(0, 0, 0);

        this.restTime = 0;        // hystérésis avant endormissement

        this._invQuat = new THREE.Quaternion();

      computeInertia: function () {

        const data = this.data;
        let inertia;

        if (data.shape === 'sphere') {
          inertia = 0.4 * data.radius * data.radius;
        } else if (data.shape === 'cylinder') {
          const ixx = (3 * data.radius * data.radius + data.height * data.height) / 12;
          const iyy = (data.radius * data.radius) / 2;
          inertia = (2 * ixx + iyy) / 3;
        } else {
          const w = data.width, h = data.height, d = data.depth;
          const ixx = (h * h + d * d) / 12;
          const iyy = (w * w + d * d) / 12;
          const izz = (w * w + h * h) / 12;
          inertia = (ixx + iyy + izz) / 3;
        }

        return Math.max(inertia, 0.02);
      },

      getExtentAlongDirection: function (dirWorld) {

        const data = this.data;

        if (data.shape === 'sphere') {
          return data.radius;
        }

        this._invQuat.copy(this.el.object3D.quaternion).invert();
        this._dirLocal.copy(dirWorld).applyQuaternion(this._invQuat);

        if (data.shape === 'box') {
          const hx = data.width / 2;
          const hy = data.height / 2;
          const hz = data.depth / 2;

          return (
            Math.abs(this._dirLocal.x) * hx +
            Math.abs(this._dirLocal.y) * hy +
            Math.abs(this._dirLocal.z) * hz
          );
        }

        if (data.shape === 'cylinder') {
          const hh = data.height / 2;
          const r = data.radius;

          const axisComponent = this._dirLocal.y;
          const radialComponent = Math.sqrt(Math.max(0, 1 - axisComponent * axisComponent));

          return hh * Math.abs(axisComponent) + r * radialComponent;
        }

        return data.radius;

      getSupportPointLocal: function (dirWorld) {

        const data = this.data;

        this._invQuat.copy(this.el.object3D.quaternion).invert();
        const dirLocal = dirWorld.clone().applyQuaternion(this._invQuat);

        if (data.shape === 'sphere') {
          return dirLocal.multiplyScalar(data.radius);
        }

        if (data.shape === 'box') {
          const hx = data.width / 2;
          const hy = data.height / 2;
          const hz = data.depth / 2;

          return new THREE.Vector3(
            Math.sign(dirLocal.x) * hx,
            Math.sign(dirLocal.y) * hy,
            Math.sign(dirLocal.z) * hz
          );
        }

        if (data.shape === 'cylinder') {
          const extent = this.getExtentAlongDirection(dirWorld);
          return dirLocal.multiplyScalar(extent);

<script type="text/plain" id="code-ex3">
    // =========================================================
    // SYSTEME PHYSIQUE MAISON
    // =========================================================
    AFRAME.registerSystem('physics-world', {

      schema: {
        gravity: { type: 'number', default: -9.81 },
        floorHalfExtent: { type: 'number', default: 10 },
        killY: { type: 'number', default: -20 }
      },

      init: function () {
        this.bodies = [];
      },

      registerBody: function (component) {
        this.bodies.push(component);
      },

      unregisterBody: function (component) {
        const index = this.bodies.indexOf(component);
        if (index !== -1) this.bodies.splice(index, 1);
      },

      tick: function (time, delta) {

        if (!delta) return;

        const dt = Math.min(delta / 1000, 0.05);
        const subSteps = 4;
        const subDt = dt / subSteps;

        const DOWN = new THREE.Vector3(0, -1, 0);
        const UP = new THREE.Vector3(0, 1, 0);

        const LINEAR_SLEEP_EPS = 0.03;
        const ANGULAR_SLEEP_EPS = 0.12;
        const SLEEP_DELAY = 0.25;

        const floorHalfExtent = this.data.floorHalfExtent;

        for (let s = 0; s < subSteps; s++) {

          for (let i = 0; i < this.bodies.length; i++) {
            const body = this.bodies[i];
            if (body.kinematic) continue;

            const pos = body.el.object3D.position;
            const quat = body.el.object3D.quaternion;

            if (body.justThrownTimer > 0) {
              body.justThrownTimer = Math.max(0, body.justThrownTimer - subDt);
            }

            body.velocity.y += this.data.gravity * subDt;

            pos.x += body.velocity.x * subDt;
            pos.y += body.velocity.y * subDt;
            pos.z += body.velocity.z * subDt;

            const angSpeed = body.angularVelocity.length();
            if (angSpeed > 0.0001) {
              const axis = body.angularVelocity.clone().normalize();
              const deltaQuat = new THREE.Quaternion().setFromAxisAngle(axis, angSpeed * subDt);
              quat.premultiply(deltaQuat);
            }

            const withinFloorBounds =
              Math.abs(pos.x) <= floorHalfExtent &&
              Math.abs(pos.z) <= floorHalfExtent;

            if (withinFloorBounds) {

              const contactLocal = body.getSupportPointLocal(DOWN);
              const r = contactLocal.clone().applyQuaternion(quat);
              const contactWorldY = pos.y + r.y;

              if (contactWorldY < 0) {

                pos.y -= contactWorldY;

                const pointVelocity = body.velocity.clone().add(
                  body.angularVelocity.clone().cross(r)
                );

                const vAlongNormal = pointVelocity.dot(UP);

                if (vAlongNormal < 0) {

                  const invMass = 1;
                  const invInertia = 1 / body.inertia;

                  const rxn = r.clone().cross(UP);
                  const denom = invMass + invInertia * rxn.dot(rxn);

                  const j = -(1 + body.data.restitution) * vAlongNormal / denom;
                  const impulse = UP.clone().multiplyScalar(j);

                  body.velocity.add(impulse.clone().multiplyScalar(invMass));
                  body.angularVelocity.add(
                    r.clone().cross(impulse).multiplyScalar(invInertia)
                  );

                  if (body.justThrownTimer <= 0) {

                    const tangentVel = pointVelocity.clone().sub(UP.clone().multiplyScalar(vAlongNormal));
                    const tangentSpeed = tangentVel.length();

                    if (tangentSpeed > 0.0001) {
                      const tangentDir = tangentVel.clone().divideScalar(tangentSpeed);
                      const maxFriction = body.data.friction * Math.abs(j);
                      const frictionMag = Math.min(tangentSpeed * invMass, maxFriction);
                      const frictionImpulse = tangentDir.multiplyScalar(-frictionMag);

                      body.velocity.add(frictionImpulse.clone().multiplyScalar(invMass));
                      body.angularVelocity.add(
                        r.clone().cross(frictionImpulse).multiplyScalar(invInertia)
                      );
                    }
                  }
                }

                body.angularVelocity.multiplyScalar(0.9);

                if (
                  body.velocity.length() < LINEAR_SLEEP_EPS &&
                  body.angularVelocity.length() < ANGULAR_SLEEP_EPS
                ) {
                  body.restTime += subDt;
                  if (body.restTime > SLEEP_DELAY) {
                    body.velocity.set(0, 0, 0);
                    body.angularVelocity.set(0, 0, 0);
                  }
                } else {
                  body.restTime = 0;
                }
              }
            }

            body.velocity.multiplyScalar(0.999);
            body.angularVelocity.multiplyScalar(0.995);
          }

          for (let i = 0; i < this.bodies.length; i++) {
            for (let j = i + 1; j < this.bodies.length; j++) {

              const a = this.bodies[i];
              const b = this.bodies[j];

              if (a.kinematic && b.kinematic) continue;

              const posA = a.el.object3D.position;
              const posB = b.el.object3D.position;

              const delta = new THREE.Vector3().subVectors(posB, posA);
              const dist = delta.length();

              if (dist < 0.0001) continue;

              const dir = delta.clone().divideScalar(dist);

              const extentA = a.getExtentAlongDirection(dir);
              const extentB = b.getExtentAlongDirection(dir.clone().negate());
              const minDist = extentA + extentB;

              if (dist < minDist) {

                const overlap = minDist - dist;
                const normal = dir;

                if (a.kinematic) {
                  posB.add(normal.clone().multiplyScalar(overlap));
                  const vAlongNormal = b.velocity.dot(normal);
                  if (vAlongNormal < 0) {
                    b.velocity.sub(normal.clone().multiplyScalar(vAlongNormal));
                  }
                } else if (b.kinematic) {
                  posA.sub(normal.clone().multiplyScalar(overlap));
                  const vAlongNormal = a.velocity.dot(normal.clone().negate());
                  if (vAlongNormal < 0) {
                    a.velocity.add(normal.clone().multiplyScalar(vAlongNormal));
                  }
                } else {
                  posA.sub(normal.clone().multiplyScalar(overlap / 2));
                  posB.add(normal.clone().multiplyScalar(overlap / 2));

                  const relVel = new THREE.Vector3().subVectors(b.velocity, a.velocity);
                  const sepVel = relVel.dot(normal);

                  if (sepVel < 0) {
                    const restitution = Math.min(a.data.restitution, b.data.restitution);
                    const impulse = normal.clone().multiplyScalar(-sepVel * (1 + restitution) / 2);
                    a.velocity.sub(impulse);
                    b.velocity.add(impulse);
                  }
                }
              }
            }
          }
        }

        // Sécurité "kill plane" : uniquement pour les objets qui ont
        // un vrai sens à "revenir" (box/sphère/cylindre/arme). Les
        // balles (noRespawn: true) ne reviennent jamais, elles
        // continuent de tomber puis sont supprimées par leur timeout.
        for (let i = 0; i < this.bodies.length; i++) {
          const body = this.bodies[i];
          if (body.kinematic) continue;
          if (body.data.noRespawn) continue;

          if (body.el.object3D.position.y < this.data.killY) {
            body.el.object3D.position.copy(body.spawnPosition);
            body.el.object3D.quaternion.copy(body.spawnQuaternion);
            body.velocity.set(0, 0, 0);
            body.angularVelocity.set(0, 0, 0);
            body.restTime = 0;
            body.justThrownTimer = 0;
          }
        }
      }

    });

    AFRAME.registerComponent('physics-body', {

      schema: {
        shape: { type: 'string', default: 'box' },

        width: { type: 'number', default: 1 },
        height: { type: 'number', default: 1 },
        depth: { type: 'number', default: 1 },

        radius: { type: 'number', default: 0.5 },

        restitution: { type: 'number', default: 0.15 },
        friction: { type: 'number', default: 0.35 },

        // Les balles n'ont pas besoin (et ne doivent pas) revenir à
        // un "point de spawn" après être tombées du bord du sol.
        noRespawn: { type: 'boolean', default: false }
      },

      init: function () {

        this.kinematic = false;

        this.justThrownTimer = 0;
        this.restTime = 0;

        this.spawnPosition = this.el.object3D.position.clone();
        this.spawnQuaternion = this.el.object3D.quaternion.clone();

        this._invQuat = new THREE.Quaternion();
        this._dirLocal = new THREE.Vector3();

        this.inertia = this.computeInertia();

        this.system = this.el.sceneEl.systems['physics-world'];
        this.system.registerBody(this);
      },

      computeInertia: function () {

        const data = this.data;
        let inertia;

        if (data.shape === 'sphere') {
          inertia = 0.4 * data.radius * data.radius;
        } else if (data.shape === 'cylinder') {
          const ixx = (3 * data.radius * data.radius + data.height * data.height) / 12;
          const iyy = (data.radius * data.radius) / 2;
          inertia = (2 * ixx + iyy) / 3;
        } else {
          const w = data.width, h = data.height, d = data.depth;
          const ixx = (h * h + d * d) / 12;
          const iyy = (w * w + d * d) / 12;
          const izz = (w * w + h * h) / 12;
          inertia = (ixx + iyy + izz) / 3;

      getExtentAlongDirection: function (dirWorld) {

        const data = this.data;

        if (data.shape === 'sphere') {
          return data.radius;

        this._invQuat.copy(this.el.object3D.quaternion).invert();
        this._dirLocal.copy(dirWorld).applyQuaternion(this._invQuat);

        if (data.shape === 'box') {
          const hx = data.width / 2;
          const hy = data.height / 2;
          const hz = data.depth / 2;

          return (
            Math.abs(this._dirLocal.x) * hx +
            Math.abs(this._dirLocal.y) * hy +
            Math.abs(this._dirLocal.z) * hz
          );
        }

        if (data.shape === 'cylinder') {
          const hh = data.height / 2;
          const r = data.radius;

          const axisComponent = this._dirLocal.y;
          const radialComponent = Math.sqrt(Math.max(0, 1 - axisComponent * axisComponent));

          return hh * Math.abs(axisComponent) + r * radialComponent;
        }

        return data.radius;
      },

      getSupportPointLocal: function (dirWorld) {

        const data = this.data;

        this._invQuat.copy(this.el.object3D.quaternion).invert();
        const dirLocal = dirWorld.clone().applyQuaternion(this._invQuat);

        if (data.shape === 'sphere') {
          return dirLocal.multiplyScalar(data.radius);
        }

        if (data.shape === 'box') {
          const hx = data.width / 2;
          const hy = data.height / 2;
          const hz = data.depth / 2;

          return new THREE.Vector3(
            Math.sign(dirLocal.x) * hx,
            Math.sign(dirLocal.y) * hy,
            Math.sign(dirLocal.z) * hz
          );
        }

        if (data.shape === 'cylinder') {
          const extent = this.getExtentAlongDirection(dirWorld);
          return dirLocal.multiplyScalar(extent);
        }

        return dirLocal.multiplyScalar(data.radius);
      },

      remove: function () {
        this.system.unregisterBody(this);
      }

        this.el.object3D.getWorldQuaternion(this.controllerQuaternion);

            .subVectors(this.controllerPosition, this.prevControllerPosition)
            .divideScalar(dt);

        this.prevControllerPosition.copy(this.controllerPosition);

            this.angularVelocityHistory.push(instantAngular);

        this.prevControllerQuaternion.copy(this.controllerQuaternion);
        this.hasPrevQuaternion = true;

        this.tempPosition
          .copy(this.localPosition)
          .applyQuaternion(this.controllerQuaternion)

          .copy(this.controllerQuaternion)

<script type="text/plain" id="code-ex4">
    // SYSTEME PHYSIQUE MAISON
    // NOUVEAU (ex4) : chaque corps peut avoir un callback
    // "onCollide(otherBody)" appelé dès qu'un vrai contact est
    // détecté avec un autre corps -> utilisé par les cibles pour
    // savoir qu'une balle les a touchées, sans dupliquer la
    // logique de collision.
    AFRAME.registerSystem('physics-world', {

      schema: {
        gravity: { type: 'number', default: -9.81 },
        floorHalfExtent: { type: 'number', default: 10 },
        killY: { type: 'number', default: -20 }
      },

      init: function () {
        this.bodies = [];
      },

      registerBody: function (component) {
        this.bodies.push(component);
      },

      unregisterBody: function (component) {
        const index = this.bodies.indexOf(component);
        if (index !== -1) this.bodies.splice(index, 1);
      },

      tick: function (time, delta) {

        if (!delta) return;

        const dt = Math.min(delta / 1000, 0.05);
        const subSteps = 4;
        const subDt = dt / subSteps;

        const DOWN = new THREE.Vector3(0, -1, 0);
        const UP = new THREE.Vector3(0, 1, 0);

        const LINEAR_SLEEP_EPS = 0.03;
        const ANGULAR_SLEEP_EPS = 0.12;
        const SLEEP_DELAY = 0.25;

        const floorHalfExtent = this.data.floorHalfExtent;

        for (let s = 0; s < subSteps; s++) {

          for (let i = 0; i < this.bodies.length; i++) {
            const body = this.bodies[i];
            if (body.kinematic) continue;

            const pos = body.el.object3D.position;
            const quat = body.el.object3D.quaternion;

            if (body.justThrownTimer > 0) {
              body.justThrownTimer = Math.max(0, body.justThrownTimer - subDt);
            }

            body.velocity.y += this.data.gravity * subDt;

            pos.x += body.velocity.x * subDt;
            pos.y += body.velocity.y * subDt;
            pos.z += body.velocity.z * subDt;

            const angSpeed = body.angularVelocity.length();
            if (angSpeed > 0.0001) {
              const axis = body.angularVelocity.clone().normalize();
              const deltaQuat = new THREE.Quaternion().setFromAxisAngle(axis, angSpeed * subDt);
              quat.premultiply(deltaQuat);
            }

            const withinFloorBounds =
              Math.abs(pos.x) <= floorHalfExtent &&
              Math.abs(pos.z) <= floorHalfExtent;

            if (withinFloorBounds) {

              const contactLocal = body.getSupportPointLocal(DOWN);
              const r = contactLocal.clone().applyQuaternion(quat);
              const contactWorldY = pos.y + r.y;

              if (contactWorldY < 0) {

                pos.y -= contactWorldY;

                const pointVelocity = body.velocity.clone().add(
                  body.angularVelocity.clone().cross(r)
                );

                const vAlongNormal = pointVelocity.dot(UP);

                if (vAlongNormal < 0) {

                  const invMass = 1;
                  const invInertia = 1 / body.inertia;

                  const rxn = r.clone().cross(UP);
                  const denom = invMass + invInertia * rxn.dot(rxn);

                  const j = -(1 + body.data.restitution) * vAlongNormal / denom;
                  const impulse = UP.clone().multiplyScalar(j);

                  body.velocity.add(impulse.clone().multiplyScalar(invMass));
                  body.angularVelocity.add(
                    r.clone().cross(impulse).multiplyScalar(invInertia)
                  );

                  if (body.justThrownTimer <= 0) {

                    const tangentVel = pointVelocity.clone().sub(UP.clone().multiplyScalar(vAlongNormal));
                    const tangentSpeed = tangentVel.length();

                    if (tangentSpeed > 0.0001) {
                      const tangentDir = tangentVel.clone().divideScalar(tangentSpeed);
                      const maxFriction = body.data.friction * Math.abs(j);
                      const frictionMag = Math.min(tangentSpeed * invMass, maxFriction);
                      const frictionImpulse = tangentDir.multiplyScalar(-frictionMag);

                      body.velocity.add(frictionImpulse.clone().multiplyScalar(invMass));
                      body.angularVelocity.add(
                        r.clone().cross(frictionImpulse).multiplyScalar(invInertia)
                      );
                    }
                  }
                }

                body.angularVelocity.multiplyScalar(0.9);

                if (
                  body.velocity.length() < LINEAR_SLEEP_EPS &&
                  body.angularVelocity.length() < ANGULAR_SLEEP_EPS
                ) {
                  body.restTime += subDt;
                  if (body.restTime > SLEEP_DELAY) {
                    body.velocity.set(0, 0, 0);
                    body.angularVelocity.set(0, 0, 0);
                  }
                } else {
                  body.restTime = 0;
                }
              }
            }

            body.velocity.multiplyScalar(0.999);
            body.angularVelocity.multiplyScalar(0.995);
          }

          // Collisions entre objets (+ déclenchement des callbacks onCollide)
          for (let i = 0; i < this.bodies.length; i++) {
            for (let j = i + 1; j < this.bodies.length; j++) {

              const a = this.bodies[i];
              const b = this.bodies[j];

              if (a.kinematic && b.kinematic) continue;

              const posA = a.el.object3D.position;
              const posB = b.el.object3D.position;

              const delta = new THREE.Vector3().subVectors(posB, posA);
              const dist = delta.length();

              if (dist < 0.0001) continue;

              const dir = delta.clone().divideScalar(dist);

              const extentA = a.getExtentAlongDirection(dir);
              const extentB = b.getExtentAlongDirection(dir.clone().negate());
              const minDist = extentA + extentB;

              if (dist < minDist) {

                // NOUVEAU (ex4) : notifie les deux corps qu'un contact
                // a eu lieu. Les callbacks ne doivent JAMAIS modifier
                // le DOM/la liste "this.bodies" directement ici -> ils
                // doivent juste poser un drapeau (voir composant "target").
                if (a.onCollide) a.onCollide(b);
                if (b.onCollide) b.onCollide(a);

                const overlap = minDist - dist;
                const normal = dir;

                if (a.kinematic) {
                  posB.add(normal.clone().multiplyScalar(overlap));
                  const vAlongNormal = b.velocity.dot(normal);
                  if (vAlongNormal < 0) {
                    b.velocity.sub(normal.clone().multiplyScalar(vAlongNormal));
                  }
                } else if (b.kinematic) {
                  posA.sub(normal.clone().multiplyScalar(overlap));
                  const vAlongNormal = a.velocity.dot(normal.clone().negate());
                  if (vAlongNormal < 0) {
                    a.velocity.add(normal.clone().multiplyScalar(vAlongNormal));
                  }
                } else {
                  posA.sub(normal.clone().multiplyScalar(overlap / 2));
                  posB.add(normal.clone().multiplyScalar(overlap / 2));

                  const relVel = new THREE.Vector3().subVectors(b.velocity, a.velocity);
                  const sepVel = relVel.dot(normal);

                  if (sepVel < 0) {
                    const restitution = Math.min(a.data.restitution, b.data.restitution);
                    const impulse = normal.clone().multiplyScalar(-sepVel * (1 + restitution) / 2);
                    a.velocity.sub(impulse);
                    b.velocity.add(impulse);
                  }
                }
              }
            }
          }
        }

        for (let i = 0; i < this.bodies.length; i++) {
          const body = this.bodies[i];
          if (body.kinematic) continue;
          if (body.data.noRespawn) continue;

          if (body.el.object3D.position.y < this.data.killY) {
            body.el.object3D.position.copy(body.spawnPosition);
            body.el.object3D.quaternion.copy(body.spawnQuaternion);
            body.velocity.set(0, 0, 0);
            body.angularVelocity.set(0, 0, 0);
            body.restTime = 0;
            body.justThrownTimer = 0;
          }
        }
      }

    });

    AFRAME.registerComponent('physics-body', {

      schema: {
        shape: { type: 'string', default: 'box' },

        width: { type: 'number', default: 1 },
        height: { type: 'number', default: 1 },
        depth: { type: 'number', default: 1 },

        radius: { type: 'number', default: 0.5 },

        restitution: { type: 'number', default: 0.15 },
        friction: { type: 'number', default: 0.35 },

        noRespawn: { type: 'boolean', default: false }
      },

      init: function () {
        this.velocity = new THREE.Vector3(0, 0, 0);
        this.angularVelocity = new THREE.Vector3(0, 0, 0);
        this.kinematic = false;

        this.justThrownTimer = 0;
        this.restTime = 0;

        this.spawnPosition = this.el.object3D.position.clone();
        this.spawnQuaternion = this.el.object3D.quaternion.clone();

        // NOUVEAU (ex4) : callback optionnel appelé par le système
        // physique dès qu'un contact avec un autre corps est détecté.
        this.onCollide = null;

        this._invQuat = new THREE.Quaternion();
        this._dirLocal = new THREE.Vector3();

        this.inertia = this.computeInertia();

        this.system = this.el.sceneEl.systems['physics-world'];
        this.system.registerBody(this);
      },

      computeInertia: function () {

        const data = this.data;
        let inertia;

        if (data.shape === 'sphere') {
          inertia = 0.4 * data.radius * data.radius;
        } else if (data.shape === 'cylinder') {
          const ixx = (3 * data.radius * data.radius + data.height * data.height) / 12;
          const iyy = (data.radius * data.radius) / 2;
          inertia = (2 * ixx + iyy) / 3;
        } else {
          const w = data.width, h = data.height, d = data.depth;
          const ixx = (h * h + d * d) / 12;
          const iyy = (w * w + d * d) / 12;
          const izz = (w * w + h * h) / 12;
          inertia = (ixx + iyy + izz) / 3;
        }

        return Math.max(inertia, 0.02);
      },

      getExtentAlongDirection: function (dirWorld) {

        const data = this.data;

        if (data.shape === 'sphere') {
          return data.radius;
        }

        this._invQuat.copy(this.el.object3D.quaternion).invert();
        this._dirLocal.copy(dirWorld).applyQuaternion(this._invQuat);

        if (data.shape === 'box') {
          const hx = data.width / 2;
          const hy = data.height / 2;
          const hz = data.depth / 2;

          return (
            Math.abs(this._dirLocal.x) * hx +
            Math.abs(this._dirLocal.y) * hy +
            Math.abs(this._dirLocal.z) * hz
          );
        }

        if (data.shape === 'cylinder') {
          const hh = data.height / 2;
          const r = data.radius;

          const axisComponent = this._dirLocal.y;
          const radialComponent = Math.sqrt(Math.max(0, 1 - axisComponent * axisComponent));

          return hh * Math.abs(axisComponent) + r * radialComponent;
        }

        return data.radius;
      },

      getSupportPointLocal: function (dirWorld) {

        const data = this.data;

        this._invQuat.copy(this.el.object3D.quaternion).invert();
        const dirLocal = dirWorld.clone().applyQuaternion(this._invQuat);

        if (data.shape === 'sphere') {
          return dirLocal.multiplyScalar(data.radius);
        }

        if (data.shape === 'box') {
          const hx = data.width / 2;
          const hy = data.height / 2;
          const hz = data.depth / 2;

          return new THREE.Vector3(
            Math.sign(dirLocal.x) * hx,
            Math.sign(dirLocal.y) * hy,
            Math.sign(dirLocal.z) * hz
          );
        }

        if (data.shape === 'cylinder') {
          const extent = this.getExtentAlongDirection(dirWorld);
          return dirLocal.multiplyScalar(extent);
        }

        return dirLocal.multiplyScalar(data.radius);
      },

      remove: function () {
        this.system.unregisterBody(this);
      }

    });


    // NOUVEAU (ex4) : système audio d'impact
    // Génère un son "hit" procéduralement (oscillateur + enveloppe,
    // aucun fichier requis) et le spatialise en 3D via
    // THREE.PositionalAudio -> volume/atténuation réels selon la
    // distance entre l'impact et la caméra (l'oreille du joueur).
    AFRAME.registerSystem('impact-audio', {

      schema: {
        volume: { type: 'number', default: 0.6 },
        refDistance: { type: 'number', default: 1 },   // distance en dessous de laquelle le son est à plein volume
        maxDistance: { type: 'number', default: 25 },   // au-delà, volume quasi nul
        rolloffFactor: { type: 'number', default: 2 }   // vitesse d'atténuation entre les deux
      },

      init: function () {
        this.listener = new THREE.AudioListener();
        this.attachToCamera();
      },

      attachToCamera: function () {
        const trySetup = () => {
          const camera = this.el.camera; // caméra active gérée par A-Frame
          if (camera) {
            camera.add(this.listener);
          } else {
            setTimeout(trySetup, 200);
          }
        };
        trySetup();
      },

      playImpact: function (worldPosition) {

        // Débloque l'AudioContext si le navigateur l'a suspendu
        // (règle standard : nécessite une interaction utilisateur,
        // déjà satisfaite ici puisqu'on vient de tirer/toucher).
        if (this.listener.context.state === 'suspended') {
          this.listener.context.resume();
        }

        const sound = new THREE.PositionalAudio(this.listener);

        sound.setRefDistance(this.data.refDistance);
        sound.setMaxDistance(this.data.maxDistance);
        sound.setRolloffFactor(this.data.rolloffFactor);
        sound.setDistanceModel('inverse');
        sound.setVolume(this.data.volume);

        const ctx = this.listener.context;
        const now = ctx.currentTime;

        // --- synthèse procédurale du son d'impact ---
        const oscillator = ctx.createOscillator();
        const envelope = ctx.createGain();

        oscillator.type = 'triangle';
        oscillator.frequency.setValueAtTime(700, now);
        oscillator.frequency.exponentialRampToValueAtTime(90, now + 0.18);

        envelope.gain.setValueAtTime(1, now);
        envelope.gain.exponentialRampToValueAtTime(0.001, now + 0.22);

        oscillator.connect(envelope);
        sound.setNodeSource(envelope);
        // ---------------------------------------------

        const holder = new THREE.Object3D();
        holder.position.copy(worldPosition);
        holder.add(sound);
        this.el.object3D.add(holder);

        oscillator.start(now);
        oscillator.stop(now + 0.22);

        oscillator.onended = () => {
          this.el.object3D.remove(holder);
          sound.disconnect();
        };
      }

    });


    // NOUVEAU (ex4) : effet de particules (débris) à l'impact
    // Léger et autonome : ne passe PAS par physics-world (juste
    // décoratif), donc n'alourdit pas les calculs de collision.
    AFRAME.registerComponent('particle-piece', {

      init: function () {
        this.velocity = new THREE.Vector3(0, 0, 0); // fixé juste après par spawnHitParticles
        this.age = 0;
        this.lifetime = 0.5 + Math.random() * 0.3;
      },

      tick: function (time, delta) {

        if (!delta) return;
        const dt = delta / 1000;
        this.age += dt;

        this.velocity.y += -9.81 * dt;

        const pos = this.el.object3D.position;
        pos.x += this.velocity.x * dt;
        pos.y += this.velocity.y * dt;
        pos.z += this.velocity.z * dt;

        const t = Math.min(1, this.age / this.lifetime);
        const scale = Math.max(0.0001, 1 - t);
        this.el.object3D.scale.set(scale, scale, scale);

        if (this.age >= this.lifetime) {
          if (this.el.parentNode) this.el.parentNode.removeChild(this.el);
        }
      }

    });

    // Fonction utilitaire : fait exploser N petits débris depuis un
    // point d'impact, dans des directions aléatoires.
    function spawnHitParticles(sceneEl, position, color) {

      const count = 10;

        const piece = document.createElement('a-entity');

        piece.setAttribute('material', `color: ${color || '#FFD54A'}; shader: flat`);
        piece.setAttribute('position', position);
        piece.setAttribute('particle-piece', '');

        sceneEl.appendChild(piece);

        const dir = new THREE.Vector3(
          Math.random() * 2 - 1,
          Math.random() * 1.5 + 0.4,
          Math.random() * 2 - 1
        ).normalize();

        const speed = 1.5 + Math.random() * 2.5;

        piece.addEventListener('loaded', () => {

    // NOUVEAU (ex4) : composant "cible"

    // IMPORTANT : le callback onCollide (appelé DANS la boucle de

    AFRAME.registerComponent('target', {

      init: function () {

        this.hit = false;

          const body = this.el.components['physics-body'];
          if (!body) {
            console.warn('target: physics-body manquant sur', this.el.id);

          body.kinematic = true;
          body.onCollide = (other) => this.onCollideCallback(other);
        });

        const color = (materialData && materialData.color) || '#FFFFFF';
        spawnHitParticles(document.getElementById('content'), worldPos, color);

        if (this.el.parentNode) {
          this.el.parentNode.removeChild(this.el);
        }

        this.el.sceneEl.emit('target-destroyed');
      }

    });


    // NOUVEAU (ex4) : générateur de cibles aléatoires

        }

        if (!target) {
          console.log('Aucun objet grabbable');
          return;
        }

        console.log('GRAB:', target.id);

        this.grabbed = target;

        this.el.object3D.getWorldPosition(this.controllerPosition);
        this.el.object3D.getWorldQuaternion(this.controllerQuaternion);

        const objectWorldPosition = new THREE.Vector3();
        const objectWorldQuaternion = new THREE.Quaternion();

        target.object3D.getWorldPosition(objectWorldPosition);
        target.object3D.getWorldQuaternion(objectWorldQuaternion);

        this.localPosition
          .copy(objectWorldPosition)
          .sub(this.controllerPosition)
          .applyQuaternion(this.controllerQuaternion.clone().invert());

        this.localQuaternion
          .copy(this.controllerQuaternion)
          .invert()
          .multiply(objectWorldQuaternion);

        const body = target.components['physics-body'];
        if (body) {
          body.kinematic = true;
          body.velocity.set(0, 0, 0);
          body.angularVelocity.set(0, 0, 0);
        }

        this.velocityHistory = [];
        this.hasPrevPosition = false;

        this.angularVelocityHistory = [];
        this.hasPrevQuaternion = false;

        target.classList.add('grabbed');
        target.emit('grab-start');
      },

      endGrab: function () {

        if (!this.grabbed) return;

        console.log('TRIGGER UP');

        const object = this.grabbed;

        const throwVelocity = new THREE.Vector3();
        if (this.velocityHistory.length > 0) {
          this.velocityHistory.forEach((v) => throwVelocity.add(v));
          throwVelocity.divideScalar(this.velocityHistory.length);
        }

        const throwAngularVelocity = new THREE.Vector3();
        if (this.angularVelocityHistory.length > 0) {
          this.angularVelocityHistory.forEach((v) => throwAngularVelocity.add(v));
          throwAngularVelocity.divideScalar(this.angularVelocityHistory.length);
        }

        const body = object.components['physics-body'];
        if (body) {
          body.kinematic = false;
          body.velocity.copy(throwVelocity);
          body.angularVelocity.copy(throwAngularVelocity);
          body.justThrownTimer = 0.15;
          body.restTime = 0;
        }

        object.classList.remove('grabbed');
        object.emit('grab-end');

        this.grabbed = null;
      },

      tick: function (time, delta) {

        if (!this.grabbed) return;
        if (!delta) return;

        const object = this.grabbed.object3D;

        this.el.object3D.getWorldPosition(this.controllerPosition);
        this.el.object3D.getWorldQuaternion(this.controllerQuaternion);

        const dt = delta / 1000;

        if (this.hasPrevPosition && dt > 0) {
          const instantVelocity = new THREE.Vector3()
            .subVectors(this.controllerPosition, this.prevControllerPosition)
            .divideScalar(dt);

          this.velocityHistory.push(instantVelocity);
          if (this.velocityHistory.length > 5) this.velocityHistory.shift();
        }
        this.prevControllerPosition.copy(this.controllerPosition);
        this.hasPrevPosition = true;

        if (this.hasPrevQuaternion && dt > 0) {

          const deltaQuat = this.controllerQuaternion.clone()
            .multiply(this.prevControllerQuaternion.clone().invert());

          const w = THREE.MathUtils.clamp(deltaQuat.w, -1, 1);
          let angle = 2 * Math.acos(w);
          if (angle > Math.PI) angle -= 2 * Math.PI;

          const sinHalf = Math.sqrt(Math.max(0, 1 - w * w));
          const axis = new THREE.Vector3(deltaQuat.x, deltaQuat.y, deltaQuat.z);

          if (sinHalf > 0.0001) {
            axis.divideScalar(sinHalf);
            const instantAngular = axis.multiplyScalar(angle / dt);
            this.angularVelocityHistory.push(instantAngular);
            if (this.angularVelocityHistory.length > 5) this.angularVelocityHistory.shift();
          }
        }
        this.prevControllerQuaternion.copy(this.controllerQuaternion);
        this.hasPrevQuaternion = true;

        this.tempPosition
          .copy(this.localPosition)
          .applyQuaternion(this.controllerQuaternion)
          .add(this.controllerPosition);

        this.tempQuaternion
          .copy(this.controllerQuaternion)
          .multiply(this.localQuaternion);

        if (object.parent) {

          const parentWorldPosition = new THREE.Vector3();
          const parentWorldQuaternion = new THREE.Quaternion();

          object.parent.getWorldPosition(parentWorldPosition);
          object.parent.getWorldQuaternion(parentWorldQuaternion);

          object.position
            .copy(this.tempPosition)
            .sub(parentWorldPosition)
            .applyQuaternion(parentWorldQuaternion.clone().invert());

          object.quaternion
            .copy(parentWorldQuaternion.clone().invert())
            .multiply(this.tempQuaternion);
        }

      }

    });


    // Grab + tir de l'arme
    AFRAME.registerComponent('gun-grab', {

      schema: {
        gripOffsetPosition: { type: 'vec3', default: { x: 0, y: -0.02, z: 0.05 } },
        gripOffsetRotation: { type: 'vec3', default: { x: -30, y: 0, z: 0 } },
        muzzleLocalOffset: { type: 'vec3', default: { x: 0, y: 0.02, z: -0.28 } },

        bulletSpeed: { type: 'number', default: 20 },
        bulletRadius: { type: 'number', default: 0.035 },
        bulletColor: { type: 'color', default: '#FFD54A' },
        bulletLifetime: { type: 'number', default: 4 },
        fireCooldown: { type: 'number', default: 0.15 }
      },

      init: function () {

        this.heldGun = null;

        this.prevControllerPosition = new THREE.Vector3();
        this.hasPrevPosition = false;
        this.velocityHistory = [];

        this.lastShotTime = 0;

        this.el.addEventListener('gripdown', () => this.startGrabGun());
        this.el.addEventListener('gripup', () => this.endGrabGun());
        this.el.addEventListener('triggerdown', () => this.tryFire());
      },

      computeMuzzleLocalTransform: function () {

        const offsetPos = new THREE.Vector3(
          this.data.gripOffsetPosition.x,
          this.data.gripOffsetPosition.y,
          this.data.gripOffsetPosition.z
        );

        const offsetEuler = new THREE.Euler(
          THREE.MathUtils.degToRad(this.data.gripOffsetRotation.x),
          THREE.MathUtils.degToRad(this.data.gripOffsetRotation.y),
          THREE.MathUtils.degToRad(this.data.gripOffsetRotation.z)
        );
        const offsetQuat = new THREE.Quaternion().setFromEuler(offsetEuler);

        const muzzleLocal = new THREE.Vector3(
          this.data.muzzleLocalOffset.x,
          this.data.muzzleLocalOffset.y,
          this.data.muzzleLocalOffset.z
        );

        const origin = muzzleLocal.clone()
          .applyQuaternion(offsetQuat)
          .add(offsetPos);

        const direction = new THREE.Vector3(0, 0, -1)
          .applyQuaternion(offsetQuat);

        return { origin: origin, direction: direction, offsetQuat: offsetQuat, offsetPos: offsetPos };
      },

      startGrabGun: function () {

        console.log('GRIP DOWN — tentative de saisie de l\'arme');

        const laserGrab = this.el.components['laser-grab'];
        if (laserGrab && laserGrab.grabbed) {
          console.log('Main déjà occupée par un autre objet');
          return;
        }

        if (this.heldGun) return;

        const raycaster = this.el.components.raycaster;
        if (!raycaster) return;

        const intersections = raycaster.intersections;
        if (!intersections || intersections.length === 0) {
          console.log('Grip pressé mais aucune arme visée par le laser');
          return;
        }

        let target = null;

        for (let i = 0; i < intersections.length; i++) {
          let candidate = intersections[i].object && intersections[i].object.el;

          while (candidate && !candidate.classList.contains('gun-grabbable') && candidate.parentEl) {
            candidate = candidate.parentEl;
          }

          if (candidate && candidate.classList.contains('gun-grabbable')) {
            target = candidate;
            break;
          }
        }

        if (!target) {
          console.log('Aucune arme grabbable visée');
          return;
        }

        console.log('GUN GRAB:', target.id);

        this.heldGun = target;

        const body = target.components['physics-body'];
        if (body) {
          body.kinematic = true;
          body.velocity.set(0, 0, 0);
          body.angularVelocity.set(0, 0, 0);
        }

        this.velocityHistory = [];
        this.hasPrevPosition = false;

        const transform = this.computeMuzzleLocalTransform();
        this.el.setAttribute('raycaster', 'origin', transform.origin);
        this.el.setAttribute('raycaster', 'direction', transform.direction);

        target.classList.add('grabbed');
        target.emit('grab-start');
      },

      endGrabGun: function () {

        if (!this.heldGun) return;

        const object = this.heldGun;

        const throwVelocity = new THREE.Vector3();
        if (this.velocityHistory.length > 0) {
          this.velocityHistory.forEach((v) => throwVelocity.add(v));
          throwVelocity.divideScalar(this.velocityHistory.length);
        }

        const body = object.components['physics-body'];
        if (body) {
          body.kinematic = false;
          body.velocity.copy(throwVelocity);
          body.justThrownTimer = 0.15;
          body.restTime = 0;
        }

        object.classList.remove('grabbed');
        object.emit('grab-end');

        this.heldGun = null;

        this.el.setAttribute('raycaster', 'origin', { x: 0, y: 0, z: 0 });
        this.el.setAttribute('raycaster', 'direction', { x: 0, y: 0, z: -1 });
      },

      tryFire: function () {

        if (!this.heldGun) return;

        const now = performance.now();
        if (now - this.lastShotTime < this.data.fireCooldown * 1000) return;
        this.lastShotTime = now;

        const muzzle = this.heldGun.querySelector('.muzzle');
        if (!muzzle) {
          console.warn('Pas de point de sortie (.muzzle) trouvé sur l\'arme');
          return;
        }

        const muzzleWorldPos = new THREE.Vector3();
        muzzle.object3D.getWorldPosition(muzzleWorldPos);

        const gunWorldQuat = new THREE.Quaternion();
        this.heldGun.object3D.getWorldQuaternion(gunWorldQuat);

        const forward = new THREE.Vector3(0, 0, -1)
          .applyQuaternion(gunWorldQuat)
          .normalize();

        this.spawnBullet(muzzleWorldPos, forward);

        this.heldGun.emit('gun-fired');
        console.log('FIRE from', this.el.id, '| direction:', forward);
      },

      spawnBullet: function (position, direction) {

        const scene = document.getElementById('content');
        const bullet = document.createElement('a-entity');

        bullet.setAttribute('geometry', {
          primitive: 'sphere',
          radius: this.data.bulletRadius
        });

        bullet.setAttribute('material', {
          color: this.data.bulletColor,
          shader: 'flat'
        });

        bullet.setAttribute('position', position);
        bullet.classList.add('bullet');

        bullet.setAttribute('physics-body', {
          shape: 'sphere',
          radius: this.data.bulletRadius,
          restitution: 0.2,
          friction: 0.3,
          noRespawn: true
        });

        scene.appendChild(bullet);

        bullet.addEventListener('loaded', () => {
          const body = bullet.components['physics-body'];
          if (body) {
            body.velocity.copy(direction.clone().multiplyScalar(this.data.bulletSpeed));
            body.justThrownTimer = 0.1;
          }
        });

        setTimeout(() => {
          if (bullet.parentNode) {
            bullet.parentNode.removeChild(bullet);
          }
        }, this.data.bulletLifetime * 1000);
      },

      tick: function (time, delta) {

        if (!this.heldGun) return;
        if (!delta) return;

        const dt = delta / 1000;

        const controllerPos = new THREE.Vector3();
        const controllerQuat = new THREE.Quaternion();
        this.el.object3D.getWorldPosition(controllerPos);
        this.el.object3D.getWorldQuaternion(controllerQuat);

        if (this.hasPrevPosition && dt > 0) {
          const instantVelocity = new THREE.Vector3()
            .subVectors(controllerPos, this.prevControllerPosition)
            .divideScalar(dt);

          this.velocityHistory.push(instantVelocity);
          if (this.velocityHistory.length > 5) this.velocityHistory.shift();
        }
        this.prevControllerPosition.copy(controllerPos);
        this.hasPrevPosition = true;

        const transform = this.computeMuzzleLocalTransform();

        const worldPos = transform.offsetPos.clone()
          .applyQuaternion(controllerQuat)
          .add(controllerPos);

        const worldQuat = controllerQuat.clone().multiply(transform.offsetQuat);

        const object = this.heldGun.object3D;

        if (object.parent) {

          const parentPos = new THREE.Vector3();
          const parentQuat = new THREE.Quaternion();
          object.parent.getWorldPosition(parentPos);
          object.parent.getWorldQuaternion(parentQuat);

          object.position
            .copy(worldPos)
            .sub(parentPos)
            .applyQuaternion(parentQuat.clone().invert());

          object.quaternion
            .copy(parentQuat.clone().invert())
            .multiply(worldQuat);
        }
      }

    });


    AFRAME.registerComponent('controller-debug', {

      init: function () {

        this.el.addEventListener('triggerdown', () => {
          console.log('DEBUG → TRIGGER DOWN', this.el.id);
        });

        this.el.addEventListener('triggerup', () => {
          console.log('DEBUG → TRIGGER UP', this.el.id);
        });

        this.el.addEventListener('gripdown', () => {
          console.log('DEBUG → GRIP DOWN', this.el.id);
        });

        this.el.addEventListener('gripup', () => {
          console.log('DEBUG → GRIP UP', this.el.id);
        });

        this.el.addEventListener('thumbstickmoved', (event) => {
          console.log('STICK', this.el.id, event.detail.x, event.detail.y);
        });
      }

    });

  </script>

<script>
  var EXERCISES = {
    '1': { attrs: {} },
    '2': { attrs: {"background": "color: #111111", "physics-world": "gravity: -9.81"} },
    '3': { attrs: {"background": "color: #111111", "physics-world": "gravity: -9.81; floorHalfExtent: 10; killY: -20"} },
    '4': { attrs: {"background": "color: #111111", "physics-world": "gravity: -9.81; floorHalfExtent: 10; killY: -20", "impact-audio": "volume: 0.6; refDistance: 1; maxDistance: 25; rolloffFactor: 2", "target-spawner": "spawnInterval: 4; maxTargets: 5; initialTargets: 3"} },
  };

  // tous les composants/systèmes personnalisés définis par au moins un exercice
  var CUSTOM_NAMES = ["controller-debug", "gun-grab", "impact-audio", "joystick-turn", "laser-cursor", "laser-grab", "left-thumbstick-move", "particle-piece", "physics-body", "physics-world", "target", "target-spawner"];

  var DYNAMIC_ATTRS = ['background', 'physics-world', 'impact-audio', 'target-spawner'];

  function highlightOn(el)  { el.setAttribute('material', 'color', '#3bb4cc'); }
  function highlightOff(el) { el.setAttribute('material', 'color', '#4fc3d9'); }

  function wireMenuPanels() {
    document.querySelectorAll('.menu-item').forEach(function (el) {
      el.addEventListener('mouseenter', function () { highlightOn(el); });
      el.addEventListener('mouseleave', function () { highlightOff(el); });
      el.addEventListener('click', function () {
        selectExercise(el.getAttribute('data-ex'));
      });
    });
  }

  function showMenu() {
    var content = document.getElementById('content');
    content.innerHTML = '';
    var tpl = document.getElementById('tpl-menu');
    content.appendChild(tpl.content.cloneNode(true));
    wireMenuPanels();

    document.getElementById('global-menu-btn').setAttribute('visible', 'false');
    document.getElementById('hint').style.display = '';
  }

  function returnToMenu() {
    var sceneEl = document.getElementById('scene');
    DYNAMIC_ATTRS.forEach(function (key) {
      if (sceneEl.hasAttribute(key)) sceneEl.removeAttribute(key);
    });
    showMenu();
  }

  // dé-enregistre les composants/systèmes de l'exercice précédent pour
  // pouvoir charger un exercice différent sans recharger la page
  function resetComponentRegistry() {
    CUSTOM_NAMES.forEach(function (name) {
      if (window.AFRAME.components && window.AFRAME.components[name]) {
        delete window.AFRAME.components[name];
      }
      if (window.AFRAME.systems && window.AFRAME.systems[name]) {
        delete window.AFRAME.systems[name];
      }
    });
  }

  function wireGlobalMenuButton(camEl) {
    if (!camEl) return;
    camEl.setAttribute('cursor', 'fuse: true; fuseTimeout: 1200');
    camEl.setAttribute('raycaster', 'objects: .global-menu-btn; far: 30');

    var btn = document.getElementById('global-menu-btn');
    var ring = document.getElementById('global-menu-fuse-ring');
    btn.setAttribute('visible', 'true');

    btn.addEventListener('mouseenter', function () { ring.setAttribute('visible', 'true'); });
    btn.addEventListener('mouseleave', function () { ring.setAttribute('visible', 'false'); });
    btn.addEventListener('click', function () {
      ring.setAttribute('visible', 'false');
      returnToMenu();
    });
  }

  function selectExercise(n) {
    var info = EXERCISES[n];
    if (!info) return;

    var sceneEl = document.getElementById('scene');
    var content = document.getElementById('content');

    document.getElementById('global-menu-btn').setAttribute('visible', 'false');

    // message de chargement affiché directement dans la scène VR
    content.innerHTML = '';
    var loadingText = document.createElement('a-text');
    loadingText.setAttribute('value', 'Chargement de l\'exercice ' + n + '...');
    loadingText.setAttribute('align', 'center');
    loadingText.setAttribute('color', '#ffffff');
    loadingText.setAttribute('width', '4');
    loadingText.setAttribute('position', '0 1.6 -2');
    content.appendChild(loadingText);

    // laisse le temps au message de s'afficher avant d'injecter la suite
    setTimeout(function () {
      // retire proprement les réglages de scène de l'exercice précédent
      DYNAMIC_ATTRS.forEach(function (key) {
        if (sceneEl.hasAttribute(key)) sceneEl.removeAttribute(key);
      });

      // libère les anciens composants/systèmes pour pouvoir en enregistrer de nouveaux
      resetComponentRegistry();

      // enregistre les composants/systèmes propres à cet exercice
      var code = document.getElementById('code-ex' + n).textContent;
      (0, eval)(code);

      // applique les réglages de scène propres à cet exercice (physique, cibles, son...)
      Object.keys(info.attrs).forEach(function (key) {
        sceneEl.setAttribute(key, info.attrs[key]);
      });

      // remplace le contenu par la scène de l'exercice choisi
      var tpl = document.getElementById('tpl-ex' + n);
      content.innerHTML = '';
      content.appendChild(tpl.content.cloneNode(true));

      // attache le bouton flottant "retour au menu" à la caméra de cet exercice
      var camEl = content.querySelector('[camera]');
      wireGlobalMenuButton(camEl);

      document.getElementById('hint').style.display = 'none';
    }, 50);
  }

  document.addEventListener('DOMContentLoaded', function () {
    showMenu();
  });
</script>
