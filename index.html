<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>VR - Grab & Movement</title>


  <!-- ========================================================= -->
  <!-- A-FRAME                                                   -->
  <!-- ========================================================= -->

  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>


  <!-- ========================================================= -->
  <!-- A-FRAME EXTRAS                                            -->
  <!-- ========================================================= -->

  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.0/dist/aframe-extras.min.js"></script>


  <!-- ========================================================= -->
  <!-- CANNON.JS : MOTEUR PHYSIQUE                               -->
  <!-- ========================================================= -->

  <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.20.0/cannon.min.js"></script>


  <script>


    /* =========================================================
       MOUVEMENT AVEC LE JOYSTICK GAUCHE
       ========================================================= */

    AFRAME.registerComponent('left-thumbstick-move', {

      schema: {

        rig: {
          type: 'selector'
        },

        speed: {
          type: 'number',
          default: 2.0
        }

      },


      init: function () {

        this.axisX = 0;
        this.axisY = 0;

        this.onThumbstick =
          this.onThumbstick.bind(this);

        this.el.addEventListener(
          'thumbstickmoved',
          this.onThumbstick
        );

      },


      onThumbstick: function (event) {

        this.axisX =
          event.detail.x || 0;

        this.axisY =
          event.detail.y || 0;

      },


      tick: function (time, delta) {

        if (!this.data.rig) return;

        if (!delta) return;


        /*
         * A-Frame :
         *
         * y < 0 = avant
         * y > 0 = arrière
         */

        const x = this.axisX;
        const z = -this.axisY;


        if (
          Math.abs(x) < 0.05 &&
          Math.abs(z) < 0.05
        ) {

          return;

        }


        const dt =
          delta / 1000;


        const direction =
          new THREE.Vector3(
            x,
            0,
            z
          );


        direction.applyAxisAngle(
          new THREE.Vector3(0, 1, 0),
          this.data.rig.object3D.rotation.y
        );


        this.data.rig.object3D.position.x +=
          direction.x *
          this.data.speed *
          dt;


        this.data.rig.object3D.position.z +=
          direction.z *
          this.data.speed *
          dt;

      }

    });


    /* =========================================================
       ROTATION AVEC LE JOYSTICK DROIT
       ========================================================= */

    AFRAME.registerComponent('joystick-turn', {

      schema: {

        speed: {
          type: 'number',
          default: 1.8
        }

      },


      init: function () {

        this.axisX = 0;


        this.el.addEventListener(
          'thumbstickmoved',
          (event) => {

            this.axisX =
              event.detail.x || 0;

          }
        );

      },


      tick: function (time, delta) {

        if (!delta) return;


        if (
          Math.abs(this.axisX) < 0.1
        ) {

          return;

        }


        const dt =
          delta / 1000;


        this.el.parentEl.object3D.rotation.y -=
          this.axisX *
          this.data.speed *
          dt;

      }

    });


    /* =========================================================
       CUSTOM CURSOR POUR LE LASER
       ========================================================= */

    AFRAME.registerComponent('laser-cursor', {

      schema: {

        color: {
          type: 'color',
          default: '#00FFFF'
        }

      },


      init: function () {

        this.cursor =
          document.createElement('a-sphere');


        this.cursor.setAttribute(
          'radius',
          '0.018'
        );


        this.cursor.setAttribute(
          'color',
          this.data.color
        );


        this.cursor.setAttribute(
          'visible',
          'false'
        );


        this.cursor.setAttribute(
          'material',
          'shader: flat; opacity: 0.95'
        );


        this.el.sceneEl.appendChild(
          this.cursor
        );


        this.onIntersection =
          this.onIntersection.bind(this);


        this.onClear =
          this.onClear.bind(this);


        this.el.addEventListener(
          'raycaster-intersection',
          this.onIntersection
        );


        this.el.addEventListener(
          'raycaster-intersection-cleared',
          this.onClear
        );

      },


      onIntersection: function (event) {

        const raycaster =
          this.el.components.raycaster;


        if (!raycaster) return;


        const intersections =
          raycaster.intersections;


        if (
          !intersections ||
          intersections.length === 0
        ) {

          return;

        }


        const hit =
          intersections[0];


        if (
          !hit ||
          !hit.point
        ) {

          return;

        }


        if (
          !hit.object ||
          !hit.object.el
        ) {

          return;

        }


        let target =
          hit.object.el;


        while (
          target &&
          !target.classList.contains('grabbable') &&
          target.parentEl
        ) {

          target =
            target.parentEl;

        }


        if (
          !target ||
          !target.classList.contains('grabbable')
        ) {

          this.cursor.setAttribute(
            'visible',
            'false'
          );

          return;

        }


        this.cursor.object3D.position.copy(
          hit.point
        );


        this.cursor.setAttribute(
          'visible',
          'true'
        );

      },


      onClear: function () {

        this.cursor.setAttribute(
          'visible',
          'false'
        );

      },


      remove: function () {

        if (this.cursor) {
          this.cursor.remove();
        }


        this.el.removeEventListener(
          'raycaster-intersection',
          this.onIntersection
        );


        this.el.removeEventListener(
          'raycaster-intersection-cleared',
          this.onClear
        );

      }

    });


    /* =========================================================
       MONDE PHYSIQUE
       ========================================================= */

    AFRAME.registerComponent('physics-world', {

      init: function () {

        /*
         * Création du monde Cannon.
         */

        this.world =
          new CANNON.World();


        /*
         * Gravité.
         */

        this.world.gravity.set(
          0,
          -9.81,
          0
        );


        /*
         * Collision.
         */

        this.world.broadphase =
          new CANNON.NaiveBroadphase();


        this.world.allowSleep = true;


        /*
         * Solver.
         *
         * Augmenté pour avoir des collisions
         * plus stables en VR.
         */

        this.world.solver.iterations = 20;

        this.world.solver.tolerance = 0.001;


        /*
         * Matériaux.
         */

        this.floorMaterial =
          new CANNON.Material('floor');


        this.objectMaterial =
          new CANNON.Material('object');


        /*
         * Collision sol / objets.
         */

        this.world.addContactMaterial(
          new CANNON.ContactMaterial(
            this.floorMaterial,
            this.objectMaterial,
            {
              friction: 0.7,
              restitution: 0.05
            }
          )
        );


        /*
         * Collision objet / objet.
         */

        this.world.addContactMaterial(
          new CANNON.ContactMaterial(
            this.objectMaterial,
            this.objectMaterial,
            {
              friction: 0.6,
              restitution: 0.1
            }
          )
        );


        /*
         * -----------------------------------------------------
         * SOL PHYSIQUE
         * -----------------------------------------------------
         */

        const floorBody =
          new CANNON.Body({
            mass: 0,
            material: this.floorMaterial
          });


        const floorShape =
          new CANNON.Plane();


        floorBody.addShape(
          floorShape
        );


        /*
         * Cannon Plane est vertical
         * par défaut.
         *
         * Rotation pour obtenir un sol horizontal.
         */

        floorBody.quaternion.setFromEuler(
          -Math.PI / 2,
          0,
          0
        );


        floorBody.position.set(
          0,
          0,
          0
        );


        this.world.addBody(
          floorBody
        );


        /*
         * Liste des objets physiques.
         */

        this.bodies = [];


        /*
         * Création des objets une fois
         * que A-Frame a initialisé tous
         * les composants.
         */

        this.createBodies();


        /*
         * Temps précédent.
         */

        this.lastTime =
          performance.now();

      },


      createBodies: function () {

        const objects =
          this.el.querySelectorAll(
            '[physics-body]'
          );


        objects.forEach(
          (element) => {

            const physics =
              element.components['physics-body'];


            if (!physics) {
              return;
            }


            physics.createBody(
              this.world,
              this.objectMaterial
            );


            this.bodies.push(
              physics
            );

          }
        );

      },


      tick: function (time, delta) {

        if (!this.world) {
          return;
        }


        if (!delta) {
          return;
        }


        /*
         * Protection contre les gros ralentissements.
         */

        const dt =
          Math.min(
            delta / 1000,
            0.1
          );


        /*
         * Simulation physique.
         */

        this.world.step(
          1 / 60,
          dt,
          5
        );


        /*
         * Synchronisation physique -> A-Frame.
         */

        this.bodies.forEach(
          (physics) => {

            physics.updateAFrame();

          }
        );

      }

    });


    /* =========================================================
       CORPS PHYSIQUE DES OBJETS
       ========================================================= */

    AFRAME.registerComponent('physics-body', {

      schema: {

        shape: {
          type: 'string',
          default: 'box'
        },


        width: {
          type: 'number',
          default: 1
        },


        height: {
          type: 'number',
          default: 1
        },


        depth: {
          type: 'number',
          default: 1
        },


        radius: {
          type: 'number',
          default: 0.5
        },


        mass: {
          type: 'number',
          default: 1
        }

      },


      init: function () {

        this.body = null;

        this.grabbed = false;

        this.originalMass =
          this.data.mass;

      },


      createBody: function (
        world,
        material
      ) {

        if (this.body) {
          return;
        }


        let shape;


        /*
         * =====================================================
         * CUBE
         * =====================================================
         */

        if (
          this.data.shape === 'box'
        ) {

          shape =
            new CANNON.Box(
              new CANNON.Vec3(
                this.data.width / 2,
                this.data.height / 2,
                this.data.depth / 2
              )
            );

        }


        /*
         * =====================================================
         * SPHERE
         * =====================================================
         */

        else if (
          this.data.shape === 'sphere'
        ) {

          shape =
            new CANNON.Sphere(
              this.data.radius
            );

        }


        /*
         * =====================================================
         * CYLINDRE
         * =====================================================
         */

        else if (
          this.data.shape === 'cylinder'
        ) {

          shape =
            new CANNON.Cylinder(
              this.data.radius,
              this.data.radius,
              this.data.height,
              32
            );

        }


        /*
         * Corps dynamique.
         */

        this.body =
          new CANNON.Body({

            mass: this.data.mass,

            material: material,

            /*
             * Très faible amortissement linéaire.
             */

            linearDamping: 0.01,

            /*
             * Amortissement de rotation.
             */

            angularDamping: 0.08,

            allowSleep: true,

            sleepSpeedLimit: 0.08,

            sleepTimeLimit: 0.5

          });


        /*
         * Ajout de la forme.
         */

        this.body.addShape(
          shape
        );


        /*
         * Position initiale A-Frame.
         */

        const position =
          this.el.object3D.position;


        this.body.position.set(
          position.x,
          position.y,
          position.z
        );


        /*
         * Rotation initiale A-Frame.
         */

        const quaternion =
          this.el.object3D.quaternion;


        this.body.quaternion.set(
          quaternion.x,
          quaternion.y,
          quaternion.z,
          quaternion.w
        );


        /*
         * Ajout au monde.
         */

        world.addBody(
          this.body
        );


        this.body.wakeUp();

      },


      /*
       * ======================================================
       * PHYSIQUE -> A-FRAME
       * ======================================================
       */

      updateAFrame: function () {

        if (!this.body) {
          return;
        }


        /*
         * Pendant un grab, laser-grab
         * contrôle directement l'objet.
         */

        if (this.grabbed) {
          return;
        }


        this.el.object3D.position.set(
          this.body.position.x,
          this.body.position.y,
          this.body.position.z
        );


        this.el.object3D.quaternion.set(
          this.body.quaternion.x,
          this.body.quaternion.y,
          this.body.quaternion.z,
          this.body.quaternion.w
        );

      },


      /*
       * ======================================================
       * DÉBUT DU GRAB
       * ======================================================
       */

      startGrab: function () {

        if (!this.body) {
          return;
        }


        this.grabbed =
          true;


        /*
         * Corps cinématique pendant
         * qu'on le tient.
         */

        this.body.type =
          CANNON.Body.KINEMATIC;


        this.body.mass = 0;


        this.body.velocity.set(
          0,
          0,
          0
        );


        this.body.angularVelocity.set(
          0,
          0,
          0
        );


        this.body.updateMassProperties();


        this.body.wakeUp();

      },


      /*
       * ======================================================
       * FIN DU GRAB
       * ======================================================
       */

      endGrab: function () {

        if (!this.body) {
          return;
        }


        this.grabbed =
          false;


        /*
         * Retour en dynamique.
         */

        this.body.type =
          CANNON.Body.DYNAMIC;


        this.body.mass =
          this.originalMass;


        this.body.updateMassProperties();


        this.body.wakeUp();

      },


      /*
       * ======================================================
       * VITESSE DE LANCER
       * ======================================================
       */

      setVelocity: function (
        velocity
      ) {

        if (!this.body) {
          return;
        }


        this.body.velocity.set(
          velocity.x,
          velocity.y,
          velocity.z
        );


        this.body.wakeUp();

      }

    });


    /* =========================================================
       GRAB AVEC LE LASER + TRIGGER
       ========================================================= */

    AFRAME.registerComponent('laser-grab', {

      schema: {

        rig: {
          type: 'selector'
        }

      },


      init: function () {

        this.grabbed = null;


        /*
         * Position relative objet / contrôleur.
         */

        this.localPosition =
          new THREE.Vector3();


        /*
         * Rotation relative.
         */

        this.localQuaternion =
          new THREE.Quaternion();


        /*
         * Transformations contrôleur.
         */

        this.controllerPosition =
          new THREE.Vector3();


        this.controllerQuaternion =
          new THREE.Quaternion();


        /*
         * Transformations temporaires.
         */

        this.tempPosition =
          new THREE.Vector3();


        this.tempQuaternion =
          new THREE.Quaternion();


        /*
         * =====================================================
         * VITESSE POUR LE LANCER
         * =====================================================
         */

        this.prevControllerPosition =
          new THREE.Vector3();


        this.controllerVelocity =
          new THREE.Vector3();


        this.hasPrevPosition =
          false;


        /*
         * Trigger.
         */

        this.el.addEventListener(
          'triggerdown',
          () => {

            this.startGrab();

          }
        );


        this.el.addEventListener(
          'triggerup',
          () => {

            this.endGrab();

          }
        );

      },


      /* =====================================================
         START GRAB
         ===================================================== */

      startGrab: function () {

        console.log(
          'TRIGGER DOWN'
        );


        const raycaster =
          this.el.components.raycaster;


        if (!raycaster) {

          console.warn(
            'Raycaster absent'
          );

          return;

        }


        const intersections =
          raycaster.intersections;


        if (
          !intersections ||
          intersections.length === 0
        ) {

          console.log(
            'Trigger pressé mais aucun objet'
          );

          return;

        }


        let target = null;


        /*
         * Recherche du premier objet grabbable.
         */

        for (
          let i = 0;
          i < intersections.length;
          i++
        ) {

          let candidate =
            intersections[i].object &&
            intersections[i].object.el;


          while (
            candidate &&
            !candidate.classList.contains(
              'grabbable'
            ) &&
            candidate.parentEl
          ) {

            candidate =
              candidate.parentEl;

          }


          if (
            candidate &&
            candidate.classList.contains(
              'grabbable'
            )
          ) {

            target =
              candidate;

            break;

          }

        }


        if (!target) {

          console.log(
            'Aucun objet grabbable'
          );

          return;

        }


        const physics =
          target.components[
            'physics-body'
          ];


        if (
          !physics ||
          !physics.body
        ) {

          console.warn(
            'Objet sans physics-body'
          );

          return;

        }


        console.log(
          'GRAB:',
          target.id
        );


        this.grabbed =
          target;


        /*
         * =====================================================
         * POSITION CONTROLEUR
         * =====================================================
         */

        this.el.object3D.getWorldPosition(
          this.controllerPosition
        );


        /*
         * =====================================================
         * ROTATION CONTROLEUR
         * =====================================================
         */

        this.el.object3D.getWorldQuaternion(
          this.controllerQuaternion
        );


        /*
         * =====================================================
         * POSITION OBJET
         * =====================================================
         */

        const objectWorldPosition =
          new THREE.Vector3();


        target.object3D.getWorldPosition(
          objectWorldPosition
        );


        /*
         * =====================================================
         * ROTATION OBJET
         * =====================================================
         */

        const objectWorldQuaternion =
          new THREE.Quaternion();


        target.object3D.getWorldQuaternion(
          objectWorldQuaternion
        );


        /*
         * Position locale.
         */

        this.localPosition
          .copy(objectWorldPosition)
          .sub(this.controllerPosition)
          .applyQuaternion(
            this.controllerQuaternion
              .clone()
              .invert()
          );


        /*
         * Rotation locale.
         */

        this.localQuaternion
          .copy(
            this.controllerQuaternion
          )
          .invert()
          .multiply(
            objectWorldQuaternion
          );


        /*
         * =====================================================
         * RESET VITESSE
         * =====================================================
         */

        this.controllerVelocity.set(
          0,
          0,
          0
        );


        this.prevControllerPosition.copy(
          this.controllerPosition
        );


        this.hasPrevPosition =
          true;


        /*
         * Passe le corps en cinématique.
         */

        physics.startGrab();


        /*
         * État visuel.
         */

        target.classList.add(
          'grabbed'
        );


        target.emit(
          'grab-start'
        );

      },


      /* =====================================================
         END GRAB
         ===================================================== */

      endGrab: function () {

        if (!this.grabbed) {
          return;
        }


        console.log(
          'TRIGGER UP'
        );


        const object =
          this.grabbed;


        const physics =
          object.components[
            'physics-body'
          ];


        /*
         * Retour en dynamique.
         */

        physics.endGrab();


        /*
         * =====================================================
         * LANCER
         * =====================================================
         *
         * La vitesse de la main devient
         * la vitesse initiale de l'objet.
         */

        physics.setVelocity(
          this.controllerVelocity
        );


        /*
         * État visuel.
         */

        object.classList.remove(
          'grabbed'
        );


        object.emit(
          'grab-end'
        );


        /*
         * Reset.
         */

        this.grabbed =
          null;


        this.hasPrevPosition =
          false;

      },


      /* =====================================================
         TICK
         ===================================================== */

      tick: function (
        time,
        delta
      ) {

        if (!this.grabbed) {
          return;
        }


        const object =
          this.grabbed;


        const physics =
          object.components[
            'physics-body'
          ];


        if (
          !physics ||
          !physics.body
        ) {

          return;

        }


        /*
         * =====================================================
         * POSITION DU CONTROLEUR
         * =====================================================
         */

        this.el.object3D.getWorldPosition(
          this.controllerPosition
        );


        /*
         * =====================================================
         * ROTATION DU CONTROLEUR
         * =====================================================
         */

        this.el.object3D.getWorldQuaternion(
          this.controllerQuaternion
        );


        /*
         * =====================================================
         * VITESSE DU CONTROLEUR
         * =====================================================
         */

        if (
          delta > 0
        ) {

          const dt =
            delta / 1000;


          if (
            this.hasPrevPosition &&
            dt > 0
          ) {

            const instantVelocity =
              new THREE.Vector3()
                .subVectors(
                  this.controllerPosition,
                  this.prevControllerPosition
                )
                .divideScalar(dt);


            /*
             * Lissage de la vitesse.
             */

            this.controllerVelocity.lerp(
              instantVelocity,
              0.5
            );

          }


          this.prevControllerPosition.copy(
            this.controllerPosition
          );


          this.hasPrevPosition =
            true;

        }


        /*
         * =====================================================
         * POSITION OBJET
         * =====================================================
         */

        this.tempPosition
          .copy(this.localPosition)
          .applyQuaternion(
            this.controllerQuaternion
          )
          .add(
            this.controllerPosition
          );


        /*
         * =====================================================
         * ROTATION OBJET
         * =====================================================
         */

        this.tempQuaternion
          .copy(
            this.controllerQuaternion
          )
          .multiply(
            this.localQuaternion
          );


        /*
         * =====================================================
         * POSITION PHYSIQUE
         * =====================================================
         */

        physics.body.position.set(
          this.tempPosition.x,
          this.tempPosition.y,
          this.tempPosition.z
        );


        /*
         * =====================================================
         * ROTATION PHYSIQUE
         * =====================================================
         */

        physics.body.quaternion.set(
          this.tempQuaternion.x,
          this.tempQuaternion.y,
          this.tempQuaternion.z,
          this.tempQuaternion.w
        );


        /*
         * Tant que l'objet est tenu,
         * il n'a pas de vitesse propre.
         */

        physics.body.velocity.set(
          0,
          0,
          0
        );


        physics.body.angularVelocity.set(
          0,
          0,
          0
        );


        physics.body.wakeUp();


        /*
         * Mise à jour immédiate de l'objet A-Frame.
         */

        object.object3D.position.set(
          physics.body.position.x,
          physics.body.position.y,
          physics.body.position.z
        );


        object.object3D.quaternion.set(
          physics.body.quaternion.x,
          physics.body.quaternion.y,
          physics.body.quaternion.z,
          physics.body.quaternion.w
        );

      }

    });


    /* =========================================================
       DEBUG DES CONTROLEURS
       ========================================================= */

    AFRAME.registerComponent('controller-debug', {

      init: function () {

        this.el.addEventListener(
          'triggerdown',
          () => {

            console.log(
              'DEBUG → TRIGGER DOWN',
              this.el.id
            );

          }
        );


        this.el.addEventListener(
          'triggerup',
          () => {

            console.log(
              'DEBUG → TRIGGER UP',
              this.el.id
            );

          }
        );


        this.el.addEventListener(
          'thumbstickmoved',
          (event) => {

            console.log(
              'STICK',
              this.el.id,
              event.detail.x,
              event.detail.y
            );

          }
        );

      }

    });


  </script>

</head>


<body>


<a-scene

  physics-world

  background="color: #111111"

  renderer="
    antialias: true;
    shadowMap: true
  "

  vr-mode-ui="
    enabled: true
  "

>


  <!-- ======================================================= -->
  <!-- CIEL                                                     -->
  <!-- ======================================================= -->

  <a-sky
    color="#FFFFFF">
  </a-sky>


  <!-- ======================================================= -->
  <!-- LUMIERES                                                  -->
  <!-- ======================================================= -->

  <a-entity
    light="
      type: ambient;
      intensity: 0.7
    ">
  </a-entity>


  <a-entity
    light="
      type: directional;
      intensity: 1;
      castShadow: true
    "
    position="-2 5 3">
  </a-entity>


  <!-- ======================================================= -->
  <!-- SOL                                                       -->
  <!-- ======================================================= -->

  <a-plane

    position="0 0 0"

    rotation="-90 0 0"

    width="20"

    height="20"

    color="#7BC8A4"

    shadow="
      receive: true
    "

  >
  </a-plane>


  <!-- ======================================================= -->
  <!-- RIG                                                       -->
  <!-- ======================================================= -->

  <a-entity

    id="rig"

    position="0 0 2"

  >


    <!-- ===================================================== -->
    <!-- CAMERA                                                 -->
    <!-- ===================================================== -->

    <a-camera

      id="camera"

      position="0 1.6 0"

      look-controls="
        enabled: true
      "

    >
    </a-camera>


    <!-- ===================================================== -->
    <!-- MAIN GAUCHE                                            -->
    <!-- ===================================================== -->

    <a-entity

      id="leftHand"

      meta-touch-controls="
        hand: left;
        model: true
      "

      laser-controls="
        hand: left
      "

      raycaster="
        objects: .grabbable;
        far: 10;
        interval: 0
      "

      laser-cursor="
        color: #00FFFF
      "

      laser-grab="
        rig: #rig
      "

      left-thumbstick-move="
        rig: #rig;
        speed: 2.0
      "

      controller-debug

      line="
        color: #00FFFF;
        opacity: 0.8
      "

    >
    </a-entity>


    <!-- ===================================================== -->
    <!-- MAIN DROITE                                            -->
    <!-- ===================================================== -->

    <a-entity

      id="rightHand"

      meta-touch-controls="
        hand: right;
        model: true
      "

      laser-controls="
        hand: right
      "

      raycaster="
        objects: .grabbable;
        far: 10;
        interval: 0
      "

      laser-cursor="
        color: #00FFFF
      "

      laser-grab="
        rig: #rig
      "

      joystick-turn="
        speed: 1.8
      "

      controller-debug

      line="
        color: #00FFFF;
        opacity: 0.8
      "

    >
    </a-entity>


  </a-entity>


  <!-- ======================================================= -->
  <!-- CUBE                                                      -->
  <!-- ======================================================= -->

  <a-box

    id="box"

    class="grabbable"

    position="-2 1 -4"

    width="1"

    height="1"

    depth="1"

    color="#4CC3D9"

    shadow="
      cast: true;
      receive: true
    "

    physics-body="
      shape: box;
      width: 1;
      height: 1;
      depth: 1;
      mass: 1
    "

  >
  </a-box>


  <!-- ======================================================= -->
  <!-- SPHERE                                                    -->
  <!-- ======================================================= -->

  <a-sphere

    id="sphere"

    class="grabbable"

    position="2 1.25 -6"

    radius="1"

    color="#EF2D5E"

    shadow="
      cast: true;
      receive: true
    "

    physics-body="
      shape: sphere;
      radius: 1;
      mass: 1
    "

  >
  </a-sphere>


  <!-- ======================================================= -->
  <!-- CYLINDRE                                                  -->
  <!-- ======================================================= -->

  <a-cylinder

    id="cylinder"

    class="grabbable"

    position="-2 2 -7"

    color="#FFC65D"

    radius="0.5"

    height="2"

    shadow="
      cast: true;
      receive: true
    "

    physics-body="
      shape: cylinder;
      radius: 0.5;
      height: 2;
      mass: 1
    "

  >
  </a-cylinder>


</a-scene>


</body>

</html>
