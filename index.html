<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>VR - Grab & Movement</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

  <script>
    // =========================================================
    // SYSTEME PHYSIQUE MAISON (gravité + sol + collisions objets)
    // Collision "shape-aware" : chaque forme (box/sphère/cylindre)
    // calcule sa propre distance de contour selon la direction
    // testée et son orientation actuelle -> plus de clipping,
    // et un cylindre couché touche bien le sol à son rayon.
    // =========================================================
    AFRAME.registerSystem('physics-world', {

      schema: {
        gravity: { type: 'number', default: -9.81 }
      },

      init: function () {
        this.bodies = [];
      },

      registerBody: function (component) {
        this.bodies.push(component);
      },

      unregisterBody: function (component) {
        const index = this.bodies.indexOf(component);
        if (index !== -1) this.bodies.splice(index, 1);
      },

      tick: function (time, delta) {

        if (!delta) return;

        const dt = Math.min(delta / 1000, 0.05);
        const subSteps = 4;
        const subDt = dt / subSteps;

        const DOWN = new THREE.Vector3(0, -1, 0);

        for (let s = 0; s < subSteps; s++) {

          // 1) Gravité + intégration + collision avec le sol
          for (let i = 0; i < this.bodies.length; i++) {
            const body = this.bodies[i];
            if (body.kinematic) continue; // objet tenu en main -> pas de gravité

            const pos = body.el.object3D.position;

            body.velocity.y += this.data.gravity * subDt;

            pos.x += body.velocity.x * subDt;
            pos.y += body.velocity.y * subDt;
            pos.z += body.velocity.z * subDt;

            // Distance réelle entre le centre et le contour de la
            // forme, DANS LA DIRECTION DU BAS, selon son orientation
            // actuelle -> plus de "halfHeight" fixe qui trompe le
            // cylindre couché.
            const floorY = body.getExtentAlongDirection(DOWN);

            if (pos.y < floorY) {
              pos.y = floorY;

              if (body.velocity.y < 0) {
                body.velocity.y = -body.velocity.y * body.data.restitution;
                if (Math.abs(body.velocity.y) < 0.15) body.velocity.y = 0;
              }

              // frottement au sol
              body.velocity.x *= (1 - body.data.friction);
              body.velocity.z *= (1 - body.data.friction);
            }

            // léger amortissement dans l'air pour éviter les dérives numériques
            body.velocity.multiplyScalar(0.999);
          }

          // 2) Collisions entre objets, en utilisant le contour réel
          // de chaque forme dans la direction qui les sépare (au lieu
          // d'une sphère englobante fixe) -> beaucoup moins de clipping.
          for (let i = 0; i < this.bodies.length; i++) {
            for (let j = i + 1; j < this.bodies.length; j++) {

              const a = this.bodies[i];
              const b = this.bodies[j];

              if (a.kinematic && b.kinematic) continue;

              const posA = a.el.object3D.position;
              const posB = b.el.object3D.position;

              const delta = new THREE.Vector3().subVectors(posB, posA);
              const dist = delta.length();

              if (dist < 0.0001) continue;

              const dir = delta.clone().divideScalar(dist);

              // Combien A s'étend vers B, et combien B s'étend vers A,
              // chacun selon SA propre forme et SA propre rotation.
              const extentA = a.getExtentAlongDirection(dir);
              const extentB = b.getExtentAlongDirection(dir.clone().negate());
              const minDist = extentA + extentB;

              if (dist < minDist) {

                const overlap = minDist - dist;
                const normal = dir;

                if (a.kinematic) {
                  // a est tenu en main -> immobile, on ne pousse que b
                  posB.add(normal.clone().multiplyScalar(overlap));
                  const vAlongNormal = b.velocity.dot(normal);
                  if (vAlongNormal < 0) {
                    b.velocity.sub(normal.clone().multiplyScalar(vAlongNormal));
                  }
                } else if (b.kinematic) {
                  posA.sub(normal.clone().multiplyScalar(overlap));
                  const vAlongNormal = a.velocity.dot(normal.clone().negate());
                  if (vAlongNormal < 0) {
                    a.velocity.add(normal.clone().multiplyScalar(vAlongNormal));
                  }
                } else {
                  // les deux sont dynamiques -> on les sépare chacun de moitié
                  posA.sub(normal.clone().multiplyScalar(overlap / 2));
                  posB.add(normal.clone().multiplyScalar(overlap / 2));

                  // petit échange de vitesse le long de la normale (rebond simple)
                  const relVel = new THREE.Vector3().subVectors(b.velocity, a.velocity);
                  const sepVel = relVel.dot(normal);

                  if (sepVel < 0) {
                    const restitution = Math.min(a.data.restitution, b.data.restitution);
                    const impulse = normal.clone().multiplyScalar(-sepVel * (1 + restitution) / 2);
                    a.velocity.sub(impulse);
                    b.velocity.add(impulse);
                  }
                }
              }
            }
          }
        }
      }

    });

    // Composant à attacher à chaque objet grabbable/physique.
    // Chaque forme sait calculer, pour une direction donnée, la
    // distance entre son centre et son contour (fonction de support).
    AFRAME.registerComponent('physics-body', {

      schema: {
        shape: { type: 'string', default: 'box' }, // 'box' | 'sphere' | 'cylinder'

        // Box
        width: { type: 'number', default: 1 },
        height: { type: 'number', default: 1 },
        depth: { type: 'number', default: 1 },

        // Sphère & cylindre
        radius: { type: 'number', default: 0.5 },

        restitution: { type: 'number', default: 0.15 },
        friction: { type: 'number', default: 0.35 }
      },

      init: function () {
        this.velocity = new THREE.Vector3(0, 0, 0);
        this.kinematic = false; // true pendant qu'on tient l'objet dans la main

        this._invQuat = new THREE.Quaternion();
        this._dirLocal = new THREE.Vector3();

        this.system = this.el.sceneEl.systems['physics-world'];
        this.system.registerBody(this);
      },

      // Distance entre le centre de l'objet et son contour, dans la
      // direction "dirWorld" (unitaire), selon sa forme ET sa rotation
      // actuelle. C'est la clé qui rend les collisions fidèles au
      // vrai contour des formes (au lieu d'une sphère englobante).
      getExtentAlongDirection: function (dirWorld) {

        const data = this.data;

        if (data.shape === 'sphere') {
          return data.radius;
        }

        // On ramène la direction dans le repère local de l'objet
        // (annule sa rotation actuelle) pour pouvoir travailler sur
        // ses dimensions "au repos".
        this._invQuat.copy(this.el.object3D.quaternion).invert();
        this._dirLocal.copy(dirWorld).applyQuaternion(this._invQuat);

        if (data.shape === 'box') {
          const hx = data.width / 2;
          const hy = data.height / 2;
          const hz = data.depth / 2;

          return (
            Math.abs(this._dirLocal.x) * hx +
            Math.abs(this._dirLocal.y) * hy +
            Math.abs(this._dirLocal.z) * hz
          );
        }

        if (data.shape === 'cylinder') {
          // Axe local du cylindre = Y
          const hh = data.height / 2;
          const r = data.radius;

          const axisComponent = this._dirLocal.y;
          const radialComponent = Math.sqrt(
            Math.max(0, 1 - axisComponent * axisComponent)
          );

          return hh * Math.abs(axisComponent) + r * radialComponent;
        }

        return data.radius; // sécurité
      },

      remove: function () {
        this.system.unregisterBody(this);
      }

    });


    // =========================================================
    // Mouvement avec le joystick gauche (avant/arrière/gauche/droite)
    // =========================================================
    AFRAME.registerComponent('left-thumbstick-move', {

      schema: {
        rig: { type: 'selector' },
        speed: { type: 'number', default: 2.0 }
      },

      init: function () {
        this.axisX = 0;
        this.axisY = 0;
        this.onThumbstick = this.onThumbstick.bind(this);
        this.el.addEventListener('thumbstickmoved', this.onThumbstick);
      },

      onThumbstick: function (event) {
        this.axisX = event.detail.x || 0;
        this.axisY = event.detail.y || 0;
      },

      tick: function (time, delta) {

        if (!this.data.rig) return;
        if (!delta) return;

        // A-Frame donne : y < 0 = avant, y > 0 = arrière
        const x = this.axisX;
        const z = -this.axisY;

        if (Math.abs(x) < 0.05 && Math.abs(z) < 0.05) return;

        const dt = delta / 1000;
        const direction = new THREE.Vector3(x, 0, z);

        direction.applyAxisAngle(
          new THREE.Vector3(0, 1, 0),
          this.data.rig.object3D.rotation.y
        );

        this.data.rig.object3D.position.x += direction.x * this.data.speed * dt;
        this.data.rig.object3D.position.z += direction.z * this.data.speed * dt;
      }

    });


    // =========================================================
    // Rotation avec le joystick droit
    // =========================================================
    AFRAME.registerComponent('joystick-turn', {

      schema: {
        speed: { type: 'number', default: 1.8 }
      },

      init: function () {
        this.axisX = 0;
        this.el.addEventListener('thumbstickmoved', (event) => {
          this.axisX = event.detail.x || 0;
        });
      },

      tick: function (time, delta) {

        if (!delta) return;
        if (Math.abs(this.axisX) < 0.1) return;

        const dt = delta / 1000;
        this.el.parentEl.object3D.rotation.y -= this.axisX * this.data.speed * dt;
      }

    });


    // =========================================================
    // Curseur visuel pour le laser
    // =========================================================
    AFRAME.registerComponent('laser-cursor', {

      schema: {
        color: { type: 'color', default: '#00FFFF' }
      },

      init: function () {

        this.cursor = document.createElement('a-sphere');
        this.cursor.setAttribute('radius', '0.018');
        this.cursor.setAttribute('color', this.data.color);
        this.cursor.setAttribute('visible', 'false');
        this.cursor.setAttribute('material', 'shader: flat; opacity: 0.95');
        this.el.sceneEl.appendChild(this.cursor);

        this.onIntersection = this.onIntersection.bind(this);
        this.onClear = this.onClear.bind(this);

        this.el.addEventListener('raycaster-intersection', this.onIntersection);
        this.el.addEventListener('raycaster-intersection-cleared', this.onClear);
      },

      onIntersection: function (event) {

        const raycaster = this.el.components.raycaster;
        if (!raycaster) return;

        const intersections = raycaster.intersections;
        if (!intersections || intersections.length === 0) return;

        const hit = intersections[0];
        if (!hit || !hit.point) return;
        if (!hit.object || !hit.object.el) return;

        let target = hit.object.el;

        while (target && !target.classList.contains('grabbable') && target.parentEl) {
          target = target.parentEl;
        }

        if (!target || !target.classList.contains('grabbable')) {
          this.cursor.setAttribute('visible', 'false');
          return;
        }

        this.cursor.object3D.position.copy(hit.point);
        this.cursor.setAttribute('visible', 'true');
      },

      onClear: function () {
        this.cursor.setAttribute('visible', 'false');
      },

      remove: function () {
        if (this.cursor) this.cursor.remove();
        this.el.removeEventListener('raycaster-intersection', this.onIntersection);
        this.el.removeEventListener('raycaster-intersection-cleared', this.onClear);
      }

    });


    // =========================================================
    // Grab avec le laser + trigger (compatible physics-body maison)
    // =========================================================
    AFRAME.registerComponent('laser-grab', {

      schema: {
        rig: { type: 'selector' }
      },

      init: function () {

        this.grabbed = null;

        this.localPosition = new THREE.Vector3();
        this.localQuaternion = new THREE.Quaternion();
        this.controllerPosition = new THREE.Vector3();
        this.controllerQuaternion = new THREE.Quaternion();
        this.tempPosition = new THREE.Vector3();
        this.tempQuaternion = new THREE.Quaternion();

        // --- pour calculer la vitesse de lancer ---
        this.prevControllerPosition = new THREE.Vector3();
        this.hasPrevPosition = false;
        this.velocityHistory = [];
        // --------------------------------------------

        this.el.addEventListener('triggerdown', () => this.startGrab());
        this.el.addEventListener('triggerup', () => this.endGrab());
      },

      startGrab: function () {

        console.log('TRIGGER DOWN');

        const raycaster = this.el.components.raycaster;
        if (!raycaster) {
          console.warn('Raycaster absent');
          return;
        }

        const intersections = raycaster.intersections;
        if (!intersections || intersections.length === 0) {
          console.log('Trigger pressé mais aucun objet');
          return;
        }

        let target = null;

        for (let i = 0; i < intersections.length; i++) {
          let candidate = intersections[i].object && intersections[i].object.el;

          while (candidate && !candidate.classList.contains('grabbable') && candidate.parentEl) {
            candidate = candidate.parentEl;
          }

          if (candidate && candidate.classList.contains('grabbable')) {
            target = candidate;
            break;
          }
        }

        if (!target) {
          console.log('Aucun objet grabbable');
          return;
        }

        console.log('GRAB:', target.id);

        this.grabbed = target;

        this.el.object3D.getWorldPosition(this.controllerPosition);
        this.el.object3D.getWorldQuaternion(this.controllerQuaternion);

        const objectWorldPosition = new THREE.Vector3();
        const objectWorldQuaternion = new THREE.Quaternion();

        target.object3D.getWorldPosition(objectWorldPosition);
        target.object3D.getWorldQuaternion(objectWorldQuaternion);

        this.localPosition
          .copy(objectWorldPosition)
          .sub(this.controllerPosition)
          .applyQuaternion(this.controllerQuaternion.clone().invert());

        this.localQuaternion
          .copy(this.controllerQuaternion)
          .invert()
          .multiply(objectWorldQuaternion);

        // On passe l'objet en mode "kinematic" : il suit la main
        // sans subir la gravité, mais reste un obstacle pour les autres.
        const body = target.components['physics-body'];
        if (body) {
          body.kinematic = true;
          body.velocity.set(0, 0, 0);
        }

        this.velocityHistory = [];
        this.hasPrevPosition = false;

        target.classList.add('grabbed');
        target.emit('grab-start');
      },

      endGrab: function () {

        if (!this.grabbed) return;

        console.log('TRIGGER UP');

        const object = this.grabbed;

        // Vitesse moyenne du contrôleur sur les dernières frames = vitesse de lancer
        const throwVelocity = new THREE.Vector3();

        if (this.velocityHistory.length > 0) {
          this.velocityHistory.forEach((v) => throwVelocity.add(v));
          throwVelocity.divideScalar(this.velocityHistory.length);
        }

        const body = object.components['physics-body'];
        if (body) {
          body.kinematic = false;
          body.velocity.copy(throwVelocity);
        }

        object.classList.remove('grabbed');
        object.emit('grab-end');

        this.grabbed = null;
      },

      tick: function (time, delta) {

        if (!this.grabbed) return;
        if (!delta) return;

        const object = this.grabbed.object3D;

        this.el.object3D.getWorldPosition(this.controllerPosition);
        this.el.object3D.getWorldQuaternion(this.controllerQuaternion);

        // --- vitesse instantanée du contrôleur (pour le futur lancer) ---
        const dt = delta / 1000;

        if (this.hasPrevPosition && dt > 0) {
          const instantVelocity = new THREE.Vector3()
            .subVectors(this.controllerPosition, this.prevControllerPosition)
            .divideScalar(dt);

          this.velocityHistory.push(instantVelocity);
          if (this.velocityHistory.length > 5) this.velocityHistory.shift();
        }

        this.prevControllerPosition.copy(this.controllerPosition);
        this.hasPrevPosition = true;
        // -------------------------------------------------------------

        this.tempPosition
          .copy(this.localPosition)
          .applyQuaternion(this.controllerQuaternion)
          .add(this.controllerPosition);

        this.tempQuaternion
          .copy(this.controllerQuaternion)
          .multiply(this.localQuaternion);

        if (object.parent) {

          const parentWorldPosition = new THREE.Vector3();
          const parentWorldQuaternion = new THREE.Quaternion();

          object.parent.getWorldPosition(parentWorldPosition);
          object.parent.getWorldQuaternion(parentWorldQuaternion);

          object.position
            .copy(this.tempPosition)
            .sub(parentWorldPosition)
            .applyQuaternion(parentWorldQuaternion.clone().invert());

          object.quaternion
            .copy(parentWorldQuaternion.clone().invert())
            .multiply(this.tempQuaternion);
        }

      }

    });


    // Debug des contrôleurs
    AFRAME.registerComponent('controller-debug', {

      init: function () {

        this.el.addEventListener('triggerdown', () => {
          console.log('DEBUG → TRIGGER DOWN', this.el.id);
        });

        this.el.addEventListener('triggerup', () => {
          console.log('DEBUG → TRIGGER UP', this.el.id);
        });

        this.el.addEventListener('thumbstickmoved', (event) => {
          console.log('STICK', this.el.id, event.detail.x, event.detail.y);
        });
      }

    });

  </script>
</head>


<body>
<a-scene
  background="color: #111111"
  renderer="antialias: true; shadowMap: true"
  vr-mode-ui="enabled: true"
  physics-world="gravity: -9.81"
>
  <a-entity light="type: ambient; intensity: 0.7"></a-entity>
  <a-entity light="type: directional; intensity: 1; castShadow: true" position="-2 5 3"></a-entity>

  <a-plane
    position="0 0 0"
    rotation="-90 0 0"
    width="20"
    height="20"
    color="#7BC8A4"
    shadow="receive: true">
  </a-plane>

  <a-entity id="rig" position="0 0 2">

    <a-camera
      id="camera"
      position="0 1.6 0"
      look-controls="enabled: true">
    </a-camera>

    <a-entity
      id="leftHand"
      meta-touch-controls="hand: left; model: true"
      laser-controls="hand: left"
      raycaster="objects: .grabbable; far: 10; interval: 0"
      laser-cursor="color: #00FFFF"
      laser-grab="rig: #rig"
      left-thumbstick-move="rig: #rig; speed: 2.0"
      controller-debug
      line="color: #00FFFF; opacity: 0.8"
    >
    </a-entity>

    <a-entity
      id="rightHand"
      meta-touch-controls="hand: right; model: true"
      laser-controls="hand: right"
      raycaster="objects: .grabbable; far: 10; interval: 0"
      laser-cursor="color: #00FFFF"
      laser-grab="rig: #rig"
      joystick-turn="speed: 1.8"
      controller-debug
      line="color: #00FFFF; opacity: 0.8"
    >
    </a-entity>

  </a-entity>

  <a-box
    id="box"
    class="grabbable"
    position="-2 1 -4"
    width="1"
    height="1"
    depth="1"
    color="#4CC3D9"
    shadow="cast: true; receive: true"
    physics-body="shape: box; width: 1; height: 1; depth: 1; restitution: 0.1; friction: 0.4"
  >
  </a-box>

  <a-sphere
    id="sphere"
    class="grabbable"
    position="2 1.25 -6"
    radius="1"
    color="#EF2D5E"
    shadow="cast: true; receive: true"
    physics-body="shape: sphere; radius: 1; restitution: 0.4; friction: 0.2"
  >
  </a-sphere>

  <a-cylinder
    id="cylinder"
    class="grabbable"
    position="-2 2 -7"
    color="#FFC65D"
    radius="0.5"
    height="2"
    shadow="cast: true; receive: true"
    physics-body="shape: cylinder; radius: 0.5; height: 2; restitution: 0.1; friction: 0.4"
  >
  </a-cylinder>

  <a-sky color="#FFFFFF"></a-sky>
</a-scene>
</body>
</html>
