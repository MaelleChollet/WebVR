<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>VR - Grab & Movement</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

  <!-- A-Frame Extras -->
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.0/dist/aframe-extras.min.js"></script>

  <!-- VRAIE PHYSIQUE CANNON.JS -->
  <script src="https://cdn.jsdelivr.net/npm/@c-frame/aframe-physics-system@v4.2.2/dist/aframe-physics-system.min.js"></script>

  <script>

    /* ============================================================
       1. DÉPLACEMENT AU JOYSTICK GAUCHE
       ============================================================ */

    AFRAME.registerComponent('left-thumbstick-move', {

      schema: {
        speed: { default: 2.0 }
      },

      init: function () {

        this.axisX = 0;
        this.axisY = 0;

        this.el.addEventListener('thumbstickmoved', (event) => {

          this.axisX = event.detail.x;
          this.axisY = event.detail.y;

        });

      },

      tick: function (time, delta) {

        if (!this.el.object3D) return;

        const rig = document.querySelector('#rig');

        if (!rig) return;

        const dt = Math.min(delta / 1000, 0.05);

        const x = this.axisX;
        const y = this.axisY;

        if (Math.abs(x) < 0.1 && Math.abs(y) < 0.1) {
          return;
        }

        const camera = document.querySelector('#camera');

        if (!camera) return;

        // Direction avant/arrière selon le regard
        const direction = new THREE.Vector3();

        camera.object3D.getWorldDirection(direction);

        // On reste horizontal
        direction.y = 0;
        direction.normalize();

        // Droite
        const right = new THREE.Vector3(
          direction.z,
          0,
          -direction.x
        );

        right.normalize();

        const movement = new THREE.Vector3();

        // Avant / arrière
        movement.addScaledVector(direction, -y);

        // Gauche / droite
        movement.addScaledVector(right, x);

        if (movement.lengthSq() > 0) {

          movement.normalize();

          movement.multiplyScalar(
            this.data.speed * dt
          );

          rig.object3D.position.add(movement);

        }

      }

    });


    /* ============================================================
       2. ROTATION AU JOYSTICK DROIT
       ============================================================ */

    AFRAME.registerComponent('joystick-turn', {

      schema: {
        speed: { default: 1.8 }
      },

      init: function () {

        this.axisX = 0;

        this.el.addEventListener('thumbstickmoved', (event) => {

          this.axisX = event.detail.x;

        });

      },

      tick: function (time, delta) {

        const rig = document.querySelector('#rig');

        if (!rig) return;

        const dt = Math.min(delta / 1000, 0.05);

        if (Math.abs(this.axisX) < 0.1) {
          return;
        }

        rig.object3D.rotation.y -=
          this.axisX *
          this.data.speed *
          dt;

      }

    });


    /* ============================================================
       3. CURSEUR LASER
       ============================================================ */

    AFRAME.registerComponent('laser-cursor', {

      init: function () {

        this.cursor = document.createElement('a-entity');

        this.cursor.setAttribute(
          'geometry',
          'primitive: sphere; radius: 0.025'
        );

        this.cursor.setAttribute(
          'material',
          'color: #00ffff; emissive: #00ffff; emissiveIntensity: 2'
        );

        this.el.sceneEl.appendChild(this.cursor);

        this.raycaster = null;

      },

      tick: function () {

        if (!this.el.object3D) return;

        const raycasterComponent =
          this.el.components.raycaster;

        if (!raycasterComponent) {
          this.cursor.setAttribute('visible', false);
          return;
        }

        const intersections =
          raycasterComponent.intersections;

        if (!intersections || intersections.length === 0) {

          this.cursor.setAttribute('visible', false);

          return;
        }

        const intersection = intersections[0];

        if (!intersection || !intersection.point) {

          this.cursor.setAttribute('visible', false);

          return;
        }

        this.cursor.setAttribute('visible', true);

        this.cursor.object3D.position.copy(
          intersection.point
        );

      }

    });


    /* ============================================================
       4. MATÉRIAU PHYSIQUE
       
       On utilise :
       - friction élevée
       - restitution = 0

       => les objets ne font pas les rebonds artificiels
          de l'ancienne physique faite à la main.
       ============================================================ */

    AFRAME.registerComponent('physics-material', {

      init: function () {

        const scene = this.el.sceneEl;

        const applyMaterial = () => {

          if (!window.CANNON) {
            console.warn(
              'CANNON.js non disponible.'
            );
            return;
          }

          if (
            !scene.systems.physics ||
            !scene.systems.physics.driver ||
            !scene.systems.physics.driver.world
          ) {
            return;
          }

          const world =
            scene.systems.physics.driver.world;

          /*
           * On crée une seule fois le matériau partagé.
           */
          if (!scene.__vrPhysicsMaterial) {

            scene.__vrPhysicsMaterial =
              new CANNON.Material('vr-material');

            const contactMaterial =
              new CANNON.ContactMaterial(
                scene.__vrPhysicsMaterial,
                scene.__vrPhysicsMaterial,
                {
                  friction: 0.65,
                  restitution: 0.0
                }
              );

            world.addContactMaterial(
              contactMaterial
            );

          }

          if (this.el.body) {

            this.el.body.material =
              scene.__vrPhysicsMaterial;

          }

        };

        this.el.addEventListener(
          'body-loaded',
          applyMaterial
        );

        /*
         * Dans certains cas le body est déjà disponible.
         */
        setTimeout(
          applyMaterial,
          0
        );

      }

    });


    /* ============================================================
       5. GRAB / THROW PHYSIQUE
       ============================================================ */

    AFRAME.registerComponent('laser-grab', {

      schema: {

        /*
         * Multiplicateur de vitesse lors du lancer.
         *
         * 1.0 = vitesse réelle de la main
         */
        throwMultiplier: {
          default: 1.0
        },

        /*
         * Limites de sécurité pour éviter un lancer
         * complètement abusé.
         */
        maxThrowSpeed: {
          default: 12
        },

        maxAngularSpeed: {
          default: 20
        }

      },

      init: function () {

        this.grabbed = null;

        this.localPosition =
          new THREE.Vector3();

        this.localQuaternion =
          new THREE.Quaternion();

        this.tempPosition =
          new THREE.Vector3();

        this.tempQuaternion =
          new THREE.Quaternion();

        /*
         * Vitesse linéaire de la manette
         */
        this.controllerVelocity =
          new THREE.Vector3();

        this.previousControllerPosition =
          new THREE.Vector3();

        /*
         * Vitesse angulaire de la manette
         */
        this.controllerAngularVelocity =
          new THREE.Vector3();

        this.previousControllerQuaternion =
          new THREE.Quaternion();

        this.hasPreviousPosition = false;
        this.hasPreviousRotation = false;

        this.el.addEventListener(
          'triggerdown',
          () => this.startGrab()
        );

        this.el.addEventListener(
          'triggerup',
          () => this.endGrab()
        );

      },


      /* ========================================================
         DÉBUT DU GRAB
         ======================================================== */

      startGrab: function () {

        if (this.grabbed) {
          return;
        }

        const raycaster =
          this.el.components.raycaster;

        if (!raycaster) {
          return;
        }

        const intersections =
          raycaster.intersections;

        if (
          !intersections ||
          intersections.length === 0
        ) {
          return;
        }

        /*
         * On cherche le premier objet grabbable.
         */
        let target = null;

        for (let i = 0; i < intersections.length; i++) {

          const object =
            intersections[i].object;

          if (!object) continue;

          const entity =
            object.el;

          if (!entity) continue;

          if (
            entity.classList &&
            entity.classList.contains('grabbable')
          ) {

            target = entity;
            break;

          }

        }

        if (!target) {
          return;
        }

        if (!target.body) {

          console.warn(
            'Objet grabbable sans body physique:',
            target
          );

          return;

        }

        this.grabbed = target;

        const body =
          target.body;

        /*
         * --------------------------------------------------------
         * On passe temporairement le body en KINEMATIC.
         *
         * Cela signifie :
         * "la main contrôle l'objet"
         *
         * mais l'objet reste présent dans le monde physique.
         * --------------------------------------------------------
         */

        body.type =
          CANNON.Body.KINEMATIC;

        body.updateMassProperties();

        body.velocity.set(
          0,
          0,
          0
        );

        body.angularVelocity.set(
          0,
          0,
          0
        );

        body.wakeUp();

        /*
         * Position monde de la manette
         */
        const controllerWorldPosition =
          new THREE.Vector3();

        this.el.object3D.getWorldPosition(
          controllerWorldPosition
        );

        /*
         * Rotation monde de la manette
         */
        const controllerWorldQuaternion =
          new THREE.Quaternion();

        this.el.object3D.getWorldQuaternion(
          controllerWorldQuaternion
        );

        /*
         * Position monde de l'objet
         */
        const objectWorldPosition =
          new THREE.Vector3();

        target.object3D.getWorldPosition(
          objectWorldPosition
        );

        /*
         * Rotation monde de l'objet
         */
        const objectWorldQuaternion =
          new THREE.Quaternion();

        target.object3D.getWorldQuaternion(
          objectWorldQuaternion
        );

        /*
         * Relation main -> objet
         *
         * C'est cette relation qui permet de conserver
         * exactement la position où on attrape l'objet.
         */

        const inverseControllerQuaternion =
          controllerWorldQuaternion.clone().invert();

        this.localPosition
          .copy(objectWorldPosition)
          .sub(controllerWorldPosition)
          .applyQuaternion(
            inverseControllerQuaternion
          );

        this.localQuaternion
          .copy(inverseControllerQuaternion)
          .multiply(objectWorldQuaternion);

        /*
         * Reset du calcul des vitesses.
         */
        this.hasPreviousPosition = false;
        this.hasPreviousRotation = false;

        this.controllerVelocity.set(
          0,
          0,
          0
        );

        this.controllerAngularVelocity.set(
          0,
          0,
          0
        );

        /*
         * Désactive temporairement le raycast sur l'objet
         * pour éviter certains comportements parasites.
         */
        this.el.emit(
          'grab-start',
          {
            object: target
          }
        );

      },


      /* ========================================================
         FIN DU GRAB
         ======================================================== */

      endGrab: function () {

        if (!this.grabbed) {
          return;
        }

        const target =
          this.grabbed;

        const body =
          target.body;

        /*
         * On repasse en vrai corps dynamique.
         */
        body.type =
          CANNON.Body.DYNAMIC;

        body.updateMassProperties();

        /*
         * --------------------------------------------------------
         * LANCER
         *
         * La vitesse de la main devient la vitesse initiale
         * de l'objet.
         * --------------------------------------------------------
         */

        const throwVelocity =
          this.controllerVelocity
            .clone()
            .multiplyScalar(
              this.data.throwMultiplier
            );

        /*
         * Limite de sécurité.
         */
        if (
          throwVelocity.length() >
          this.data.maxThrowSpeed
        ) {

          throwVelocity.setLength(
            this.data.maxThrowSpeed
          );

        }

        body.velocity.set(
          throwVelocity.x,
          throwVelocity.y,
          throwVelocity.z
        );

        /*
         * --------------------------------------------------------
         * ROTATION / SPIN
         *
         * On transmet également la vitesse angulaire
         * de la manette.
         * --------------------------------------------------------
         */

        const angularVelocity =
          this.controllerAngularVelocity
            .clone();

        if (
          angularVelocity.length() >
          this.data.maxAngularSpeed
        ) {

          angularVelocity.setLength(
            this.data.maxAngularSpeed
          );

        }

        body.angularVelocity.set(
          angularVelocity.x,
          angularVelocity.y,
          angularVelocity.z
        );

        body.wakeUp();

        this.el.emit(
          'grab-end',
          {
            object: target,
            velocity: throwVelocity
          }
        );

        this.grabbed = null;

        this.hasPreviousPosition = false;
        this.hasPreviousRotation = false;

      },


      /* ========================================================
         CALCUL VITESSE ANGULAIRE
         ======================================================== */

      calculateAngularVelocity: function (
        currentQuaternion,
        deltaTime
      ) {

        if (deltaTime <= 0) {
          return;
        }

        /*
         * qDelta = qPrevious^-1 * qCurrent
         */
        const deltaQuaternion =
          this.previousControllerQuaternion
            .clone()
            .invert()
            .multiply(
              currentQuaternion
            )
            .normalize();

        /*
         * On prend le chemin de rotation le plus court.
         */
        if (deltaQuaternion.w < 0) {

          deltaQuaternion.x *= -1;
          deltaQuaternion.y *= -1;
          deltaQuaternion.z *= -1;
          deltaQuaternion.w *= -1;

        }

        const w =
          THREE.MathUtils.clamp(
            deltaQuaternion.w,
            -1,
            1
          );

        const angle =
          2 * Math.acos(w);

        if (angle < 0.0001) {

          this.controllerAngularVelocity
            .multiplyScalar(0.5);

          return;

        }

        const sinHalfAngle =
          Math.sqrt(
            Math.max(
              0,
              1 - w * w
            )
          );

        if (sinHalfAngle < 0.0001) {
          return;
        }

        const axis = new THREE.Vector3(
          deltaQuaternion.x /
            sinHalfAngle,

          deltaQuaternion.y /
            sinHalfAngle,

          deltaQuaternion.z /
            sinHalfAngle
        );

        /*
         * Vitesse angulaire = angle / temps
         */
        const angularSpeed =
          angle / deltaTime;

        const instantAngularVelocity =
          axis.multiplyScalar(
            angularSpeed
          );

        /*
         * Petit filtrage pour éviter le bruit du casque.
         */
        this.controllerAngularVelocity
          .lerp(
            instantAngularVelocity,
            0.6
          );

      },


      /* ========================================================
         UPDATE PENDANT LE GRAB
         ======================================================== */

      tick: function (time, delta) {

        if (!this.grabbed) {
          return;
        }

        const target =
          this.grabbed;

        if (!target.body) {
          return;
        }

        const body =
          target.body;

        const dt =
          Math.min(
            delta / 1000,
            0.05
          );

        if (dt <= 0) {
          return;
        }

        /*
         * --------------------------------------------------------
         * POSITION / ROTATION DE LA MANETTE
         * --------------------------------------------------------
         */

        const controllerWorldPosition =
          new THREE.Vector3();

        this.el.object3D.getWorldPosition(
          controllerWorldPosition
        );

        const controllerWorldQuaternion =
          new THREE.Quaternion();

        this.el.object3D.getWorldQuaternion(
          controllerWorldQuaternion
        );


        /*
         * --------------------------------------------------------
         * CALCUL VITESSE LINÉAIRE
         * --------------------------------------------------------
         */

        if (!this.hasPreviousPosition) {

          this.previousControllerPosition
            .copy(controllerWorldPosition);

          this.hasPreviousPosition = true;

        }
        else {

          const instantVelocity =
            controllerWorldPosition
              .clone()
              .sub(
                this.previousControllerPosition
              )
              .divideScalar(dt);

          /*
           * Filtrage léger.
           */
          this.controllerVelocity
            .lerp(
              instantVelocity,
              0.65
            );

          this.previousControllerPosition
            .copy(controllerWorldPosition);

        }


        /*
         * --------------------------------------------------------
         * CALCUL VITESSE ANGULAIRE
         * --------------------------------------------------------
         */

        if (!this.hasPreviousRotation) {

          this.previousControllerQuaternion
            .copy(controllerWorldQuaternion);

          this.hasPreviousRotation = true;

        }
        else {

          this.calculateAngularVelocity(
            controllerWorldQuaternion,
            dt
          );

          this.previousControllerQuaternion
            .copy(controllerWorldQuaternion);

        }


        /*
         * --------------------------------------------------------
         * POSITION FINALE DE L'OBJET
         * --------------------------------------------------------
         */

        this.tempPosition
          .copy(this.localPosition)
          .applyQuaternion(
            controllerWorldQuaternion
          )
          .add(
            controllerWorldPosition
          );


        /*
         * --------------------------------------------------------
         * ROTATION FINALE DE L'OBJET
         * --------------------------------------------------------
         */

        this.tempQuaternion
          .copy(controllerWorldQuaternion)
          .multiply(
            this.localQuaternion
          )
          .normalize();


        /*
         * --------------------------------------------------------
         * ON DONNE LA TRANSFORMATION AU BODY CANNON
         * --------------------------------------------------------
         */

        body.position.set(
          this.tempPosition.x,
          this.tempPosition.y,
          this.tempPosition.z
        );

        body.quaternion.set(
          this.tempQuaternion.x,
          this.tempQuaternion.y,
          this.tempQuaternion.z,
          this.tempQuaternion.w
        );

        /*
         * Important pour CANNON :
         * le body est déplacé manuellement.
         */
        body.aabbNeedsUpdate = true;

        body.velocity.set(
          0,
          0,
          0
        );

        body.angularVelocity.set(
          0,
          0,
          0
        );


        /*
         * --------------------------------------------------------
         * Synchronisation visuelle A-Frame
         * --------------------------------------------------------
         */

        target.object3D.position.copy(
          this.tempPosition
        );

        target.object3D.quaternion.copy(
          this.tempQuaternion
        );

      }

    });


    /* ============================================================
       6. DEBUG CONTROLLERS
       ============================================================ */

    AFRAME.registerComponent('controller-debug', {

      init: function () {

        this.el.addEventListener(
          'triggerdown',
          () => {
            console.log(
              '[VR] Trigger DOWN',
              this.el.id
            );
          }
        );

        this.el.addEventListener(
          'triggerup',
          () => {
            console.log(
              '[VR] Trigger UP',
              this.el.id
            );
          }
        );

        this.el.addEventListener(
          'thumbstickmoved',
          (event) => {

            /*
             * Décommenter si tu veux voir les valeurs
             * du joystick dans la console.
             */

            // console.log(
            //   this.el.id,
            //   event.detail
            // );

          }
        );

      }

    });

  </script>
</head>


<body>

<a-scene
  physics="
    gravity: 0 -9.81 0;
    iterations: 10;
    tolerance: 0.001;
    debug: false;
  "
  renderer="
    antialias: true;
  "
  shadow="type: pcfsoft"
>


  <!-- ==========================================================
       CIEL
       =========================================================== -->

  <a-sky
    color="#FFFFFF">
  </a-sky>


  <!-- ==========================================================
       LUMIÈRES
       =========================================================== -->

  <a-light
    type="ambient"
    color="#FFFFFF"
    intensity="0.8">
  </a-light>

  <a-light
    type="directional"
    color="#FFFFFF"
    intensity="1.2"
    position="-3 8 4"
    cast-shadow="true">
  </a-light>


  <!-- ==========================================================
       SOL VISUEL
       =========================================================== -->

  <a-plane
    position="0 0 0"
    rotation="-90 0 0"
    width="20"
    height="20"
    color="#7BC8A4"
    shadow="receive: true">
  </a-plane>


  <!-- ==========================================================
       SOL PHYSIQUE
       
       On utilise une boîte très fine plutôt qu'un simple plan.
       
       Son sommet est exactement à Y = 0.
       =========================================================== -->

  <a-box
    id="floorPhysics"
    position="0 -0.05 0"
    width="20"
    height="0.1"
    depth="20"
    visible="false"
    static-body="shape: box"
    physics-material>
  </a-box>


  <!-- ==========================================================
       RIG VR
       =========================================================== -->

  <a-entity
    id="rig"
    position="0 0 2">


    <!-- ========================================================
         CAMÉRA
         ========================================================= -->

    <a-entity
      id="camera"
      camera
      position="0 1.6 0"
      look-controls>
    </a-entity>


    <!-- ========================================================
         MAIN GAUCHE
         ========================================================= -->

    <a-entity
      id="leftHand"

      meta-touch-controls="
        hand: left;
        model: true;
      "

      laser-controls="
        hand: left;
      "

      raycaster="
        objects: .grabbable;
        far: 10;
        interval: 0;
      "

      laser-cursor
      laser-grab
      left-thumbstick-move
      controller-debug

      line="
        color: #00FFFF;
        opacity: 0.75;
      "
    >
    </a-entity>


    <!-- ========================================================
         MAIN DROITE
         ========================================================= -->

    <a-entity
      id="rightHand"

      meta-touch-controls="
        hand: right;
        model: true;
      "

      laser-controls="
        hand: right;
      "

      raycaster="
        objects: .grabbable;
        far: 10;
        interval: 0;
      "

      laser-cursor
      laser-grab
      joystick-turn
      controller-debug

      line="
        color: #00FFFF;
        opacity: 0.75;
      "
    >
    </a-entity>


  </a-entity>


  <!-- ==========================================================
       CUBE
       
       1 x 1 x 1
       Centre à Y = 1
       => il repose naturellement sur sa face inférieure.
       =========================================================== -->

  <a-box
    id="cube"

    class="grabbable physics-object"

    position="-2 1 -4"

    width="1"
    height="1"
    depth="1"

    color="#EF2D5E"

    shadow="
      cast: true;
      receive: true;
    "

    dynamic-body="
      shape: box;
      mass: 1;
      linearDamping: 0.01;
      angularDamping: 0.03;
    "

    physics-material
  >
  </a-box>


  <!-- ==========================================================
       SPHÈRE
       
       Rayon = 1
       Centre à Y = 1.25
       =========================================================== -->

  <a-sphere
    id="sphere"

    class="grabbable physics-object"

    position="2 1.25 -6"

    radius="1"

    color="#FFC65D"

    shadow="
      cast: true;
      receive: true;
    "

    dynamic-body="
      shape: sphere;
      mass: 1;
      sphereRadius: 1;
      linearDamping: 0.01;
      angularDamping: 0.03;
    "

    physics-material
  >
  </a-sphere>


  <!-- ==========================================================
       CYLINDRE
       
       Rayon = 0.5
       Hauteur = 2
       
       Axe vertical Y.
       
       Avec CANNON, il peut :
       - tomber
       - basculer
       - rouler
       - entrer en collision avec le cube
       - entrer en collision avec la sphère
       =========================================================== -->

  <a-cylinder
    id="cylinder"

    class="grabbable physics-object"

    position="-2 2 -7"

    radius="0.5"
    height="2"

    color="#4CC3D9"

    shadow="
      cast: true;
      receive: true;
    "

    dynamic-body="
      shape: cylinder;
      mass: 1;
      cylinderAxis: y;
      linearDamping: 0.01;
      angularDamping: 0.03;
    "

    physics-material
  >
  </a-cylinder>


</a-scene>

</body>
</html>
