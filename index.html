<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>VR - Grab & Movement & Physique</title>


  <!-- ============================================================
       A-FRAME
       ============================================================ -->

  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>


  <!-- ============================================================
       A-FRAME EXTRAS
       ============================================================ -->

  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.0/dist/aframe-extras.min.js"></script>


  <!-- ============================================================
       A-FRAME PHYSICS SYSTEM - CANNON.JS
       ============================================================ -->

  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.2.4/dist/aframe-physics-system.min.js"></script>


  <script>


    /* ============================================================
       1. DÉPLACEMENT JOYSTICK GAUCHE
       ============================================================ */

    AFRAME.registerComponent('left-thumbstick-move', {

      schema: {
        rig: {
          type: 'selector'
        },

        speed: {
          type: 'number',
          default: 2.0
        }
      },


      init: function () {

        this.axisX = 0;
        this.axisY = 0;

        this.onThumbstick =
          this.onThumbstick.bind(this);

        this.el.addEventListener(
          'thumbstickmoved',
          this.onThumbstick
        );
      },


      onThumbstick: function (event) {

        this.axisX =
          event.detail.x || 0;

        this.axisY =
          event.detail.y || 0;
      },


      tick: function (time, delta) {

        if (!this.data.rig) return;

        if (!delta) return;


        const x = this.axisX;

        const z = -this.axisY;


        if (
          Math.abs(x) < 0.05 &&
          Math.abs(z) < 0.05
        ) {
          return;
        }


        const dt =
          delta / 1000;


        const direction =
          new THREE.Vector3(
            x,
            0,
            z
          );


        direction.applyAxisAngle(
          new THREE.Vector3(0, 1, 0),
          this.data.rig.object3D.rotation.y
        );


        this.data.rig.object3D.position.x +=
          direction.x *
          this.data.speed *
          dt;


        this.data.rig.object3D.position.z +=
          direction.z *
          this.data.speed *
          dt;

      }

    });



    /* ============================================================
       2. ROTATION JOYSTICK DROIT
       ============================================================ */

    AFRAME.registerComponent('joystick-turn', {

      schema: {

        speed: {
          type: 'number',
          default: 1.8
        }

      },


      init: function () {

        this.axisX = 0;


        this.el.addEventListener(
          'thumbstickmoved',
          (event) => {

            this.axisX =
              event.detail.x || 0;

          }
        );

      },


      tick: function (time, delta) {

        if (!delta) return;


        if (
          Math.abs(this.axisX) < 0.1
        ) {
          return;
        }


        const dt =
          delta / 1000;


        this.el.parentEl.object3D.rotation.y -=
          this.axisX *
          this.data.speed *
          dt;

      }

    });



    /* ============================================================
       3. CURSEUR LASER
       ============================================================ */

    AFRAME.registerComponent('laser-cursor', {

      schema: {

        color: {
          type: 'color',
          default: '#00FFFF'
        }

      },


      init: function () {

        this.cursor =
          document.createElement('a-sphere');


        this.cursor.setAttribute(
          'radius',
          '0.018'
        );


        this.cursor.setAttribute(
          'color',
          this.data.color
        );


        this.cursor.setAttribute(
          'visible',
          'false'
        );


        this.cursor.setAttribute(
          'material',
          'shader: flat; opacity: 0.95'
        );


        this.el.sceneEl.appendChild(
          this.cursor
        );


        this.onIntersection =
          this.onIntersection.bind(this);


        this.onClear =
          this.onClear.bind(this);


        this.el.addEventListener(
          'raycaster-intersection',
          this.onIntersection
        );


        this.el.addEventListener(
          'raycaster-intersection-cleared',
          this.onClear
        );

      },


      onIntersection: function (event) {

        const raycaster =
          this.el.components.raycaster;


        if (!raycaster) return;


        const intersections =
          raycaster.intersections;


        if (
          !intersections ||
          intersections.length === 0
        ) {
          return;
        }


        const hit =
          intersections[0];


        if (
          !hit ||
          !hit.point
        ) {
          return;
        }


        if (
          !hit.object ||
          !hit.object.el
        ) {
          return;
        }


        let target =
          hit.object.el;


        /*
         * Si le rayon touche un mesh enfant,
         * on remonte jusqu'au .grabbable.
         */

        while (
          target &&
          !target.classList.contains('grabbable') &&
          target.parentEl
        ) {

          target =
            target.parentEl;

        }


        if (
          !target ||
          !target.classList.contains('grabbable')
        ) {

          this.cursor.setAttribute(
            'visible',
            'false'
          );

          return;
        }


        this.cursor.object3D.position.copy(
          hit.point
        );


        this.cursor.setAttribute(
          'visible',
          'true'
        );

      },


      onClear: function () {

        this.cursor.setAttribute(
          'visible',
          'false'
        );

      },


      remove: function () {

        if (this.cursor) {

          this.cursor.remove();

        }


        this.el.removeEventListener(
          'raycaster-intersection',
          this.onIntersection
        );


        this.el.removeEventListener(
          'raycaster-intersection-cleared',
          this.onClear
        );

      }

    });



    /* ============================================================
       4. MATÉRIAU PHYSIQUE

       Très important :

       restitution = 0

       => pas de rebond "balle".

       friction élevée
       => les objets ne glissent pas de manière excessive.

       Tous les objets + le sol utilisent le même matériau.
       ============================================================ */

    AFRAME.registerComponent('vr-physics-material', {

      init: function () {

        this.applyMaterial =
          this.applyMaterial.bind(this);


        this.el.addEventListener(
          'body-loaded',
          this.applyMaterial
        );


        /*
         * Dans certains cas le body existe déjà.
         */

        setTimeout(
          this.applyMaterial,
          100
        );

      },


      applyMaterial: function () {

        const scene =
          this.el.sceneEl;


        if (
          !window.CANNON
        ) {
          return;
        }


        if (
          !scene.systems.physics ||
          !scene.systems.physics.driver ||
          !scene.systems.physics.driver.world
        ) {
          return;
        }


        const world =
          scene.systems.physics.driver.world;


        /*
         * Création du matériau une seule fois.
         */

        if (
          !scene.__vrMaterial
        ) {

          scene.__vrMaterial =
            new CANNON.Material(
              'vr-material'
            );


          /*
           * Collision entre deux objets ayant ce matériau.
           */

          const contactMaterial =
            new CANNON.ContactMaterial(
              scene.__vrMaterial,
              scene.__vrMaterial,
              {
                friction: 0.65,

                /*
                 * ZÉRO REBOND.
                 */
                restitution: 0.0
              }
            );


          world.addContactMaterial(
            contactMaterial
          );

        }


        if (this.el.body) {

          this.el.body.material =
            scene.__vrMaterial;

        }

      }

    });



    /* ============================================================
       5. GRAB + THROW

       Pendant le grab :
         objet = KINEMATIC

       Au lâcher :
         objet = DYNAMIC

       La vitesse de la manette est transférée à l'objet.

       La rotation de la manette est également transférée.
       ============================================================ */

    AFRAME.registerComponent('laser-grab', {

      schema: {

        rig: {
          type: 'selector'
        },


        floorY: {
          type: 'number',
          default: 0
        },


        /*
         * 1.0 = vitesse réelle de la main
         *
         * On évite 1.25 car cela pouvait produire
         * des lancers trop violents.
         */

        throwVelocityMultiplier: {
          type: 'number',
          default: 1.0
        },


        throwSpinMultiplier: {
          type: 'number',
          default: 1.0
        },


        /*
         * Sécurité pour éviter les vitesses absurdes.
         */

        maxThrowSpeed: {
          type: 'number',
          default: 10
        },


        maxSpinSpeed: {
          type: 'number',
          default: 15
        }

      },


      init: function () {

        this.grabbed = null;


        /*
         * Position/rotation relative main -> objet.
         */

        this.localPosition =
          new THREE.Vector3();


        this.localQuaternion =
          new THREE.Quaternion();


        /*
         * Transformations contrôleur.
         */

        this.controllerPosition =
          new THREE.Vector3();


        this.controllerQuaternion =
          new THREE.Quaternion();


        this.tempPosition =
          new THREE.Vector3();


        this.tempQuaternion =
          new THREE.Quaternion();


        /*
         * Vitesse linéaire.
         */

        this.prevControllerPosition =
          new THREE.Vector3();


        this.controllerVelocity =
          new THREE.Vector3();


        this.hasPrevPosition =
          false;


        /*
         * Vitesse angulaire.
         */

        this.prevControllerQuaternion =
          new THREE.Quaternion();


        this.controllerAngularVelocity =
          new THREE.Vector3();


        this.hasPrevQuaternion =
          false;


        this.deltaQuaternion =
          new THREE.Quaternion();


        this.rotationAxis =
          new THREE.Vector3();


        /*
         * Masse originale.
         */

        this.grabbedOriginalMass =
          1;


        this.el.addEventListener(
          'triggerdown',
          () => {

            this.startGrab();

          }
        );


        this.el.addEventListener(
          'triggerup',
          () => {

            this.endGrab();

          }
        );

      },


      /* ==========================================================
         DÉBUT GRAB
         ========================================================== */

      startGrab: function () {

        console.log(
          'TRIGGER DOWN'
        );


        const raycaster =
          this.el.components.raycaster;


        if (!raycaster) {

          console.warn(
            'Raycaster absent'
          );

          return;

        }


        const intersections =
          raycaster.intersections;


        if (
          !intersections ||
          intersections.length === 0
        ) {

          console.log(
            'Aucun objet touché'
          );

          return;

        }


        let target = null;


        /*
         * Cherche le premier .grabbable.
         */

        for (
          let i = 0;
          i < intersections.length;
          i++
        ) {

          let candidate =
            intersections[i].object &&
            intersections[i].object.el;


          while (
            candidate &&
            !candidate.classList.contains('grabbable') &&
            candidate.parentEl
          ) {

            candidate =
              candidate.parentEl;

          }


          if (
            candidate &&
            candidate.classList.contains('grabbable')
          ) {

            target =
              candidate;

            break;

          }

        }


        if (!target) {

          return;

        }


        if (!target.body) {

          console.warn(
            'Objet sans body physique :',
            target.id
          );

          return;

        }


        console.log(
          'GRAB :',
          target.id
        );


        this.grabbed =
          target;


        /*
         * Position monde de la manette.
         */

        this.el.object3D.getWorldPosition(
          this.controllerPosition
        );


        /*
         * Rotation monde de la manette.
         */

        this.el.object3D.getWorldQuaternion(
          this.controllerQuaternion
        );


        /*
         * Position/rotation monde de l'objet.
         */

        const objectWorldPosition =
          new THREE.Vector3();


        const objectWorldQuaternion =
          new THREE.Quaternion();


        target.object3D.getWorldPosition(
          objectWorldPosition
        );


        target.object3D.getWorldQuaternion(
          objectWorldQuaternion
        );


        /*
         * Position relative main -> objet.
         */

        this.localPosition
          .copy(objectWorldPosition)
          .sub(this.controllerPosition)
          .applyQuaternion(
            this.controllerQuaternion
              .clone()
              .invert()
          );


        /*
         * Rotation relative main -> objet.
         */

        this.localQuaternion
          .copy(
            this.controllerQuaternion
              .clone()
              .invert()
          )
          .multiply(
            objectWorldQuaternion
          );


        /*
         * ========================================================
         * PASSAGE EN KINEMATIC
         * ========================================================
         */

        const body =
          target.body;


        this.grabbedOriginalMass =
          body.mass;


        /*
         * On annule les anciennes vitesses.
         */

        body.velocity.set(
          0,
          0,
          0
        );


        body.angularVelocity.set(
          0,
          0,
          0
        );


        /*
         * Kinematic = la main contrôle le body.
         */

        body.type =
          CANNON.Body.KINEMATIC;


        body.updateMassProperties();


        body.wakeUp();


        /*
         * Reset vitesse.
         */

        this.controllerVelocity.set(
          0,
          0,
          0
        );


        this.controllerAngularVelocity.set(
          0,
          0,
          0
        );


        this.hasPrevPosition =
          false;


        this.hasPrevQuaternion =
          false;


        target.classList.add(
          'grabbed'
        );


        target.emit(
          'grab-start'
        );

      },


      /* ==========================================================
         FIN GRAB / THROW
         ========================================================== */

      endGrab: function () {

        if (!this.grabbed) {
          return;
        }


        const object =
          this.grabbed;


        const body =
          object.body;


        if (body) {

          /*
           * ------------------------------------------------------
           * VITESSE LINÉAIRE
           * ------------------------------------------------------
           */

          const velocity =
            this.controllerVelocity
              .clone()
              .multiplyScalar(
                this.data.throwVelocityMultiplier
              );


          /*
           * Empêche un lancer complètement aberrant.
           */

          if (
            velocity.length() >
            this.data.maxThrowSpeed
          ) {

            velocity.setLength(
              this.data.maxThrowSpeed
            );

          }


          /*
           * ------------------------------------------------------
           * VITESSE ANGULAIRE
           * ------------------------------------------------------
           */

          const angularVelocity =
            this.controllerAngularVelocity
              .clone()
              .multiplyScalar(
                this.data.throwSpinMultiplier
              );


          if (
            angularVelocity.length() >
            this.data.maxSpinSpeed
          ) {

            angularVelocity.setLength(
              this.data.maxSpinSpeed
            );

          }


          /*
           * ------------------------------------------------------
           * RETOUR EN DYNAMIC
           * ------------------------------------------------------
           */

          body.mass =
            this.grabbedOriginalMass;


          body.type =
            CANNON.Body.DYNAMIC;


          body.updateMassProperties();


          /*
           * Application du lancer.
           */

          body.velocity.set(
            velocity.x,
            velocity.y,
            velocity.z
          );


          body.angularVelocity.set(
            angularVelocity.x,
            angularVelocity.y,
            angularVelocity.z
          );


          body.wakeUp();


          console.log(
            'THROW velocity:',
            velocity
          );


          console.log(
            'THROW angular:',
            angularVelocity
          );

        }


        object.classList.remove(
          'grabbed'
        );


        object.emit(
          'grab-end'
        );


        this.grabbed =
          null;


        this.hasPrevPosition =
          false;


        this.hasPrevQuaternion =
          false;

      },


      /* ==========================================================
         UPDATE DU GRAB
         ========================================================== */

      tick: function (time, delta) {

        if (!this.grabbed) {
          return;
        }


        const entity =
          this.grabbed;


        const object =
          entity.object3D;


        const body =
          entity.body;


        if (!body) {
          return;
        }


        const dt =
          delta / 1000;


        if (
          dt <= 0 ||
          dt > 0.1
        ) {
          return;
        }


        /*
         * --------------------------------------------------------
         * POSITION CONTROLLER
         * --------------------------------------------------------
         */

        this.el.object3D.getWorldPosition(
          this.controllerPosition
        );


        /*
         * --------------------------------------------------------
         * ROTATION CONTROLLER
         * --------------------------------------------------------
         */

        this.el.object3D.getWorldQuaternion(
          this.controllerQuaternion
        );


        /*
         * ========================================================
         * VITESSE LINÉAIRE
         * ========================================================
         */

        if (
          this.hasPrevPosition
        ) {

          const instantVelocity =
            new THREE.Vector3()
              .subVectors(
                this.controllerPosition,
                this.prevControllerPosition
              )
              .divideScalar(dt);


          /*
           * Lissage raisonnable.
           *
           * Trop de lissage = lancer mou.
           * Pas assez = bruit du casque.
           */

          this.controllerVelocity.lerp(
            instantVelocity,
            0.65
          );

        }


        this.prevControllerPosition.copy(
          this.controllerPosition
        );


        this.hasPrevPosition =
          true;


        /*
         * ========================================================
         * VITESSE ANGULAIRE
         * ========================================================
         */

        if (
          this.hasPrevQuaternion
        ) {

          /*
           * qDelta =
           * qCurrent * inverse(qPrevious)
           */

          this.deltaQuaternion
            .copy(
              this.controllerQuaternion
            )
            .multiply(
              this.prevControllerQuaternion
                .clone()
                .invert()
            );


          let w =
            this.deltaQuaternion.w;


          w =
            THREE.MathUtils.clamp(
              w,
              -1,
              1
            );


          /*
           * Chemin de rotation le plus court.
           */

          if (w < 0) {

            this.deltaQuaternion.x *= -1;
            this.deltaQuaternion.y *= -1;
            this.deltaQuaternion.z *= -1;
            this.deltaQuaternion.w *= -1;

            w = -w;

          }


          const angle =
            2 *
            Math.acos(w);


          const s =
            Math.sqrt(
              Math.max(
                0,
                1 - w * w
              )
            );


          if (
            s > 0.0001 &&
            angle < Math.PI
          ) {

            this.rotationAxis.set(

              this.deltaQuaternion.x / s,

              this.deltaQuaternion.y / s,

              this.deltaQuaternion.z / s

            );


            const instantAngularVelocity =
              this.rotationAxis
                .clone()
                .multiplyScalar(
                  angle / dt
                );


            this.controllerAngularVelocity.lerp(
              instantAngularVelocity,
              0.65
            );

          }

        }


        this.prevControllerQuaternion.copy(
          this.controllerQuaternion
        );


        this.hasPrevQuaternion =
          true;


        /*
         * ========================================================
         * NOUVELLE POSITION DE L'OBJET
         * ========================================================
         */

        this.tempPosition
          .copy(this.localPosition)
          .applyQuaternion(
            this.controllerQuaternion
          )
          .add(
            this.controllerPosition
          );


        /*
         * ========================================================
         * NOUVELLE ROTATION DE L'OBJET
         * ========================================================
         */

        this.tempQuaternion
          .copy(
            this.controllerQuaternion
          )
          .multiply(
            this.localQuaternion
          )
          .normalize();


        /*
         * ========================================================
         * ON DÉPLACE DIRECTEMENT LE BODY CANNON
         *
         * C'est important :
         * pendant le grab, on ne demande pas à A-Frame de
         * reconstruire la position puis au moteur de la deviner.
         *
         * On donne directement la transformation au body.
         * ========================================================
         */

        body.position.set(

          this.tempPosition.x,

          this.tempPosition.y,

          this.tempPosition.z

        );


        body.quaternion.set(

          this.tempQuaternion.x,

          this.tempQuaternion.y,

          this.tempQuaternion.z,

          this.tempQuaternion.w

        );


        body.velocity.set(
          0,
          0,
          0
        );


        body.angularVelocity.set(
          0,
          0,
          0
        );


        body.aabbNeedsUpdate =
          true;


        body.wakeUp();


        /*
         * ========================================================
         * SYNCHRONISATION A-FRAME
         * ========================================================
         */

        object.position.copy(
          this.tempPosition
        );


        object.quaternion.copy(
          this.tempQuaternion
        );

      }

    });



    /* ============================================================
       6. DEBUG CONTRÔLEURS
       ============================================================ */

    AFRAME.registerComponent('controller-debug', {

      init: function () {

        this.el.addEventListener(
          'triggerdown',
          () => {

            console.log(
              'DEBUG → TRIGGER DOWN',
              this.el.id
            );

          }
        );


        this.el.addEventListener(
          'triggerup',
          () => {

            console.log(
              'DEBUG → TRIGGER UP',
              this.el.id
            );

          }
        );


        this.el.addEventListener(
          'thumbstickmoved',
          (event) => {

            console.log(
              'STICK',
              this.el.id,
              event.detail.x,
              event.detail.y
            );

          }
        );

      }

    });

  </script>
</head>


<body>

<a-scene

  background="
    color: #111111
  "

  renderer="
    antialias: true;
    colorManagement: true;
    physicallyCorrectLights: true;
  "

  vr-mode-ui="
    enabled: true
  "

  /*
   * ============================================================
   * PHYSIQUE
   * ============================================================
   *
   * gravity = gravité normale
   *
   * restitution = 0
   * => PAS DE REBOND
   *
   * iterations = précision du solveur
   *
   * debug = false
   *
   */

  physics="
    gravity: 0 -9.81 0;
    iterations: 15;
    tolerance: 0.001;
    debug: false;
  "
>


  <!-- ==========================================================
       CIEL
       ========================================================== -->

  <a-sky
    color="#FFFFFF">
  </a-sky>


  <!-- ==========================================================
       LUMIÈRES
       ========================================================== -->

  <a-entity
    light="
      type: ambient;
      intensity: 0.7;
    "
  >
  </a-entity>


  <a-entity
    light="
      type: directional;
      intensity: 1;
      castShadow: true;
    "
    position="-2 5 3"
  >
  </a-entity>


  <!-- ==========================================================
       SOL VISUEL
       ========================================================== -->

  <a-plane

    position="0 0 0"

    rotation="-90 0 0"

    width="20"

    height="20"

    color="#7BC8A4"

    shadow="
      receive: true
    "

  >
  </a-plane>


  <!-- ==========================================================
       SOL PHYSIQUE
       ==========================================================

       Boîte très fine.

       Son dessus est exactement à Y = 0 :

       centre = -0.05
       hauteur = 0.10

       => sommet = 0

       C'est plus fiable qu'un plan physique pour notre cas.
       ========================================================== -->

  <a-box

    id="floorPhysics"

    position="0 -0.05 0"

    width="20"

    height="0.1"

    depth="20"

    visible="false"

    static-body="
      shape: box
    "

    vr-physics-material

  >
  </a-box>



  <!-- ==========================================================
       RIG VR
       ========================================================== -->

  <a-entity

    id="rig"

    position="0 0 2"

  >


    <!-- ========================================================
         CAMÉRA
         ======================================================== -->

    <a-camera

      id="camera"

      position="0 1.6 0"

      look-controls="
        enabled: true
      "

    >
    </a-camera>



    <!-- ========================================================
         MAIN GAUCHE
         ======================================================== -->

    <a-entity

      id="leftHand"

      meta-touch-controls="
        hand: left;
        model: true;
      "

      laser-controls="
        hand: left;
      "

      raycaster="
        objects: .grabbable;
        far: 10;
        interval: 0;
      "

      laser-cursor="
        color: #00FFFF;
      "

      laser-grab="
        rig: #rig;
        floorY: 0;
        throwVelocityMultiplier: 1.0;
        throwSpinMultiplier: 1.0;
        maxThrowSpeed: 10;
        maxSpinSpeed: 15;
      "

      left-thumbstick-move="
        rig: #rig;
        speed: 2.0;
      "

      controller-debug

      line="
        color: #00FFFF;
        opacity: 0.8;
      "

    >
    </a-entity>



    <!-- ========================================================
         MAIN DROITE
         ======================================================== -->

    <a-entity

      id="rightHand"

      meta-touch-controls="
        hand: right;
        model: true;
      "

      laser-controls="
        hand: right;
      "

      raycaster="
        objects: .grabbable;
        far: 10;
        interval: 0;
      "

      laser-cursor="
        color: #00FFFF;
      "

      laser-grab="
        rig: #rig;
        floorY: 0;
        throwVelocityMultiplier: 1.0;
        throwSpinMultiplier: 1.0;
        maxThrowSpeed: 10;
        maxSpinSpeed: 15;
      "

      joystick-turn="
        speed: 1.8;
      "

      controller-debug

      line="
        color: #00FFFF;
        opacity: 0.8;
      "

    >
    </a-entity>


  </a-entity>



  <!-- ==========================================================
       CUBE
       ==========================================================

       Le cube :

       - masse = 5
       - vrai corps dynamique
       - collisions avec les autres objets
       - peut tomber d'une arête
       - peut basculer
       - peut être lancé
       - peut recevoir un choc

       angularDamping assez faible pour conserver un mouvement
       naturel lorsqu'il tourne.
       ========================================================== -->

  <a-box

    id="box"

    class="grabbable"

    position="-2 1 -4"

    width="1"

    height="1"

    depth="1"

    color="#4CC3D9"

    shadow="
      cast: true;
      receive: true;
    "

    dynamic-body="
      shape: box;
      mass: 5;
      linearDamping: 0.03;
      angularDamping: 0.08;
    "

    vr-physics-material

  >
  </a-box>



  <!-- ==========================================================
       SPHÈRE
       ========================================================== -->

  <a-sphere

    id="sphere"

    class="grabbable"

    position="2 1.25 -6"

    radius="1"

    color="#EF2D5E"

    shadow="
      cast: true;
      receive: true;
    "

    dynamic-body="
      shape: sphere;
      sphereRadius: 1;
      mass: 3;
      linearDamping: 0.02;
      angularDamping: 0.04;
    "

    vr-physics-material

  >
  </a-sphere>



  <!-- ==========================================================
       CYLINDRE
       ==========================================================

       Le cylindre est volontairement assez libre en rotation.

       Il peut donc :

       - tomber sur le côté
       - rouler
       - entrer en collision avec le cube
       - être lancé
       - tourner sur lui-même
       ========================================================== -->

  <a-cylinder

    id="cylinder"

    class="grabbable"

    position="-2 2 -7"

    radius="0.5"

    height="2"

    color="#FFC65D"

    shadow="
      cast: true;
      receive: true;
    "

    dynamic-body="
      shape: cylinder;
      cylinderAxis: y;
      mass: 4;
      linearDamping: 0.03;
      angularDamping: 0.08;
    "

    vr-physics-material

  >
  </a-cylinder>


</a-scene>

</body>
</html>
