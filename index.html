<!DOCTYPE html>
    <html lang="fr">
        <head>
            <meta charset="utf-8">
            <title>Exercice 1 - SceneVR</title>

            <!-- A-Frame -->
            <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
            <!-- movement-controls -->
            <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
        </head>

        <body>
            <script>
            // Rotation avec le joystick droit
            AFRAME.registerComponent("joystick-turn", {
                schema: {
                rotationSpeed: {type: "number", default: 120},
                deadzone: {type: "number", default: 0.2}
                },

                init: function () {
                this.rotationInput = 0;
                const rightHand = document.querySelector("#rightHand");

                rightHand.addEventListener("thumbstickmoved", (evt) => {
                    const x = evt.detail.x;
                    this.rotationInput = Math.abs(x) > this.data.deadzone ? x : 0;
                });
                },

                tick: function (time, deltaTime) {
                if (!this.rotationInput) return;

                const rot = this.el.getAttribute("rotation");

                this.el.setAttribute("rotation", {
                    x: rot.x,
                    y: rot.y - this.rotationInput * this.data.rotationSpeed * deltaTime / 1000,
                    z: rot.z
                });
                }
            });
            </script>

            <a-scene
            renderer="antialias: true"
            shadow="type: pcfsoft; autoUpdate: true"
            webxr="optionalFeatures: local-floor">
            <a-entity
                light="type: directional;
                       intensity: 1;
                       castShadow: true;
                       shadowMapWidth: 2048;
                       shadowMapHeight: 2048;
                       shadowCameraLeft: -8;
                       shadowCameraRight: 8;
                       shadowCameraTop: 8;
                       shadowCameraBottom: -8;
                       shadowCameraNear: 0.5;
                       shadowCameraFar: 20;
                       shadowBias: -0.001;
                       shadowRadius: 1.5"
                position="3 6 2">
            </a-entity>

            <!-- Lumière ambiante -->
            <a-entity
                light="type: ambient; intensity: 0.5; color: #BBBBBB">
            </a-entity>

            <a-plane
                rotation="-90 0 0"
                width="20"
                height="20"
                color="#7BC8A4"
                shadow="receive: true">
            </a-plane>

            <a-box
                position="-2 1 -4"
                rotation="0 45 0"
                color="#4CC3D9"
                shadow="cast: true; receive: true">
            </a-box>

            <a-sphere
                position="2 1.25 -6"
                radius="1.25"
                color="#EF2D5E"
                shadow="cast: true; receive: true">
            </a-sphere>

            <a-cylinder
                position="-2 2 -7"
                color="#FFC65D"
                radius="0.5"
                height="2"
                shadow="cast: true; receive: true">
            </a-cylinder>

            <!-- Joueur -->
            <a-entity
                id="rig"
                position="0 0 2"
                movement-controls="speed: 0.2; fly: false"
                joystick-turn>

                <!-- Caméra -->
                <a-entity
                camera
                position="0 1.6 0"
                look-controls="pointerLockEnabled: false">
                </a-entity>

                <!-- Main gauche : déplacement -->
                <a-entity
                id="leftHand"
                oculus-touch-controls="hand: left">
                </a-entity>

                <!-- Main droite : rotation -->
                <a-entity
                id="rightHand"
                oculus-touch-controls="hand: right">
                </a-entity>

            </a-entity>

            <!-- Ciel -->
            <a-sky color="#ECECEC"></a-sky>

            </a-scene>

        </body>
    </html>
